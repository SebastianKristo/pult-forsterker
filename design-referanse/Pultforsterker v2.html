<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Pultforsterker v2 – frontpanel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#ece9e3;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#1d1d1c}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
  #panel{position:fixed;top:16px;left:16px;width:248px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid rgba(20,20,19,.12);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;font-size:12px;z-index:5}
  #panel h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.01em}
  #panel .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6b6a66;margin-bottom:6px}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .row button{flex:1;appearance:none;border:1px solid rgba(20,20,19,.18);background:#fff;border-radius:6px;padding:6px 8px;font:inherit;font-size:11px;cursor:pointer;color:#1d1d1c}
  .row button.on{background:#1d1d1c;color:#fff;border-color:#1d1d1c}
  input[type=range]{width:100%;accent-color:#1d1d1c}
  a{color:#1d1d1c} a:hover{color:#000}
</style>
</head>
<body>
<three-d-stage name="pultforsterker"></three-d-stage>
<div id="panel">
  <h1>Pultforsterker v2 · frontpanel</h1>
  <div><div class="lbl">Variant</div><div class="row"><button id="vFree" class="on">Frittstående</button><button id="vMount">Pultfeste</button></div></div>
  <div><div class="lbl">Inngang · hold AirPlay 2 s = Bluetooth av/på</div><div class="row" id="inputs"></div><div class="row" style="margin-top:6px"><button id="btPair" class="on">Bluetooth: tilkoblet</button></div></div>
  <div><div class="lbl">Avspilling</div><div class="row"><button id="play" class="on">❚❚ Pause</button></div></div>
  <div><div class="lbl">Volum <span id="volv">42</span></div><input id="vol" type="range" min="0" max="100" value="42"><div class="row" style="margin-top:6px"><button id="mute">Mute av</button></div></div>
  <div><div class="lbl">Strøm · POWER: trykk = av/på, hold 3 s = omstart</div><div class="row">
    <button id="stby" class="on">På</button>
    <button id="pwr" class="on">Hovedbryter på</button>
    </div><div class="row" style="margin-top:6px"><button id="open">Åpne lokk</button></div></div>
  <div><div class="lbl">Utskrift (STL, mm)</div><div class="row">
    <button id="stlLid">Lokk</button>
    <button id="stlBody">Kasse</button>
    <button id="stlGlass">Vindu</button>
  </div></div>
</div>
<script src="three-d-stage.js"></script>
<script type="module" src="pultforsterker_v2.js"></script>
</body>
</html>
