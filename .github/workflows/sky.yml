#
# Skjold-hjem: bygg web-UI-et (skjold/app) og legg ut Workeren skjold/sky (Cloudflare) ved push til main.
# Krever secrets i GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API-token med «Workers Scripts: Edit» (+ «Workers Routes: Edit» hvis ruten står i wrangler.toml)
#   CLOUDFLARE_ACCOUNT_ID  – konto-ID
# Uten disse hoppes deploy over med en advarsel (testene kjøres uansett). Se skjold/sky/README.md for Access-oppsettet.
#
name: Sky

on:
  push:
    branches: [main]
    paths: ["skjold/sky/**", "skjold/app/**", ".github/workflows/sky.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sky-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    env:
      HAR_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Workeren
        working-directory: skjold/sky
        run: npm ci && npm test
      - name: Bygg web-UI
        if: env.HAR_TOKEN == 'true'
        working-directory: skjold/app
        run: npm ci && npm run build
      - name: Legg ut
        if: env.HAR_TOKEN == 'true'
        working-directory: skjold/sky
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Mangler secrets
        if: env.HAR_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID mangler – Skjold-hjem ble ikke lagt ut."
