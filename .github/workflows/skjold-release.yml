#
# Skjold – bygg og publiser det Skjold-enhetene trenger: web-UI (dist), fastvare for Røst og Kassett, Skjold-kortet for
# Home Assistant, bruksanvisning (PDF) og 3D-filer. Appene (Android/iOS) og Skjold Flasher har egne utgivelser:
# app-release.yml (app-v*) og flasher-release.yml (flasher-v*). Start alle tre fra «Ny release».
#
# Utløses av en tag på formen  skjold-v1.2.3  eller manuelt fra Actions-fanen («Run workflow»).
#
name: Skjold release

on:
  push:
    tags: ["skjold-v*"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Beta (prerelease) – vises bare for enheter på beta-kanalen"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # starter Nettside-publiseringen etter releasen (henter Røst-fastvaren til /flasher/rost/)

env:
  NODE_VERSION: 22

jobs:
  web:
    name: Web-UI (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: skjold/app/package-lock.json
      - name: Installer og bygg web
        working-directory: skjold/app
        run: |
          npm ci
          npm run build
          cd dist && zip -r ../../../skjold-web-${GITHUB_REF_NAME}.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: skjold-web-*.zip

  manual:
    name: Bruksanvisning (PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Render PDF med Playwright
        working-directory: skjold/bruksanvisning
        run: |
          pip install playwright
          # Byggemaskinen har vanligvis bibliotekene Chromium trenger fra før. Installer derfor bare nettleseren, og
          # prøv den. Systempakkene hentes med apt (som ikke alltid når Ubuntus servere) bare hvis nettleseren ikke starter.
          python -m playwright install chromium
          if ! timeout 60 python -c "exec('from playwright.sync_api import sync_playwright\nwith sync_playwright() as p: p.chromium.launch().close()')"; then
            for i in 1 2 3; do
              timeout 300 python -m playwright install-deps chromium && break
              echo "playwright install-deps feilet (forsøk $i av 3) – venter 20 s"; sleep 20
            done
          fi
          python render_pdf.py
          cp *.pdf ../../ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: bruksanvisning
          path: "*.pdf"

  print3d:
    name: 3D-filer (skjold-3d-print.zip – alle produktene, én mappe per produkt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pakk alle 3D-filene i én ryddig zip (én mappe per produkt)
        run: |
          python3 kabinett/tools/pakk_3d.py ut
          ls -la ut
      - uses: actions/upload-artifact@v4
        with:
          name: print3d
          path: ut/*

  hakort:
    name: Skjold-kort for Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sjekk at kortet er bygget fra kilden
        working-directory: ha-kort
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- dist/skjold-card.js ../custom_components/skjold/www/skjold-cards.js || { echo "::error::Kjør «npm run build» i ha-kort og sjekk inn dist"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: hakort
          path: ha-kort/dist/skjold-card.js

  rostfw:
    name: Fastvare for Skjold Røst (squeezelite-esp32 + Skjold-oppsett)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bygg skjold-rost-firmware.bin
        run: |
          pip install -q esptool==4.8.1 esp-idf-nvs-partition-gen==0.3.0
          python3 firmware/rost/lag_firmware.py --ut ut
          mv ut/manifest.json ut/skjold-rost-manifest.json
          ls -la ut
      - uses: actions/upload-artifact@v4
        with:
          name: rostfw
          path: |
            ut/skjold-rost-firmware.bin
            ut/skjold-rost-manifest.json

  kassettfw:
    name: Fastvare for Skjold Kassett (ESPHome, nettleserflashing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-2026.10.2-esp32s3
      - name: Bygg skjold-kassett-firmware.bin
        env:
          VERSJON: ${{ github.ref_name }}
        run: |
          pip install -q esphome==2026.10.2
          python3 esphome/lag_kassett_ferdig.py ut
          (cd ut && esphome compile skjold-kassett.yaml)
          cp ut/.esphome/build/skjold-kassett/build/firmware.factory.bin ut/skjold-kassett-firmware.bin
          ls -la ut/skjold-kassett-firmware.bin ut/skjold-kassett-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: kassettfw
          path: |
            ut/skjold-kassett-firmware.bin
            ut/skjold-kassett-manifest.json

  release:
    name: GitHub Release
    needs: [web, manual, print3d, rostfw, kassettfw, hakort]
    # Releasen publiseres når web og PDF gikk gjennom; fastvare/3D/HA-kort som ble bygget kommer med.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.web.result == 'success' && needs.manual.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artefakter, merge-multiple: true }
      - name: Liste
        run: ls -la artefakter
      - uses: softprops/action-gh-release@v2
        with:
          name: Skjold ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: ${{ github.event.inputs.prerelease != 'true' }}   # «latest» er alltid enhetsutgivelsen (nettsiden og web-UI leser den)
          files: artefakter/**
      - name: Oppdater nettsiden (Røst- og Kassett-fastvaren til nettleserflashing)
        if: ${{ github.event.inputs.prerelease != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nettside.yml --ref main -R "${{ github.repository }}"
