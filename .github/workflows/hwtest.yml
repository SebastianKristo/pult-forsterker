#
# Maskinvaretester på en ekte Skjold-Pi (self-hosted runner med etiketten skjold-hw, se hwtest/setup_runner.md).
# Kjører etter «Skjold release», manuelt, og på PR-er med etiketten «hw-test». Er ingen runner online, hoppes det over (grønt).
#
name: Maskinvaretest

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Skjold release"]
    types: [completed]
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: hwtest
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'hw-test') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      ok: ${{ steps.r.outputs.ok }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ secrets.HWTEST_RUNNER_TOKEN || github.token }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/actions/runners" \
                --jq '[.runners[] | select(.status=="online" and ([.labels[].name] | index("skjold-hw")))] | length' 2>/dev/null || echo "")
          if [ -z "$N" ]; then
            # GITHUB_TOKEN kan ikke lese runner-listen; da prøver vi likevel (jobben venter i kø til en runner dukker opp).
            echo "::notice::Kunne ikke lese runner-listen (sett secret HWTEST_RUNNER_TOKEN med admin:read). Prøver likevel."
            echo "ok=${{ vars.HWTEST_ENABLED == '1' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          elif [ "$N" -gt 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Ingen skjold-hw-runner online – maskinvaretesten hoppes over."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

  hwtest:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: [self-hosted, skjold-hw]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Installer denne committen
        run: sudo bash "$GITHUB_WORKSPACE/pi/update.sh"
      - name: Kjør maskinvaretester
        env:
          HWTEST_OUT: ${{ github.workspace }}/hwtest-out
        run: python3 hwtest/run.py
      - name: Sammendrag
        if: always()
        run: cat hwtest-out/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Ingen sammendrag." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hwtest-out
          path: hwtest-out/
          if-no-files-found: ignore
