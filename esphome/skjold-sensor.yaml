# Skjold Sensor – liten romsensor: temperatur, luftfuktighet, lys (lux, valgfritt) og bevegelse (valgfritt).
# ESP32-WROOM DevKit (30 eller 38 pinner) eller ESP32 D1 mini (MH-ET LIVE MiniKit o.l.) + SHT40 (eller SHT31 /
# AHT20+BMP280) + BH1750 (GY-302) + AM312 mini-PIR. Samme fil og samme GPIO-er for begge kortene (IO21, IO22, IO27 og
# IO2 finnes på pinneradene på ESP32 D1 mini). Sjekk silketrykket på ditt kort.
# Kabinett, deler og kobling: kabinett/sensor/LES_MEG.md. Wemos D1 mini-utgaven: skjold-sensor-d1mini.yaml.
# Flash første gang med https://web.esphome.io (USB, Wi-Fi settes med Improv), deretter OTA.
#
# Kobling (ESP32 DevKit og ESP32 D1 mini):
#   SHT40   VIN → 3V3   GND → GND   SDA → GPIO21   SCL → GPIO22
#   BH1750  VCC → 3V3   GND → GND   SDA → GPIO21   SCL → GPIO22   ADDR → GND (0x23)
#   AM312   VCC → 3V3   GND → GND   OUT → GPIO27
#   LED 3 mm (statuslys): GPIO2 → 330 Ω → LED → GND   (GPIO2 er også den blå LED-en på kortet)
#   HC-SR501 i stedet for AM312: VCC → VIN (5 V), OUT → GPIO27. LD2410 (mmWave): VCC → VIN (5 V), OUT → GPIO27.
#
# Uten lyssensor eller PIR: kommenter ut blokken for bh1750 eller bevegelse under. En sensor som ikke svarer, får
# statuslyset til å blinke.
substitutions:
  name: skjold-sensor
  friendly_name: Skjold Sensor
  # sensoren sitter i eget kammer bak en dobbel skillevegg, men ESP32 varmer litt likevel:
  # juster mot et kjent termometer etter en time i drift
  temp_offset: "-0.3"
  # hvor lenge «Bevegelse» står på etter siste utløsning (AM312 holder selv i ca. 2 s)
  bevegelse_av: 30s
  oppdatering: 30s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:                           # Homey-appen finner sensoren på dette (mDNS: project_name)
    name: skjold.sensor
    version: "1.0.0"

esp32:
  board: esp32dev
  framework: { type: esp-idf }

logger:
  level: INFO
api:
  encryption:
    key: !secret skjold_sensor_api_key
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: { ssid: "Skjold Sensor" }
captive_portal:
improv_serial:
# REST og hendelser på port 80: Homey-appen (driveren «Skjold Sensor») leser verdiene herfra
web_server:
  port: 80
  version: 3

# blinker ved feil (ingen Wi-Fi, sensor som ikke svarer), ellers av – så det ikke lyser inn i lyssensoren
status_led:
  pin:
    number: GPIO2
    ignore_strapping_warning: true   # GPIO2 er en oppstartspinne, men en LED til GND er trygt (som på kortet)

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100kHz

sensor:
  # --- temperatur og luftfuktighet: SHT40 (anbefalt: ±0,2 °C, ±1,8 %RH, tåler kondens) ---
  - platform: sht4x
    address: 0x44
    temperature:
      name: Temperatur
      id: temp
      filters:
        - offset: ${temp_offset}
    humidity:
      name: Luftfuktighet
      id: fukt
    update_interval: ${oppdatering}
  # --- SHT31 i stedet for SHT40 ---
  # - platform: sht3xd
  #   address: 0x44
  #   temperature: { name: Temperatur, id: temp, filters: [ offset: "${temp_offset}" ] }
  #   humidity: { name: Luftfuktighet, id: fukt }
  #   update_interval: ${oppdatering}
  # --- AHT20 + BMP280 (kombikort) i stedet for SHT40: fukt fra AHT20, temperatur og lufttrykk fra BMP280 ---
  # - platform: aht10
  #   variant: AHT20
  #   temperature: { name: Temperatur (AHT20), id: temp, filters: [ offset: "${temp_offset}" ] }
  #   humidity: { name: Luftfuktighet, id: fukt }
  #   update_interval: ${oppdatering}
  # - platform: bmp280_i2c
  #   address: 0x77
  #   temperature: { name: Temperatur (BMP280), internal: true }
  #   pressure: { name: Lufttrykk }
  #   update_interval: 60s

  # --- lys: BH1750 (GY-302) bak lysvinduet ---
  - platform: bh1750
    name: Lys
    address: 0x23
    update_interval: ${oppdatering}

  - platform: template
    name: Duggpunkt
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      const float t = id(temp).state, rh = id(fukt).state;
      if (isnan(t) || isnan(rh) || rh <= 0) return {};
      const float a = 17.62f, b = 243.12f, g = logf(rh / 100.0f) + a * t / (b + t);
      return b * g / (a - g);

  - platform: wifi_signal
    name: Wi-Fi-signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Oppetid
    entity_category: diagnostic

binary_sensor:
  # --- bevegelse: AM312 (eller HC-SR501 / LD2410 OUT) ---
  - platform: gpio
    pin:
      number: GPIO27
      mode: { input: true, pulldown: true }
    name: Bevegelse
    id: bevegelse
    device_class: motion
    filters:
      - delayed_off: ${bevegelse_av}
  - platform: status
    name: Status

button:
  - platform: restart
    name: Start på nytt
    entity_category: config
