# Skjold Fjernkontroll – universell fjernkontroll med 2,8″ berøringsskjerm (240 × 320), 14 taster, IR og Wi-Fi.
# Dette er standardvarianten (uten talltastene og smarthus-raden). Full variant med talltaster og smarthus-rad:
# skjold-fjernkontroll-full.yaml, laget av kabinett/fjernkontroll/taster.py fra denne fila.
# Maskinvare (se kabinett/fjernkontroll/LES_MEG.md): ESP32-S3 SuperMini, 2,8″ IPS ST7789 + FT6336U berøring (naken FPC-modul),
# 3 × TCA9555 på tastekortet (8 faste taster + vibrator, skjermstrøm og ladestatus, og 35 brytere i rutenettet under frontplaten), 3 × IR-diode 940 nm, VS1838B,
# vibrasjonsbryter (vekker når du løfter den), LiPo 603450 og TP4056 med USB-C.
#
#   · Skjermen: Aktiviteter · Spiller (nå spilles, cover, volum) · Kilder og radiofavoritter · Hjem (lys og scener) ·
#     Rom (velg hvilken Skjold du styrer) · Lær IR
#   · Skjold styres over det vanlige API-et på port 8765 (/api/status, /api/volume, /api/mute, /api/transport,
#     /api/preset, /api/presets, /api/input, /api/power, /api/rom, /api/cover) – samme som Skjold-appen bruker.
#   · IR: sender og lærer NEC, Samsung, Sony, RC5 og LG. Lærte koder lagres i flash (48 plasser: én per tast + 4 makroer).
#   · Hver tast sendes til Home Assistant som en hendelse (event-entiteten «Tast» og esphome.skjold_fjernkontroll),
#     så du kan bruke hvilken som helst tast i en automasjon.
#   · Frontplaten (tasteblokken under D-paden) kan byttes: tastekortet har et rutenett med 7 × 5 brytere, og
#     select-entiteten «Frontplate» velger hvilken bryter som er hvilken tast (oppsettene lages av taster.py).
#   · Meny-tasten: kort trykk = meny (Kilder, eller lært IR-kode i TV/film), langt trykk = guide (Spiller-siden).
#   · Dyp søvn etter ${sovn_etter} uten bruk. Vekkes av en tast (TCA9555 INT → GPIO2) eller av at du løfter den
#     (vibrasjonsbryter → GPIO4).
#
# Pinnene er Skjolds eget oppsett for SuperMini (se koblingstabellen i LES_MEG.md). IKKE TESTET PÅ MASKINVARE.
# Blokkene mellom «# >>> …» og «# <<< …» lages av kabinett/fjernkontroll/taster.py.
substitutions:
  name: skjold-fjernkontroll
  friendly_name: Skjold Fjernkontroll
  skjold_host: skjold.local          # Skjold-enheten fjernkontrollen styrer først (velg andre rom på skjermen)
  skjold_port: "8765"
  ekstra_hub: tca_c                  # brikken med vibrator, skjermstrøm og ladestatus (full variant: tca_d)
  oppsett: rutenett                  # frontplaten som sitter på: rutenett (A), vannrett (B) eller stor (C); kan byttes i HA
  sovn_etter: 40s                    # dyp søvn etter så lang tid uten tast eller berøring
  tv_kilde: aux                      # Skjold-inngangen TV-en er koblet til (aux, aux2, usb, bt …)
  # Home Assistant (krever «Tillat enheten å utføre handlinger i Home Assistant» i ESPHome-integrasjonen)
  ha_lys: light.stue                 # Lys-tasten og ± (dimming)
  ha_stikk: switch.stikkontakt       # Stikk-tasten
  ha_rom_1: light.stue
  ha_rom_2: light.kjokken
  ha_rom_3: light.gang
  ha_rom_4: light.soverom
  scene_tv: scene.tv
  scene_film: scene.kino
  scene_morgen: scene.god_morgen
  scene_natt: scene.god_natt
  scene_middag: scene.middag
  scene_lesing: scene.lesing
  scene_alt_av: scene.alt_av

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - output.turn_on: strom_skjerm         # 3V3 til skjerm og IR-mottaker (AO3401 via TCA9555)
        - light.turn_on: { id: baklys, brightness: 80% }
        - script.execute: sovn_teller
    - priority: -100
      then:
        - wait_until: { condition: wifi.connected, timeout: 8s }
        - script.execute: hent_rom
        - script.execute: hent_favoritter
        - script.execute: hent_status

esp32:
  board: esp32-s3-devkitc-1          # ESP32-S3 SuperMini (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM)
  variant: esp32s3
  flash_size: 4MB
  framework: { type: esp-idf }

psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret skjold_fjernkontroll_api_key
  actions:
    - action: send_ir
      variables: { plass: int }
      then: [ { script.execute: { id: ir_send, plass: !lambda "return plass;" } } ]
    - action: send_nec
      variables: { adresse: int, kommando: int }
      then:
        - remote_transmitter.transmit_nec:
            address: !lambda "return adresse;"
            command: !lambda "return kommando;"
    - action: slett_ir
      variables: { plass: int }
      then:
        - lambda: |-
            if (plass < 0 || plass >= 48) return;
            id(ir_prot)[plass] = 0; id(ir_data)[plass] = 0; id(ir_bits)[plass] = 0;

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true                 # raskere tilkobling etter dyp søvn (sett gjerne fast IP under)
  power_save_mode: light
  # manual_ip: { static_ip: 192.168.1.60, gateway: 192.168.1.1, subnet: 255.255.255.0, dns1: 192.168.1.1 }
  ap: { ssid: "Skjold Fjernkontroll" }

captive_portal:

http_request:
  verify_ssl: false
  timeout: 3s

# ---------- busser og I/O ----------
i2c:
  - id: bus_a                        # tastekortet (2 × TCA9555, full variant 3)
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz
    scan: false
  - id: bus_b                        # berøring (FT6336U, 0x38) – egen buss, så skjermen kan slås helt av i søvn
    sda: GPIO8
    scl: GPIO3                       # strappe-pinne, men bare for JTAG-valg (eFuse) – trygg med pull-up
    frequency: 400kHz
    scan: false

tca9555:
  - { id: tca_a, i2c_id: bus_a, address: 0x20 }
  - { id: tca_b, i2c_id: bus_a, address: 0x21 }
  - { id: tca_c, i2c_id: bus_a, address: 0x22 }

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10

output:
  - platform: ledc
    id: baklys_pwm
    pin: GPIO13
  - platform: gpio
    id: strom_skjerm
    pin: { tca9555: $ekstra_hub, number: 13, mode: { output: true }, inverted: true }   # lav = på
  - platform: gpio
    id: vibrator
    pin: { tca9555: $ekstra_hub, number: 12, mode: { output: true } }

light:
  - platform: monochromatic
    id: baklys
    name: Skjermlys
    output: baklys_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

display:
  - platform: ili9xxx
    id: skjerm
    model: ST7789V
    dc_pin: GPIO11
    reset_pin: GPIO12                # deles med berøringens RST
    invert_colors: true              # IPS-paneler; sett false hvis fargene er negative
    color_order: rgb                 # bytt til bgr hvis rødt og blått er byttet om
    dimensions: { width: 240, height: 320 }
    data_rate: 40MHz
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6                # FT6336U på 2,8″-modulen (en CST816-modul: platform cst816)
    address: 0x38
    id: beroring
    i2c_id: bus_b
    interrupt_pin: GPIO7
    display: skjerm
    on_touch:
      - script.execute: sovn_teller

# ---------- IR ----------
remote_transmitter:
  id: ir_tx
  pin: GPIO43                        # → 1 kΩ → AO3400 → 3 × IR-diode 940 nm (hver med 10 Ω fra batteriet)
  carrier_duty_percent: 33%
  non_blocking: true

remote_receiver:
  id: ir_rx
  pin: { number: GPIO44, inverted: true }   # VS1838B (aktiv lav)
  dump: []
  tolerance: 25%
  on_nec:
    - lambda: "id(ir_mottatt)->execute(1, ((uint32_t) x.address << 16) | x.command, 0);"
  on_samsung:
    - lambda: "id(ir_mottatt)->execute(2, (uint32_t) x.data, x.nbits);"
  on_sony:
    - lambda: "id(ir_mottatt)->execute(3, x.data, x.nbits);"
  on_rc5:
    - lambda: "id(ir_mottatt)->execute(4, ((uint32_t) x.address << 8) | x.command, 0);"
  on_lg:
    - lambda: "id(ir_mottatt)->execute(5, x.data, x.nbits);"

# ---------- søvn ----------
deep_sleep:
  id: dyp_sovn
  wakeup_pin: { number: GPIO2, inverted: true, mode: { input: true } }   # TCA9555 INT (felles, 10 kΩ til 3V3)
  wakeup_pin_mode: KEEP_AWAKE
  esp32_ext1_wakeup:
    pins: [ { number: GPIO4, allow_other_uses: true } ]   # vibrasjonsbryter SW-18010P mellom 3V3 og GPIO4 (1 MΩ ned)
    mode: ANY_HIGH

switch:
  - platform: template
    id: hold_vaaken
    name: Hold våken (for oppdatering)
    icon: mdi:sleep-off
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config

# ---------- tilstand ----------
globals:
  - { id: skjold_base, type: std::string, initial_value: '"http://${skjold_host}:${skjold_port}"' }
  - { id: rom_valgt, type: int, restore_value: true, initial_value: "-1" }   # -1 = ${skjold_host}
  - { id: rom_navn, type: std::vector<std::string>, initial_value: "{}" }
  - { id: rom_base, type: std::vector<std::string>, initial_value: "{}" }
  - { id: modus, type: int, restore_value: true, initial_value: "0" }        # 0 = Skjold/musikk, 1 = TV, 2 = film
  - { id: aktivitet, type: std::string, initial_value: '""' }
  - { id: volum, type: int, initial_value: "0" }
  - { id: spiller, type: bool, initial_value: "false" }
  - { id: demp, type: bool, initial_value: "false" }
  - { id: tittel, type: std::string, initial_value: '"Skjold"' }
  - { id: cover_nokkel, type: std::string, initial_value: '""' }
  # lærte IR-koder: plass 0–43 = tastene (rekkefølgen i taster_navn), 44–47 = makro 1–4 (TV på, TV av, HDMI, ekstra)
  # protokoll: 0 = tom, 1 = NEC (adresse << 16 | kommando), 2 = Samsung, 3 = Sony, 4 = RC5 (adresse << 8 | kommando), 5 = LG
  - { id: ir_prot, type: "std::array<uint8_t, 48>", restore_value: true, initial_value: "{}" }
  - { id: ir_data, type: "std::array<uint32_t, 48>", restore_value: true, initial_value: "{}" }
  - { id: ir_bits, type: "std::array<uint8_t, 48>", restore_value: true, initial_value: "{}" }
  - { id: laer_steg, type: int, initial_value: "0" }      # 0 = av, 1 = venter på tast, 2 = venter på IR, 3 = mottatt
  - { id: laer_plass, type: int, initial_value: "-1" }
  - { id: laer_prot, type: int, initial_value: "0" }
  - { id: laer_data, type: uint32_t, initial_value: "0" }
  - { id: laer_bits, type: int, initial_value: "0" }
# >>> navneliste (laget av kabinett/fjernkontroll/taster.py – ikke rediger mellom merkene)
  - id: taster_navn
    type: std::vector<std::string>
    initial_value: '{"av", "hjem", "meny", "opp", "ned", "venstre", "hoyre", "ok", "tilbake", "avslutt", "spill_pause", "demp", "vol_opp", "vol_ned"}'
  # rutenettbryter → funksjon for hver frontplate (rutenett, vannrett, stor)
  - id: oppsett_kart
    type: std::vector<std::vector<std::string>>
    initial_value: '{{"", "tilbake", "", "", "", "vol_opp", "", "", "", "", "", "", "", "", "", "avslutt", "", "", "", "vol_ned", "", "", "", "", "", "", "", "", "", "spill_pause", "", "", "", "demp", ""}, {"", "", "", "", "", "", "", "vol_ned", "", "", "", "", "", "vol_opp", "", "", "", "", "", "", "", "tilbake", "", "spill_pause", "", "demp", "", "avslutt", "", "", "", "", "", "", ""}, {"tilbake", "", "", "", "", "", "avslutt", "", "", "", "", "", "", "", "", "", "", "spill_pause", "", "", "", "", "", "", "", "", "", "", "vol_ned", "", "", "demp", "", "", "vol_opp"}}'
  - id: oppsett_nr
    type: int
    restore_value: true
    initial_value: '0'
# <<< navneliste

# ---------- sensorer ----------
sensor:
  - platform: adc
    id: batteri_v
    name: Batterispenning
    pin: GPIO1                       # VBAT via 2 × 220 kΩ
    attenuation: 12db
    update_interval: 30s
    filters: [ { multiply: 2.0 }, { sliding_window_moving_average: { window_size: 4, send_every: 1 } } ]
    entity_category: diagnostic
  - platform: template
    id: batteri
    name: Batteri
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float v = id(batteri_v).state;
      if (isnan(v)) return {};
      return clamp((v - 3.30f) / (4.15f - 3.30f) * 100.0f, 0.0f, 100.0f);
    on_value:
      - lambda: |-
          lv_label_set_text_fmt(id(lbl_bat), "%s %d %%", id(lader).state ? LV_SYMBOL_CHARGE : LV_SYMBOL_BATTERY_FULL, (int) x);
  - platform: wifi_signal
    name: Wi-Fi-signal
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    id: lader
    name: Lader
    pin: { tca9555: $ekstra_hub, number: 14, mode: { input: true }, inverted: true }   # TP4056 CHRG (lav = lader)
    device_class: battery_charging
  - platform: gpio
    id: loftet
    internal: true
    pin: { number: GPIO4, mode: { input: true }, allow_other_uses: true }
    on_press:
      - script.execute: sovn_teller
# >>> taster (laget av kabinett/fjernkontroll/taster.py – ikke rediger mellom merkene)
  - platform: gpio
    id: t_av
    name: "Tast Av-på"
    internal: true
    pin: { tca9555: tca_a, number: 0, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_multi_click:
      - timing: [ "ON for at least 0.6s" ]
        then: [ { script.execute: { id: tast, navn: "av", lang: true } } ]
      - timing: [ "ON for at most 0.59s", "OFF for at least 0.01s" ]
        then: [ { script.execute: { id: tast, navn: "av", lang: false } } ]
  - platform: gpio
    id: t_hjem
    name: "Tast Skjold (aktiviteter)"
    internal: true
    pin: { tca9555: tca_a, number: 1, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_multi_click:
      - timing: [ "ON for at least 0.6s" ]
        then: [ { script.execute: { id: tast, navn: "hjem", lang: true } } ]
      - timing: [ "ON for at most 0.59s", "OFF for at least 0.01s" ]
        then: [ { script.execute: { id: tast, navn: "hjem", lang: false } } ]
  - platform: gpio
    id: t_meny
    name: "Tast Meny (hold: guide)"
    internal: true
    pin: { tca9555: tca_a, number: 2, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_multi_click:
      - timing: [ "ON for at least 0.6s" ]
        then: [ { script.execute: { id: tast, navn: "meny", lang: true } } ]
      - timing: [ "ON for at most 0.59s", "OFF for at least 0.01s" ]
        then: [ { script.execute: { id: tast, navn: "meny", lang: false } } ]
  - platform: gpio
    id: t_opp
    name: "Tast Opp"
    internal: true
    pin: { tca9555: tca_a, number: 3, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_press:
      - script.execute: { id: tast, navn: "opp", lang: false }
      - delay: 450ms
      - while:
          condition: { binary_sensor.is_on: t_opp }
          then:
            - script.execute: { id: tast, navn: "opp", lang: false }
            - delay: 160ms
  - platform: gpio
    id: t_ned
    name: "Tast Ned"
    internal: true
    pin: { tca9555: tca_a, number: 4, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_press:
      - script.execute: { id: tast, navn: "ned", lang: false }
      - delay: 450ms
      - while:
          condition: { binary_sensor.is_on: t_ned }
          then:
            - script.execute: { id: tast, navn: "ned", lang: false }
            - delay: 160ms
  - platform: gpio
    id: t_venstre
    name: "Tast Venstre"
    internal: true
    pin: { tca9555: tca_a, number: 5, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_press:
      - script.execute: { id: tast, navn: "venstre", lang: false }
      - delay: 450ms
      - while:
          condition: { binary_sensor.is_on: t_venstre }
          then:
            - script.execute: { id: tast, navn: "venstre", lang: false }
            - delay: 160ms
  - platform: gpio
    id: t_hoyre
    name: "Tast Høyre"
    internal: true
    pin: { tca9555: tca_a, number: 6, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_press:
      - script.execute: { id: tast, navn: "hoyre", lang: false }
      - delay: 450ms
      - while:
          condition: { binary_sensor.is_on: t_hoyre }
          then:
            - script.execute: { id: tast, navn: "hoyre", lang: false }
            - delay: 160ms
  - platform: gpio
    id: t_ok
    name: "Tast OK"
    internal: true
    pin: { tca9555: tca_a, number: 7, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_multi_click:
      - timing: [ "ON for at least 0.6s" ]
        then: [ { script.execute: { id: tast, navn: "ok", lang: true } } ]
      - timing: [ "ON for at most 0.59s", "OFF for at least 0.01s" ]
        then: [ { script.execute: { id: tast, navn: "ok", lang: false } } ]
  - platform: gpio
    id: t_g00
    name: "Tast Rutenett r0 k0"
    internal: true
    pin: { tca9555: tca_a, number: 8, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_press:
      - if:
          condition: { lambda: 'const std::string &f = id(oppsett_kart)[id(oppsett_nr)][0]; return f == "vol_opp" || f == "vol_ned";' }
          then:
            - script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][0];', lang: false }
            - delay: 450ms
            - while:
                condition: { binary_sensor.is_on: t_g00 }
                then:
                  - script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][0];', lang: false }
                  - delay: 160ms
    on_multi_click:
      - timing: [ "ON for at least 0.6s" ]
        then:
          - if:
              condition: { lambda: 'const std::string &f = id(oppsett_kart)[id(oppsett_nr)][0]; return !f.empty() && f != "vol_opp" && f != "vol_ned";' }
              then: [ { script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][0];', lang: true } } ]
      - timing: [ "ON for at most 0.59s", "OFF for at least 0.01s" ]
        then:
          - if:
              condition: { lambda: 'const std::string &f = id(oppsett_kart)[id(oppsett_nr)][0]; return !f.empty() && f != "vol_opp" && f != "vol_ned";' }
              then: [ { script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][0];', lang: false } } ]
  - platform: gpio
    id: t_g01
    name: "Tast Rutenett r0 k1"
    internal: true
    pin: { tca9555: tca_a, number: 9, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_press:
      - if:
          condition: { lambda: 'const std::string &f = id(oppsett_kart)[id(oppsett_nr)][1]; return f == "vol_opp" || f == "vol_ned";' }
          then:
            - script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][1];', lang: false }
            - delay: 450ms
            - while:
                condition: { binary_sensor.is_on: t_g01 }
                then:
                  - script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][1];', lang: false }
                  - delay: 160ms
    on_multi_click:
      - timing: [ "ON for at least 0.6s" ]
        then:
          - if:
              condition: { lambda: 'const std::string &f = id(oppsett_kart)[id(oppsett_nr)][1]; return !f.empty() && f != "vol_opp" && f != "vol_ned";' }
              then: [ { script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][1];', lang: true } } ]
      - timing: [ "ON for at most 0.59s", "OFF for at least 0.01s" ]
        then:
          - if:
              condition: { lambda: 'const std::string &f = id(oppsett_kart)[id(oppsett_nr)][1]; return !f.empty() && f != "vol_opp" && f != "vol_ned";' }
              then: [ { script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][1];', lang: false } } ]
  - platform: gpio
    id: t_g02
    name: "Tast Rutenett r0 k2"
    internal: true
    pin: { tca9555: tca_a, number: 10, mode: { input: true }, inverted: true }
    filters: [ { delayed_on: 15ms }, { delayed_off: 15ms } ]
    on_press:
      - if:
          condition: { lambda: 'const std::string &f = id(oppsett_kart)[id(oppsett_nr)][2]; return f == "vol_opp" || f == "vol_ned";' }
          then:
            - script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][2];', lang: false }
            - delay: 450ms
            - while:
                condition: { binary_sensor.is_on: t_g02 }
                then:
                  - script.execute: { id: tast, navn: !lambda 'return id(oppsett_kart)[id(oppsett_nr)][2];', lang: false }
                  - delay: 160ms
    on_multi_click:
      - timing: [ "ON for at least 0.6s" ]
        then:
