# ---------- tasteoppsett ----------
select:
# >>> oppsettvalg (laget av kabinett/fjernkontroll/taster.py – ikke rediger mellom merkene)
  - platform: template
    id: oppsett_valg
    name: Tasteoppsett
    icon: mdi:view-grid-outline
    optimistic: true
    restore_value: true
    initial_option: ${oppsett}
    options: [ rutenett, vannrett, stor ]
    on_value:
      - lambda: 'id(oppsett_nr) = i;'
# <<< oppsettvalg
