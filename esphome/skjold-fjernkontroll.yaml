# Skjold Fjernkontroll – universell fjernkontroll med 2,8″ berøringsskjerm (240 × 320), 14 taster, IR og Wi-Fi.
# Dette er standardvarianten (uten talltastene og smarthus-raden). Full variant med talltaster og smarthus-rad:
# skjold-fjernkontroll-full.yaml, laget av kabinett/fjernkontroll/taster.py fra denne fila.
# Maskinvare (se kabinett/fjernkontroll/LES_MEG.md): ESP32-S3 SuperMini, 2,8″ IPS ST7789 + FT6336U berøring (naken FPC-modul),
# 3 × TCA9555 på tastekortet (8 faste taster + vibrator, skjermstrøm og ladestatus, og 35 brytere i rutenettet under frontplaten), 3 × IR-diode 940 nm, VS1838B,
# vibrasjonsbryter (vekker når du løfter den), LiPo 603450 og TP4056 med USB-C.
#
#   · Skjermen: «Styrer»-brikken øverst velger enheten (Stue-TV, Apple TV, Skjold, Projektor); tastene virker alltid på
#     den valgte. Start (nå spilles + aktiviteter) · Enhet (Apple TV-apper, TV-innganger eller Skjold-spilleren) ·
#     Hjem (lys og scener) · Mer (lysstyrke, søvn, tasteoppsett, Lær IR, Wi-Fi og batteri). Volumvindu, ladeikon og
#     korte meldinger nederst. Se «Skjermen og appene» i LES_MEG.md.
#   · Skjold styres over det vanlige API-et på port 8765 (/api/status, /api/volume, /api/mute, /api/transport,
#     /api/preset, /api/presets, /api/input, /api/power, /api/rom, /api/cover) – samme som Skjold-appen bruker.
#   · Apple TV og TV styres gjennom Home Assistant (media_player/remote, lest med homeassistant-sensorer); TV og
#     projektor kan også styres med lærte IR-koder (NEC, Samsung, Sony, RC5 og LG, 2 × 56 plasser i flash).
#   · Aktivitetene (Se TV, Apple TV, Film, Musikk, God natt) er lister med steg i substitutions under, og viser
#     fremdriften på skjermen. Langt trykk på av/på = alt av.
#   · Hver tast sendes til Home Assistant som en hendelse (event-entiteten «Tast» og esphome.skjold_fjernkontroll),
#     så du kan bruke hvilken som helst tast i en automasjon.
#   · Tasteblokken under D-paden har flere oppsett (ny topp og nye hetter printes): tastekortet har et rutenett med
#     7 × 5 brytere, og select-entiteten «Tasteoppsett» velger hvilken bryter som er hvilken tast (fra taster.py).
#   · Meny-tasten: kort trykk = enhetssiden (apper/innganger/spiller), langt trykk = Skjold-spilleren.
#     Skjold-tasten: kort = Start, langt = velg enhet.
#   · Dyp søvn etter ${sovn_etter} uten bruk. Vekkes av en tast (TCA9555 INT → GPIO2) eller av at du løfter den
#     (vibrasjonsbryter → GPIO4).
#
# Pinnene er Skjolds eget oppsett for SuperMini (se koblingstabellen i LES_MEG.md). IKKE TESTET PÅ MASKINVARE.
# Blokkene mellom «# >>> …» og «# <<< …» lages av kabinett/fjernkontroll/taster.py.
substitutions:
  name: skjold-fjernkontroll
  friendly_name: Skjold Fjernkontroll
  skjold_host: skjold.local          # Skjold-enheten fjernkontrollen styrer først (velg andre rom på skjermen)
  skjold_port: "8765"
  ekstra_hub: tca_c                  # brikken med vibrator, skjermstrøm og ladestatus (full variant: tca_d)
  oppsett: rutenett                  # tasteoppsettet toppen er printet med: rutenett (A), vannrett (B) eller stor (C); kan byttes i HA
  sovn_etter: 40s                    # (vises i dokumentasjonen)
  sovn_etter_s: "40"                 # standard søvntid i sekunder (kan endres på skjermen: Mer → Søvn etter)
  tv_kilde: aux                      # Skjold-inngangen TV-en er koblet til (aux, aux2, usb, bt …)
  # ---- Home Assistant (krever «Tillat enheten å utføre handlinger i Home Assistant» i ESPHome-integrasjonen) ----
  ha_url: http://homeassistant.local:8123     # for cover-bilde fra Apple TV (entity_picture)
  tv_entitet: media_player.tv        # TV-en i HA (LG webOS, Samsung, Sony Bravia …); finnes den ikke, brukes lærte IR-koder
  atv_entitet: media_player.apple_tv # Apple TV (media_player: apper i source_list, nå spilles)
  atv_remote: remote.apple_tv        # Apple TV (remote: piltaster, select, menu, home)
  lyd: skjold                        # hvor volumtastene går for TV/Apple TV/projektor: skjold | tv
  # TV-ens kildenavn i HA (se attributtet source_list på TV-en) for HDMI 1–4 og TV-tuneren
  tv_inngang_1: "HDMI 1"
  tv_inngang_2: "HDMI 2"
  tv_inngang_3: "HDMI 3"
  tv_inngang_4: "HDMI 4"
  tv_inngang_5: "TV"
  atv_hdmi: "2"                      # HDMI-inngangen Apple TV står i (1–4)
  tv_oppstart_ms: "2500"             # ventetid (ms) etter «TV på» før inngangen byttes
  atv_favoritter: "Netflix|YouTube|NRK TV|Disney+"   # start-favoritter (endres på skjermen eller i HA: «Apple TV-favoritter»)
  # enhetene i «Styrer»-brikken
  enhet_0: Stue-TV
  enhet_1: Apple TV
  enhet_2: Skjold
  enhet_3: Projektor
  ha_lys: light.stue                 # Lys-tasten og ± (dimming)
  ha_stikk: switch.stikkontakt       # Stikk-tasten
  ha_rom_1: light.stue
  ha_rom_2: light.kjokken
  ha_rom_3: light.gang
  ha_rom_4: light.soverom
  ha_rom_1_navn: Stue
  ha_rom_2_navn: Kjøkken
  ha_rom_3_navn: Gang
  ha_rom_4_navn: Soverom
  scene_tv: scene.tv
  scene_film: scene.kino
  scene_morgen: scene.god_morgen
  scene_natt: scene.god_natt
  scene_middag: scene.middag
  scene_lesing: scene.lesing
  scene_alt_av: scene.alt_av
  # ---- aktivitetene: steg i rekkefølge (tom = hopp over) ----
  #   enhet: 0–3 (som over) etter start · tv/projektor/atv: på | av · inngang: 0 = ikke bytt, 1–4 = HDMI, 5 = TV
  #   app: Apple TV-app som åpnes · skjold: Skjold-inngang eller av · scene: HA-scene
  akt1_navn: Se TV
  akt1_enhet: "0"
  akt1_tv: på
  akt1_inngang: "5"
  akt1_projektor: ""
  akt1_atv: ""
  akt1_app: ""
  akt1_skjold: aux
  akt1_scene: scene.tv
  akt2_navn: Apple TV
  akt2_enhet: "1"
  akt2_tv: på
  akt2_inngang: "2"
  akt2_projektor: ""
  akt2_atv: på
  akt2_app: ""
  akt2_skjold: aux
  akt2_scene: scene.tv
  akt3_navn: Film
  akt3_enhet: "1"
  akt3_tv: av
  akt3_inngang: "0"
  akt3_projektor: på
  akt3_atv: på
  akt3_app: Plex
  akt3_skjold: aux
  akt3_scene: scene.kino
  akt4_navn: Musikk
  akt4_enhet: "2"
  akt4_tv: ""
  akt4_inngang: "0"
  akt4_projektor: ""
  akt4_atv: ""
  akt4_app: ""
  akt4_skjold: radio
  akt4_scene: ""
  akt5_navn: God natt
  akt5_enhet: "2"
  akt5_tv: av
  akt5_inngang: "0"
  akt5_projektor: av
  akt5_atv: av
  akt5_app: ""
  akt5_skjold: av
  akt5_scene: scene.god_natt

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes: [ skjold_ui.h ]            # hjelpefunksjoner og hurtigbuffer i RTC-minnet
  on_boot:
    - priority: 600
      then:
        - output.turn_on: strom_skjerm         # 3V3 til skjerm og IR-mottaker (AO3401 via TCA9555)
        - light.turn_on: { id: baklys, brightness: !lambda "return id(lysstyrke) / 100.0f;" }
        - script.execute: sovn_teller
        - lambda: |-
            skjold::tastatur.send = [](const std::string &n, const char *t) { id(tast)->execute(n, std::string(t)); };
        - script.execute: les_vekketast        # hvorfor den våknet, og tasten som fortsatt holdes
    - priority: -50                            # siste kjente tilstand med en gang, så svar fra HA og Skjold
      then:
        - script.execute: vis_hurtigbuffer
        - if:
            condition: { binary_sensor.is_on: dokket }
            then: [ script.execute: dokk_inn ]
        - lambda: |-
            // tasten som vekket den, som første trykk (nå som skjermen er klar)
            if (!skjold::tastatur.ignorer.empty() && millis() < skjold::tastatur.ignorer_til)
              id(tast)->execute(skjold::tastatur.ignorer, std::string("kort"));
    - priority: -100
      then:
        - wait_until: { condition: wifi.connected, timeout: 8s }
        - script.execute: hent_rom
        - script.execute: hent_favoritter
        - script.execute: hent_status

esp32:
  board: esp32-s3-devkitc-1          # ESP32-S3 SuperMini (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM)
  variant: esp32s3
  flash_size: 4MB
  framework: { type: esp-idf }

psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret skjold_fjernkontroll_api_key
  actions:
    - action: send_ir
      variables: { plass: int }
      then: [ script.execute: sovn_teller, { script.execute: { id: ir_send, plass: !lambda "return plass;" } } ]
    - action: send_nec
      variables: { adresse: int, kommando: int }
      then:
        - remote_transmitter.transmit_nec:
            address: !lambda "return adresse;"
            command: !lambda "return kommando;"
    - action: slett_ir
      variables: { plass: int }
      then:
        - lambda: |-
            if (plass < 0 || plass >= 112) return;
            id(ir_prot)[plass] = 0; id(ir_data)[plass] = 0; id(ir_bits)[plass] = 0;

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true                 # raskere tilkobling etter dyp søvn (sett gjerne fast IP under)
  power_save_mode: light
  # manual_ip: { static_ip: 192.168.1.60, gateway: 192.168.1.1, subnet: 255.255.255.0, dns1: 192.168.1.1 }
  ap: { ssid: "Skjold Fjernkontroll" }

captive_portal:

time:
  - platform: homeassistant         # klokka i dokken
    id: klokka

http_request:
  verify_ssl: false
  timeout: 3s

# ---------- busser og I/O ----------
i2c:
  - id: bus_a                        # tastekortet (2 × TCA9555, full variant 3)
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz
    scan: false
  - id: bus_b                        # berøring (FT6336U, 0x38) – egen buss, så skjermen kan slås helt av i søvn
    sda: GPIO8
    scl: GPIO3                       # strappe-pinne, men bare for JTAG-valg (eFuse) – trygg med pull-up
    frequency: 400kHz
    scan: false

tca9555:
  - { id: tca_a, i2c_id: bus_a, address: 0x20 }
  - { id: tca_b, i2c_id: bus_a, address: 0x21 }
  - { id: tca_c, i2c_id: bus_a, address: 0x22 }

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10

output:
  - platform: ledc
    id: baklys_pwm
    pin: GPIO13
  - platform: gpio
    id: strom_skjerm
    pin: { tca9555: $ekstra_hub, number: 13, mode: { output: true }, inverted: true }   # lav = på
  - platform: gpio
    id: vibrator
    pin: { tca9555: $ekstra_hub, number: 12, mode: { output: true } }

light:
  - platform: monochromatic
    id: baklys
    name: Skjermlys
    output: baklys_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

display:
  - platform: ili9xxx
    id: skjerm
    model: ST7789V
    dc_pin: GPIO11
    reset_pin: GPIO12                # deles med berøringens RST
    invert_colors: true              # IPS-paneler; sett false hvis fargene er negative
    color_order: rgb                 # bytt til bgr hvis rødt og blått er byttet om
    dimensions: { width: 240, height: 320 }
    data_rate: 40MHz
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6                # FT6336U på 2,8″-modulen (en CST816-modul: platform cst816)
    address: 0x38
    id: beroring
    i2c_id: bus_b
    interrupt_pin: GPIO7
    display: skjerm
    on_touch:
      - script.execute: sovn_teller

# ---------- IR ----------
remote_transmitter:
  id: ir_tx
  pin: GPIO43                        # → 1 kΩ → AO3400 → 3 × IR-diode 940 nm (hver med 10 Ω fra batteriet)
  carrier_duty_percent: 33%
  non_blocking: true

remote_receiver:
  id: ir_rx
  pin: { number: GPIO44, inverted: true }   # VS1838B (aktiv lav)
  dump: []
  tolerance: 25%
  on_nec:
    - lambda: "id(ir_mottatt)->execute(1, ((uint32_t) x.address << 16) | x.command, 0);"
  on_samsung:
    - lambda: "id(ir_mottatt)->execute(2, (uint32_t) x.data, x.nbits);"
  on_sony:
    - lambda: "id(ir_mottatt)->execute(3, x.data, x.nbits);"
  on_rc5:
    - lambda: "id(ir_mottatt)->execute(4, ((uint32_t) x.address << 8) | x.command, 0);"
  on_lg:
    - lambda: "id(ir_mottatt)->execute(5, x.data, x.nbits);"

# ---------- søvn ----------
deep_sleep:
  id: dyp_sovn
  wakeup_pin: { number: GPIO2, inverted: true, mode: { input: true } }   # TCA9555 INT (felles, 10 kΩ til 3V3)
  wakeup_pin_mode: KEEP_AWAKE
  esp32_ext1_wakeup:
    pins: [ { number: GPIO4, allow_other_uses: true } ]   # vibrasjonsbryter SW-18010P mellom 3V3 og GPIO4 (1 MΩ ned)
    mode: ANY_HIGH

switch:
  - platform: template
    id: hold_vaaken
    name: Hold våken (for oppdatering)
    icon: mdi:sleep-off
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    on_turn_on: [ lambda: 'lv_obj_add_state(id(knapp_vaaken), LV_STATE_CHECKED);' ]
    on_turn_off: [ lambda: 'lv_obj_remove_state(id(knapp_vaaken), LV_STATE_CHECKED);' ]

# ---------- tilstand ----------
globals:
  - { id: skjold_base, type: std::string, initial_value: '"http://${skjold_host}:${skjold_port}"' }
  - { id: rom_valgt, type: int, restore_value: true, initial_value: "-1" }   # -1 = ${skjold_host}
  - { id: rom_navn, type: std::vector<std::string>, initial_value: "{}" }
  - { id: rom_base, type: std::vector<std::string>, initial_value: "{}" }
  - { id: enhet, type: int, restore_value: true, initial_value: "2" }        # 0 = TV, 1 = Apple TV, 2 = Skjold, 3 = projektor
  - { id: lysstyrke, type: int, restore_value: true, initial_value: "80" }   # baklys i %
  - { id: sovn_s, type: int, restore_value: true, initial_value: "${sovn_etter_s}" }   # søvn etter (s)
  - { id: sist_aktiv, type: uint32_t, initial_value: "0" }
  - { id: dimmet, type: bool, initial_value: "false" }
  - { id: volum, type: int, initial_value: "0" }
  - { id: spiller, type: bool, initial_value: "false" }
  - { id: demp, type: bool, initial_value: "false" }
  - { id: skjold_paa, type: bool, initial_value: "true" }
  - { id: tittel, type: std::string, initial_value: '"Skjold"' }
  - { id: artist, type: std::string, initial_value: '""' }
  - { id: cover_nokkel, type: std::string, initial_value: '""' }
  # Apple TV og TV fra Home Assistant (hurtigbufret i RTC-minnet, se skjold_ui.h)
  - { id: apper, type: std::vector<std::string>, initial_value: "{}" }       # rekkefølgen i rutenettet (favoritter først)
  - { id: app_fav_antall, type: int, initial_value: "0" }
  - { id: app_valgt, type: int, initial_value: "-1" }                        # flisa med åpent valgpanel
  - { id: atv_pos, type: float, initial_value: "0" }
  - { id: atv_dur, type: float, initial_value: "0" }
  - { id: atv_pos_ms, type: uint32_t, initial_value: "0" }
  - { id: tv_volum, type: int, initial_value: "-1" }
  - { id: tv_demp, type: bool, initial_value: "false" }
  - { id: tv_paa, type: bool, initial_value: "false" }
  - { id: tv_ha, type: bool, initial_value: "false" }                       # TV-en finnes i HA (ellers IR)
  - { id: proj_paa, type: bool, initial_value: "false" }
  # aktivitet som starter: stegkoder og tekst
  - { id: akt_koder, type: std::vector<std::string>, initial_value: "{}" }
  - { id: akt_i, type: int, initial_value: "0" }
  - { id: akt_vent, type: uint32_t, initial_value: "0" }
  - { id: akt_nr, type: int, restore_value: true, initial_value: "-1" }
  # lærte IR-koder: to blokker à 56 plasser (0 = TV, 1 = projektor). I hver blokk: 0–43 = tastene (rekkefølgen i
  # taster_navn), 44 = på, 45 = av, 46–49 = HDMI 1–4, 50 = TV-tuner, 51–55 = ledig.
  # protokoll: 0 = tom, 1 = NEC (adresse << 16 | kommando), 2 = Samsung, 3 = Sony, 4 = RC5 (adresse << 8 | kommando), 5 = LG
  - { id: ir_prot, type: "std::array<uint8_t, 112>", restore_value: true, initial_value: "{}" }
  - { id: ir_data, type: "std::array<uint32_t, 112>", restore_value: true, initial_value: "{}" }
  - { id: ir_bits, type: "std::array<uint8_t, 112>", restore_value: true, initial_value: "{}" }
  - { id: laer_blokk, type: int, initial_value: "0" }     # 0 = TV, 1 = projektor
  - { id: laer_steg, type: int, initial_value: "0" }      # 0 = av, 1 = venter på tast, 2 = venter på IR, 3 = mottatt
  - { id: laer_plass, type: int, initial_value: "-1" }
  - { id: laer_prot, type: int, initial_value: "0" }
  - { id: laer_data, type: uint32_t, initial_value: "0" }
  - { id: laer_bits, type: int, initial_value: "0" }
# >>> navneliste (laget av kabinett/fjernkontroll/taster.py – ikke rediger mellom merkene)
  - id: taster_navn
    type: std::vector<std::string>
    initial_value: '{"av", "hjem", "meny", "opp", "ned", "venstre", "hoyre", "ok", "tilbake", "avslutt", "spill_pause", "demp", "vol_opp", "vol_ned"}'
  # rutenettbryter → funksjon for hvert tasteoppsett (rutenett, vannrett, stor)
  - id: oppsett_kart
    type: std::vector<std::vector<std::string>>
    initial_value: '{{"", "tilbake", "", "", "", "vol_opp", "", "", "", "", "", "", "", "", "", "avslutt", "", "", "", "vol_ned", "", "", "", "", "", "", "", "", "", "spill_pause", "", "", "", "demp", ""}, {"", "", "", "", "", "", "", "vol_ned", "", "", "", "", "", "vol_opp", "", "", "", "", "", "", "", "tilbake", "", "spill_pause", "", "demp", "", "avslutt", "", "", "", "", "", "", ""}, {"tilbake", "", "", "", "", "", "avslutt", "", "", "", "", "", "", "", "", "", "", "spill_pause", "", "", "", "", "", "", "", "", "", "", "vol_ned", "", "", "demp", "", "", "vol_opp"}}'
  - id: oppsett_nr
    type: int
    restore_value: true
    initial_value: '0'
# <<< navneliste

# ---------- sensorer ----------
sensor:
  - platform: adc
    id: batteri_v
    name: Batterispenning
    pin: GPIO1                       # VBAT via 2 × 220 kΩ
    attenuation: 12db
    update_interval: 30s
    filters: [ { multiply: 2.0 }, { sliding_window_moving_average: { window_size: 4, send_every: 1 } } ]
    entity_category: diagnostic
  - platform: template
    id: batteri
    name: Batteri
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float v = id(batteri_v).state;
      if (isnan(v)) return {};
      return clamp((v - 3.30f) / (4.15f - 3.30f) * 100.0f, 0.0f, 100.0f);
    on_value:
      - lambda: |-
          lv_label_set_text_fmt(id(lbl_bat), "%s %d %%", id(lader).state ? LV_SYMBOL_CHARGE : LV_SYMBOL_BATTERY_FULL, (int) x);
          id(oppdater_dokk)->execute();
  - platform: wifi_signal
    id: wifi_db
    name: Wi-Fi-signal
    update_interval: 60s
    entity_category: diagnostic
  # ---- fra Home Assistant ----
  - { platform: homeassistant, id: ha_atv_pos, entity_id: "${atv_entitet}", attribute: media_position, internal: true,
      on_value: [ lambda: 'id(atv_pos) = x; id(atv_pos_ms) = millis(); id(oppdater_naa)->execute();' ] }
  - { platform: homeassistant, id: ha_atv_dur, entity_id: "${atv_entitet}", attribute: media_duration, internal: true,
      on_value: [ lambda: 'id(atv_dur) = x; id(oppdater_naa)->execute();' ] }
  - { platform: homeassistant, id: ha_tv_vol, entity_id: "${tv_entitet}", attribute: volume_level, internal: true,
      on_value: [ lambda: 'id(tv_volum) = (int) lroundf(x * 100.0f);' ] }
  - { platform: homeassistant, id: ha_lys_1, entity_id: "${ha_rom_1}", attribute: brightness, internal: true,
      on_value: [ lambda: 'lv_slider_set_value(id(lys_b1), (int) (x * 100 / 255), LV_ANIM_OFF);' ] }
  - { platform: homeassistant, id: ha_lys_2, entity_id: "${ha_rom_2}", attribute: brightness, internal: true,
      on_value: [ lambda: 'lv_slider_set_value(id(lys_b2), (int) (x * 100 / 255), LV_ANIM_OFF);' ] }
  - { platform: homeassistant, id: ha_lys_3, entity_id: "${ha_rom_3}", attribute: brightness, internal: true,
      on_value: [ lambda: 'lv_slider_set_value(id(lys_b3), (int) (x * 100 / 255), LV_ANIM_OFF);' ] }
  - { platform: homeassistant, id: ha_lys_4, entity_id: "${ha_rom_4}", attribute: brightness, internal: true,
      on_value: [ lambda: 'lv_slider_set_value(id(lys_b4), (int) (x * 100 / 255), LV_ANIM_OFF);' ] }

text_sensor:
  - platform: wifi_info
    ip_address: { id: ip_adr, internal: true }
  # ---- Apple TV og TV fra Home Assistant (sendes automatisk når API-et kobler til etter søvn) ----
  - platform: homeassistant
    id: ha_atv_apper
    entity_id: ${atv_entitet}
    attribute: source_list
    internal: true
    on_value:
      - lambda: |-
          auto v = skjold::les_liste(x);
          if (v.empty()) return;
          skjold::rtc_sett(skjold::rtc_apper, sizeof skjold::rtc_apper, skjold::slaa_sammen(v));
          id(bygg_apper)->execute();
  - platform: homeassistant
    id: ha_atv_tilstand
    entity_id: ${atv_entitet}
    internal: true
    on_value:
      - lambda: 'skjold::rtc_sett(skjold::rtc_atv_tilstand, sizeof skjold::rtc_atv_tilstand, x); id(oppdater_naa)->execute();'
  - platform: homeassistant
    id: ha_atv_app
    entity_id: ${atv_entitet}
    attribute: app_name
    internal: true
    on_value:
      - lambda: 'skjold::rtc_sett(skjold::rtc_atv_app, sizeof skjold::rtc_atv_app, x); id(oppdater_naa)->execute();'
  - platform: homeassistant
    id: ha_atv_tittel
    entity_id: ${atv_entitet}
    attribute: media_title
    internal: true
    on_value:
      - lambda: 'skjold::rtc_sett(skjold::rtc_atv_tittel, sizeof skjold::rtc_atv_tittel, x); id(oppdater_naa)->execute();'
  - platform: homeassistant
    id: ha_atv_bilde
    entity_id: ${atv_entitet}
    attribute: entity_picture
    internal: true
    on_value:
      - lambda: |-
          if (x.empty() || x == "None") { lv_obj_add_flag(id(img_atv), LV_OBJ_FLAG_HIDDEN); return; }
          std::string url = x.rfind("http", 0) == 0 ? x : std::string("${ha_url}") + x;
          id(atv_bilde).set_url(url);
          id(atv_bilde).update();
  - platform: homeassistant
    id: ha_tv_tilstand
    entity_id: ${tv_entitet}
    internal: true
    on_value:
      - lambda: 'id(tv_ha) = !x.empty() && x != "unavailable" && x != "unknown"; id(tv_paa) = (x == "on" || x == "playing" || x == "idle" || x == "paused"); id(oppdater_naa)->execute();'
  - platform: homeassistant
    id: ha_tv_kilde
    entity_id: ${tv_entitet}
    attribute: source
    internal: true
    on_value:
      - lambda: 'skjold::rtc_sett(skjold::rtc_tv_kilde, sizeof skjold::rtc_tv_kilde, x); id(merk_inngang)->execute(); id(oppdater_naa)->execute();'
  - { platform: homeassistant, id: ha_lys_s1, entity_id: "${ha_rom_1}", internal: true,
      on_value: [ lambda: 'if (x == "on") lv_obj_add_state(id(lys_s1), LV_STATE_CHECKED); else lv_obj_remove_state(id(lys_s1), LV_STATE_CHECKED);' ] }
  - { platform: homeassistant, id: ha_lys_s2, entity_id: "${ha_rom_2}", internal: true,
      on_value: [ lambda: 'if (x == "on") lv_obj_add_state(id(lys_s2), LV_STATE_CHECKED); else lv_obj_remove_state(id(lys_s2), LV_STATE_CHECKED);' ] }
  - { platform: homeassistant, id: ha_lys_s3, entity_id: "${ha_rom_3}", internal: true,
      on_value: [ lambda: 'if (x == "on") lv_obj_add_state(id(lys_s3), LV_STATE_CHECKED); else lv_obj_remove_state(id(lys_s3), LV_STATE_CHECKED);' ] }
  - { platform: homeassistant, id: ha_lys_s4, entity_id: "${ha_rom_4}", internal: true,
      on_value: [ lambda: 'if (x == "on") lv_obj_add_state(id(lys_s4), LV_STATE_CHECKED); else lv_obj_remove_state(id(lys_s4), LV_STATE_CHECKED);' ] }

# Apple TV-favorittene: lagres i fastvaren og kan endres i HA («a|b|c», rekkefølgen = plassen i rutenettet)
text:
  - platform: template
    id: atv_fav
    name: Apple TV-favoritter
    icon: mdi:star-outline
    mode: text
    optimistic: true
    restore_value: true
    max_length: 200
    initial_value: "${atv_favoritter}"
    entity_category: config
    on_value:
      - script.execute: bygg_apper


binary_sensor:
  - platform: gpio
    id: lader
    name: Lader
    pin: { tca9555: $ekstra_hub, number: 14, mode: { input: true }, inverted: true }   # TP4056 CHRG (lav = lader)
    device_class: battery_charging
  - platform: gpio
    id: loftet
    internal: true
    pin: { number: GPIO4, mode: { input: true }, allow_other_uses: true }
    on_press:
      - script.execute: sovn_teller
  - platform: gpio
    id: dokket
    name: I dokken
    icon: mdi:cradle-outline
    pin: { tca9555: $ekstra_hub, number: 15, mode: { input: true } }   # pogo + via 68 kΩ / 100 kΩ (høy = i dokken)
    filters: [ { delayed_on: 400ms }, { delayed_off: 300ms } ]
    on_press: [ script.execute: dokk_inn ]
    on_release: [ script.execute: dokk_ut ]
