# <<< taster

event:
  - platform: template
    id: tast_hendelse
    name: Tast
    icon: mdi:remote
# >>> hendelser (laget av kabinett/fjernkontroll/taster.py – ikke rediger mellom merkene)
    event_types:
      - av
      - hjem
      - meny
      - opp
      - ned
      - venstre
      - hoyre
      - ok
      - tilbake
      - avslutt
      - spill_pause
      - demp
      - vol_opp
      - vol_ned
      - av_lang
      - hjem_lang
      - meny_lang
      - tilbake_lang
      - avslutt_lang
      - av_dobbel
      - hjem_dobbel
      - meny_dobbel
# <<< hendelser

# ---------- skript ----------
script:
  # Trykk og slipp fra bryterne (taster-blokken) går til tastaturet i skjold_ui.h, som kaller «tast» med typen.
  - id: tast_ned
    mode: parallel
    max_runs: 8
    parameters: { navn: string }
    then:
      - lambda: 'skjold::tastatur.ned(navn, millis());'
  - id: tast_opp
    mode: parallel
    max_runs: 8
    parameters: { navn: string }
    then:
      - lambda: 'skjold::tastatur.opp(navn, millis());'

  # Én tast: type = kort | lang | dobbel | gjenta (gjentak mens den holdes: ingen hendelse, ingen vibrasjon).
  # HA får esphome.skjold_fjernkontroll med { knapp, type, enhet } (se «Home Assistant» i LES_MEG.md).
  - id: tast
    mode: queued
    max_runs: 6
    parameters: { navn: string, type: string }
    then:
      - script.execute: sovn_teller
      - if:
          condition:
            lambda: 'return type != "gjenta";'
          then:
            - output.turn_on: vibrator
            - lambda: |-
                id(tast_hendelse).trigger(type == "kort" ? navn : navn + "_" + type);
            - homeassistant.event:
                event: esphome.skjold_fjernkontroll
                data:
                  knapp: !lambda "return navn;"
                  type: !lambda "return type;"
                  enhet: !lambda "return to_string(id(enhet));"
            - delay: 25ms
            - output.turn_off: vibrator
      - lambda: |-
          bool lang = type == "lang";
          if (type == "dobbel") {   // dobbelttrykk: bare Skjold-tasten har en funksjon på fjernkontrollen (velg enhet)
            if (navn == "hjem") id(vis_velger)->execute();
            return;
          }
          auto &N = id(taster_navn);
          int k = std::find(N.begin(), N.end(), navn) - N.begin();
          // --- læring: neste tast velger plassen ---
          if (id(laer_steg) == 1) {
            if (k >= 44) return;
            id(laer_plass) = id(laer_blokk) * 56 + k; id(laer_steg) = 2;
            lv_label_set_text_fmt(id(lbl_laer_tast), "%s", navn.c_str());
            lv_label_set_text(id(lbl_laer_info), "Pek den gamle fjernkontrollen\nmot nesen og trykk tasten");
            return;
          }
          int e = id(enhet);
          auto post = [](const char *sti, std::string kropp) { id(skjold_post)->execute(std::string(sti), kropp); };
          // --- faste: skjermen, enhetene og alt av ---
          if (navn == "hjem") { if (lang) id(vis_velger)->execute(); else id(vis_start)->execute(); return; }
          if (navn == "meny") { if (lang) id(vis_spiller)->execute(); else id(vis_enhet)->execute(); return; }
          if (navn == "av") { if (lang) id(akt_kjor)->execute(5); else id(enhet_av_paa)->execute(); return; }
          // --- smarthus-raden går alltid til Home Assistant ---
          if (navn == "lys") { id(ha_lys_veksle)->execute(); return; }
          if (navn == "stikk") { id(ha_stikk_veksle)->execute(); return; }
          if (navn == "pluss" || navn == "minus") { id(ha_lys_steg)->execute(navn == "pluss" ? 10 : -10); return; }
          // --- volum: Skjold eller TV, med volumvinduet ---
          if (navn == "vol_opp" || navn == "vol_ned" || navn == "demp") { id(volum_tast)->execute(navn); return; }
          // --- Skjold ---
          if (e == 2) {
            if (navn == "opp") { id(volum_tast)->execute(std::string("vol_opp")); }
            else if (navn == "ned") { id(volum_tast)->execute(std::string("vol_ned")); }
            else if (navn == "spill_pause" || navn == "ok") post("/api/transport", "{\"action\":\"playpause\"}");
            else if (navn == "spol_frem" || navn == "hoyre") post("/api/transport", "{\"action\":\"next\"}");
            else if (navn == "spol_tilbake" || navn == "venstre") post("/api/transport", "{\"action\":\"previous\"}");
            else if (navn.rfind("tall_", 0) == 0 && navn != "tall_0") post("/api/preset", "{\"n\":" + navn.substr(5) + "}");
            else if (navn == "tilbake" || navn == "avslutt") id(vis_start)->execute();
            return;
          }
          // --- Apple TV: kommandoer gjennom HA (remote.send_command) ---
          if (e == 1) {
            static const char *T[][2] = {{"opp", "up"}, {"ned", "down"}, {"venstre", "left"}, {"hoyre", "right"},
                                         {"ok", "select"}, {"tilbake", "menu"}, {"avslutt", "home"},
                                         {"spill_pause", "play_pause"}, {"spol_frem", "skip_forward"},
                                         {"spol_tilbake", "skip_backward"}};
            for (auto &t : T) if (navn == t[0]) {
              std::string kmd = t[1];
              if (lang && kmd == "home") kmd = "home_hold";      // langt trykk: appveksleren
              if (lang && kmd == "menu") kmd = "top_menu";
              id(ha_kommando)->execute(std::string("${atv_remote}"), kmd);
              return;
            }
            return;
          }
          // --- TV og projektor: lærte IR-koder ---
          int plass = (e == 3 ? 56 : 0) + k;
          if (k < 44 && id(ir_prot)[plass] != 0) id(ir_send)->execute(plass);
          else id(vis_toast)->execute("Ingen IR-kode for «" + navn + "» (Mer → Lær IR)");

  # Volumtastene: til Skjold (enheten er Skjold, eller lyd: skjold), ellers til TV-en (HA, eller IR)
  - id: volum_tast
    mode: queued
    max_runs: 4
    parameters: { navn: string }
    then:
      - lambda: |-
          auto post = [](const char *sti, std::string kropp) { id(skjold_post)->execute(std::string(sti), kropp); };
          int e = id(enhet);
          if (e == 2 || std::string("${lyd}") == "skjold") {
            if (navn == "vol_opp") { post("/api/volume", "{\"delta\":2}"); id(volum) = std::min(100, id(volum) + 2); }
            else if (navn == "vol_ned") { post("/api/volume", "{\"delta\":-2}"); id(volum) = std::max(0, id(volum) - 2); }
            else { id(demp) = !id(demp); post("/api/mute", id(demp) ? "{\"mute\":true}" : "{\"mute\":false}"); }
            lv_slider_set_value(id(sl_volum), id(volum), LV_ANIM_OFF);
            lv_label_set_text_fmt(id(lbl_volum), "%d", id(volum));
            id(vis_volum)->execute(std::string("Skjold"), id(demp) ? -2 : id(volum));
            return;
          }
          if ((id(tv_ha) && api::global_api_server->is_connected())) {
            if (navn == "demp") { id(tv_demp) = !id(tv_demp); id(ha_demp)->execute(std::string("${tv_entitet}"), id(tv_demp)); }
            else id(ha_kall)->execute(navn == "vol_opp" ? std::string("media_player.volume_up") : std::string("media_player.volume_down"), std::string("${tv_entitet}"));
            if (navn == "vol_opp" && id(tv_volum) >= 0) id(tv_volum) = std::min(100, id(tv_volum) + 1);
            if (navn == "vol_ned" && id(tv_volum) >= 0) id(tv_volum) = std::max(0, id(tv_volum) - 1);
            id(vis_volum)->execute(std::string("${enhet_0}"), id(tv_demp) ? -2 : id(tv_volum));
            return;
          }
          auto &N = id(taster_navn);
          int k = std::find(N.begin(), N.end(), navn) - N.begin();
          int plass = (e == 3 ? 56 : 0) + k;
          if (k < 44 && id(ir_prot)[plass] != 0) { id(ir_send)->execute(plass); id(vis_volum)->execute(std::string(e == 3 ? "${enhet_3}" : "${enhet_0}"), -1); }
          else id(vis_toast)->execute("Ingen IR-kode for volum (Mer → Lær IR)");

  # Av/på-tasten (kort): slår den valgte enheten av eller på
  - id: enhet_av_paa
    then:
      - lambda: |-
          int e = id(enhet);
          if (e == 0) {
            if ((id(tv_ha) && api::global_api_server->is_connected())) id(ha_kall)->execute(std::string("media_player.toggle"), std::string("${tv_entitet}"));
            else id(ir_send)->execute(id(tv_paa) ? 45 : 44);
            id(tv_paa) = !id(tv_paa);
            id(vis_toast)->execute(std::string(id(tv_paa) ? "Slår på " : "Slår av ") + "${enhet_0}");
          } else if (e == 1) {
            bool paa = std::string(skjold::rtc_atv_tilstand) != "standby" && std::string(skjold::rtc_atv_tilstand) != "off";
            id(ha_kall)->execute(std::string(paa ? "remote.turn_off" : "remote.turn_on"), std::string("${atv_remote}"));
            id(vis_toast)->execute(std::string(paa ? "Apple TV går i dvale" : "Vekker Apple TV"));
          } else if (e == 2) {
            id(skjold_paa) = !id(skjold_paa);
            id(skjold_post)->execute(std::string("/api/power"), std::string(id(skjold_paa) ? "{\"on\":true}" : "{\"on\":false}"));
            id(vis_toast)->execute(std::string(id(skjold_paa) ? "Skjold på" : "Skjold av"));
          } else {
            id(ir_send)->execute(id(proj_paa) ? 56 + 45 : 56 + 44);
            id(proj_paa) = !id(proj_paa);
            id(vis_toast)->execute(std::string(id(proj_paa) ? "Slår på " : "Slår av ") + "${enhet_3}");
          }
          id(oppdater_naa)->execute();

# >>> vekking (laget av kabinett/fjernkontroll/taster.py – ikke rediger mellom merkene)
  # Rett etter oppstart: hvorfor den våknet, og hvilken tast som holdes (den sendes som første trykk).
  - id: les_vekketast
    then:
      - lambda: |-
          static const struct { uint8_t c, p; const char *navn; int g; } B[] = {
            {0, 0, "av", -1}, {0, 1, "hjem", -1}, {0, 2, "meny", -1}, {0, 3, "opp", -1}, {0, 4, "ned", -1}, {0, 5, "venstre", -1}, {0, 6, "hoyre", -1}, {0, 7, "ok", -1}, {0, 8, "", 0}, {0, 9, "", 1}, {0, 10, "", 2}, {0, 11, "", 3}, {0, 12, "", 4}, {0, 13, "", 5}, {0, 14, "", 6}, {0, 15, "", 7}, {1, 0, "", 8}, {1, 1, "", 9}, {1, 2, "", 10}, {1, 3, "", 11}, {1, 4, "", 12}, {1, 5, "", 13}, {1, 6, "", 14}, {1, 7, "", 15}, {1, 8, "", 16}, {1, 9, "", 17}, {1, 10, "", 18}, {1, 11, "", 19}, {1, 12, "", 20}, {1, 13, "", 21}, {1, 14, "", 22}, {1, 15, "", 23}, {2, 0, "", 24}, {2, 1, "", 25}, {2, 2, "", 26}, {2, 3, "", 27}, {2, 4, "", 28}, {2, 5, "", 29}, {2, 6, "", 30}, {2, 7, "", 31}, {2, 8, "", 32}, {2, 9, "", 33}, {2, 10, "", 34}};
          auto aarsak = esp_sleep_get_wakeup_cause();
          ESP_LOGI("vekking", "vekket av %s", aarsak == ESP_SLEEP_WAKEUP_EXT0 ? "tast (TCA9555 INT)" :
                   aarsak == ESP_SLEEP_WAKEUP_EXT1 ? "vibrasjonsbryteren (løftet)" : "strøm på / omstart");
          if (aarsak != ESP_SLEEP_WAKEUP_EXT0) return;
          for (auto &b : B) {
            bool nede = false;
            switch (b.c) { case 0: nede = !id(tca_a).digital_read(b.p); break; case 1: nede = !id(tca_b).digital_read(b.p); break; case 2: nede = !id(tca_c).digital_read(b.p); break; }
            if (!nede) continue;
            std::string n = b.g < 0 ? std::string(b.navn) : id(oppsett_kart)[id(oppsett_nr)][b.g];
            if (n.empty()) continue;
            ESP_LOGI("vekking", "tasten %s holdes: sendes som første trykk", n.c_str());
            skjold::tastatur.ignorer = n;
            skjold::tastatur.ignorer_til = millis() + 1500;
            return;
          }
# <<< vekking

  # POST til valgt Skjold (venter på Wi-Fi etter søvn). Svaret er full status, så skjermen oppdateres med en gang.
  - id: skjold_post
    mode: queued
    max_runs: 6
    parameters: { sti: string, kropp: string }
    then:
      - wait_until: { condition: wifi.connected, timeout: 5s }
      - http_request.post:
          url: !lambda "return id(skjold_base) + sti;"
          request_headers: { Content-Type: application/json }
          body: !lambda "return kropp;"
          capture_response: true
          max_response_buffer_size: 16384
          on_response:
            then:
              - lambda: "id(les_status)->execute(body);"

  - id: hent_status
    mode: restart
    then:
      - http_request.get:
          url: !lambda 'return id(skjold_base) + "/api/status";'
          capture_response: true
          max_response_buffer_size: 16384
          on_response:
            then:
              - lambda: "id(les_status)->execute(body);"

  # /api/status → volum, spiller, demp, tittel/artist (eller radiokanalen) og cover
  - id: les_status
    mode: queued
    parameters: { body: string }
    then:
      - lambda: |-
          std::string t, a, kilde, ny;
          bool paa = true;
          bool ok = json::parse_json(body, [&](JsonObject s) -> bool {
            if (!s["volume"].is<int>()) return false;
            id(volum) = s["volume"] | 0;
            id(spiller) = s["playing"] | false;
            id(demp) = s["mute"] | false;
            paa = s["power"] | true;
            t = s["title"] | "";
            a = s["artist"] | "";
            kilde = s["input"] | "";
            JsonObject rn = s["radio_now"];
            if (t.empty() && !rn.isNull()) t = rn["name"] | "";
            ny = std::string(s["cover"] | "") + "|" + t;
            return true;
          });
          if (!ok) return;
          id(skjold_paa) = paa;
          id(tittel) = t.empty() ? std::string("Skjold") : t;
          id(artist) = a.empty() ? kilde : a + " · " + kilde;
          skjold::rtc_sett(skjold::rtc_skjold_tittel, sizeof skjold::rtc_skjold_tittel, id(tittel));
          skjold::rtc_sett(skjold::rtc_skjold_artist, sizeof skjold::rtc_skjold_artist, id(artist));
          lv_label_set_text(id(lbl_tittel), id(tittel).c_str());
          lv_label_set_text(id(lbl_artist), id(artist).c_str());
          lv_slider_set_value(id(sl_volum), id(volum), LV_ANIM_OFF);
          lv_label_set_text_fmt(id(lbl_volum), "%d", id(volum));
          lv_label_set_text(id(lbl_spill), id(spiller) ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY);
          if (ny != id(cover_nokkel)) {
            id(cover_nokkel) = ny;
            char url[200];
            snprintf(url, sizeof url, "%s/api/cover?w=120&v=%u", id(skjold_base).c_str(), (unsigned) std::hash<std::string>{}(ny));
            id(cover).set_url(url);
            id(cover).update();
          }
          id(oppdater_naa)->execute();

  # /api/presets → navnene på radiofavoritt 1–6
  - id: hent_favoritter
    then:
      - http_request.get:
          url: !lambda 'return id(skjold_base) + "/api/presets";'
          capture_response: true
          max_response_buffer_size: 16384
          on_response:
            then:
              - lambda: |-
                  lv_obj_t *lbl[6] = {id(lbl_fav1), id(lbl_fav2), id(lbl_fav3), id(lbl_fav4), id(lbl_fav5), id(lbl_fav6)};
                  json::parse_json(body, [&](JsonObject r) -> bool {
                    for (JsonObject p : r["items"].as<JsonArray>()) {
                      int n = p["n"] | 0;
                      if (n >= 1 && n <= 6) lv_label_set_text(lbl[n - 1], (const char *) (p["title"] | "–"));
                    }
                    return true;
                  });

  # /api/rom → andre Skjold-enheter på nettet (mDNS), de fire første på rom-siden
  - id: hent_rom
    then:
      - http_request.get:
          url: "http://${skjold_host}:${skjold_port}/api/rom"
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - lambda: |-
                  id(rom_navn).clear(); id(rom_base).clear();
                  json::parse_json(body, [](JsonObject r) -> bool {
                    for (JsonObject p : r["rom"].as<JsonArray>()) {
                      if (id(rom_navn).size() >= 4) break;
                      id(rom_navn).push_back(p["navn"] | "?");
                      id(rom_base).push_back(p["base"] | "");
                    }
                    return true;
                  });
                  lv_obj_t *b[4] = {id(rom_1), id(rom_2), id(rom_3), id(rom_4)};
                  lv_obj_t *l[4] = {id(lbl_rom_1), id(lbl_rom_2), id(lbl_rom_3), id(lbl_rom_4)};
                  for (int i = 0; i < 4; i++) {
                    if (i < (int) id(rom_navn).size()) { lv_label_set_text(l[i], id(rom_navn)[i].c_str()); lv_obj_remove_flag(b[i], LV_OBJ_FLAG_HIDDEN); }
                    else lv_obj_add_flag(b[i], LV_OBJ_FLAG_HIDDEN);
                  }
                  int v = id(rom_valgt);
                  if (v >= 0 && v < (int) id(rom_base).size()) {
                    id(skjold_base) = id(rom_base)[v];
                    lv_label_set_text(id(lbl_rom), id(rom_navn)[v].c_str());
                  }

  - id: velg_rom
    parameters: { nr: int }
    then:
      - lambda: |-
          id(rom_valgt) = nr;
          if (nr >= 0 && nr < (int) id(rom_base).size()) {
            id(skjold_base) = id(rom_base)[nr];
            lv_label_set_text(id(lbl_rom), id(rom_navn)[nr].c_str());
          } else {
            id(skjold_base) = "http://${skjold_host}:${skjold_port}";
            lv_label_set_text(id(lbl_rom), "${skjold_host}");
          }
          id(cover_nokkel) = "";
      - script.execute: hent_favoritter
      - script.execute: hent_status
      - lvgl.page.show: { id: side_spiller, animation: MOVE_RIGHT, time: 200ms }

  # ---------- IR ----------
  # send lært kode fra plass 0–111
  - id: ir_send
    mode: queued
    parameters: { plass: int }
    then:
      - lambda: |-
          if (plass < 0 || plass >= 112 || id(ir_prot)[plass] == 0) { ESP_LOGW("ir", "ingen kode på plass %d", plass); return; }
          uint32_t d = id(ir_data)[plass];
          uint8_t nb = id(ir_bits)[plass];
          auto call = id(ir_tx).transmit();
          switch (id(ir_prot)[plass]) {
            case 1: { remote_base::NECData x{}; x.address = d >> 16; x.command = d & 0xFFFF; x.command_repeats = 1;
                      remote_base::NECProtocol().encode(call.get_data(), x); break; }
            case 2: { remote_base::SamsungData x{}; x.data = d; x.nbits = nb ? nb : 32;
                      remote_base::SamsungProtocol().encode(call.get_data(), x); break; }
            case 3: { remote_base::SonyData x{}; x.data = d; x.nbits = nb ? nb : 12;
                      remote_base::SonyProtocol().encode(call.get_data(), x); call.set_send_times(3); call.set_send_wait(45000); break; }
            case 4: { remote_base::RC5Data x{}; x.address = d >> 8; x.command = d & 0xFF;
                      remote_base::RC5Protocol().encode(call.get_data(), x); break; }
            case 5: { remote_base::LGData x{}; x.data = d; x.nbits = nb ? nb : 28;
                      remote_base::LGProtocol().encode(call.get_data(), x); break; }
            default: return;
          }
          call.perform();

  # IR mottatt (bare under læring): vis koden, «Lagre» skriver den til plassen
  - id: ir_mottatt
    parameters: { prot: int, data: uint32_t, bits: int }
    then:
      - lambda: |-
          if (id(laer_steg) != 2 && id(laer_steg) != 3) return;
          id(laer_prot) = prot; id(laer_data) = data; id(laer_bits) = bits; id(laer_steg) = 3;
          static const char *P[] = {"?", "NEC", "Samsung", "Sony", "RC5", "LG"};
          lv_label_set_text_fmt(id(lbl_laer_kode), "%s 0x%08X", P[prot], (unsigned) data);
          lv_label_set_text(id(lbl_laer_info), "Mottatt! Trykk «Lagre».");

  - id: laer_start
    parameters: { plass: int }   # −1 = neste tast velger plassen, 44–50 = på, av, HDMI 1–4, TV (i valgt blokk)
    then:
      - lambda: |-
          static const char *M[] = {"På", "Av", "HDMI 1", "HDMI 2", "HDMI 3", "HDMI 4", "TV"};
          id(laer_plass) = plass < 0 ? -1 : id(laer_blokk) * 56 + plass; id(laer_steg) = plass < 0 ? 1 : 2;
          lv_label_set_text(id(lbl_laer_kode), "–");
          if (plass < 0) { lv_label_set_text(id(lbl_laer_tast), "–"); lv_label_set_text(id(lbl_laer_info), "Trykk tasten du vil lære"); }
          else { lv_label_set_text(id(lbl_laer_tast), M[plass - 44]);
                 lv_label_set_text(id(lbl_laer_info), "Pek den gamle fjernkontrollen\nmot nesen og trykk tasten"); }
      - output.turn_on: strom_skjerm
      - lvgl.page.show: { id: side_laer, animation: MOVE_LEFT, time: 200ms }

  - id: laer_blokk_sett
    parameters: { b: int }
    then:
      - lambda: |-
          id(laer_blokk) = b;
          if (b == 0) { lv_obj_add_state(id(laer_tv), LV_STATE_CHECKED); lv_obj_remove_state(id(laer_proj), LV_STATE_CHECKED); }
          else { lv_obj_add_state(id(laer_proj), LV_STATE_CHECKED); lv_obj_remove_state(id(laer_tv), LV_STATE_CHECKED); }
          if (id(laer_steg) == 1) lv_label_set_text(id(lbl_laer_info), "Trykk tasten du vil lære");

  - id: laer_lagre
    then:
      - lambda: |-
          int p = id(laer_plass);
          if (id(laer_steg) != 3 || p < 0 || p >= 112) return;
          id(ir_prot)[p] = id(laer_prot); id(ir_data)[p] = id(laer_data); id(ir_bits)[p] = id(laer_bits);
          id(laer_steg) = 1;
          lv_label_set_text(id(lbl_laer_info), "Lagret. Trykk neste tast,\neller «Ferdig».");
          global_preferences->sync();
      - script.execute: { id: vis_toast, tekst: "IR-koden er lagret" }

  # ---------- TV-innganger ----------
  # n = 1–4 HDMI, 5 TV-tuner. TV-en: HA (media_player.select_source) hvis den finnes der, ellers lært IR-kode.
  # Projektoren: bare IR.
  - id: inngang
    mode: queued
    parameters: { blokk: int, n: int }
    then:
      - lambda: |-
          static const char *NAVN[6] = {"", "${tv_inngang_1}", "${tv_inngang_2}", "${tv_inngang_3}", "${tv_inngang_4}", "${tv_inngang_5}"};
          if (n < 1 || n > 5) return;
          if (blokk == 0 && id(tv_ha) && api::global_api_server->is_connected()) {
            id(ha_kilde)->execute(std::string("${tv_entitet}"), std::string(NAVN[n]));
            return;
          }
          int plass = blokk * 56 + 45 + n;
          if (id(ir_prot)[plass] != 0) id(ir_send)->execute(plass);
          else id(vis_toast)->execute(std::string("Lær IR for ") + NAVN[n] + " (Mer → Lær IR)");

  # Knappene på inngangssiden: 1–5 som over, 6 = Apple TV (HDMI ${atv_hdmi} + vekk Apple TV), 7 = Skjold (lyden via Skjold)
  - id: velg_inngang
    parameters: { k: int }
    then:
      - lambda: |-
          int blokk = id(enhet) == 3 ? 1 : 0;
          if (k == 7) {
            id(skjold_post)->execute(std::string("/api/power"), std::string("{\"on\":true}"));
            id(skjold_post)->execute(std::string("/api/input"), std::string("{\"input\":\"${tv_kilde}\"}"));
            id(vis_toast)->execute(std::string("Lyden går gjennom Skjold"));
            return;
          }
          int n = k == 6 ? ${atv_hdmi} : k;
          id(inngang)->execute(blokk, n);
          if (k == 6) {
            id(ha_kall)->execute(std::string("remote.turn_on"), std::string("${atv_remote}"));
            id(vis_toast)->execute(std::string("Apple TV på HDMI ${atv_hdmi}"));
          } else {
            static const char *NAVN[6] = {"", "${tv_inngang_1}", "${tv_inngang_2}", "${tv_inngang_3}", "${tv_inngang_4}", "${tv_inngang_5}"};
            id(vis_toast)->execute(std::string("Bytter til ") + NAVN[n]);
            skjold::rtc_sett(skjold::rtc_tv_kilde, sizeof skjold::rtc_tv_kilde, NAVN[n]);
          }
      - script.execute: merk_inngang

  - id: merk_inngang                  # gullkant på inngangen TV-en står på
    then:
      - lambda: |-
          static const char *NAVN[6] = {"", "${tv_inngang_1}", "${tv_inngang_2}", "${tv_inngang_3}", "${tv_inngang_4}", "${tv_inngang_5}"};
          lv_obj_t *b[7] = {id(inn_1), id(inn_2), id(inn_3), id(inn_4), id(inn_5), id(inn_atv), id(inn_skj)};
          std::string k = skjold::rtc_tv_kilde;
          for (int i = 0; i < 7; i++) {
            bool p = i < 5 ? k == NAVN[i + 1] : (i == 5 && k == NAVN[${atv_hdmi}]);
            if (p) lv_obj_add_state(b[i], LV_STATE_CHECKED); else lv_obj_remove_state(b[i], LV_STATE_CHECKED);
          }
          lv_label_set_text(id(lbl_inn_kilde), id(enhet) == 3 ? "Projektoren styres med lærte IR-koder" :
                            (id(tv_ha) ? "Styres gjennom Home Assistant" : "Styres med lærte IR-koder"));
          lv_label_set_text(id(lbl_inn_tittel), id(enhet) == 3 ? "${enhet_3}" : "${enhet_0}");

  # ---------- Apple TV-apper ----------
  # Rutenettet: favorittene først (gullkant), så resten av source_list. Trykk = åpne, hold = fest/flytt.
  - id: bygg_apper
    mode: restart
    then:
      - lambda: |-
          skjold::rtc_klar();
          std::vector<std::string> alle = skjold::les_liste(skjold::rtc_apper);
          std::vector<std::string> fav = skjold::les_liste(id(atv_fav).state);
          std::vector<std::string> ord(fav);
          int nf = ord.size();
          for (auto &a : alle) if (std::find(fav.begin(), fav.end(), a) == fav.end()) ord.push_back(a);
          id(apper) = ord; id(app_fav_antall) = nf;
          lv_obj_t *g = id(apper_rutenett);
          lv_obj_clean(g);
          for (size_t i = 0; i < ord.size() && i < 48; i++) {
            lv_obj_t *t = lv_button_create(g);
            lv_obj_set_size(t, 68, 58);
            lv_obj_set_style_radius(t, 14, 0);
            lv_obj_set_style_bg_color(t, lv_color_hex(skjold::flisfarge(ord[i])), 0);
            lv_obj_set_style_bg_opa(t, LV_OPA_COVER, 0);
            lv_obj_set_style_bg_color(t, lv_color_hex(0x3A3A3E), LV_STATE_PRESSED);
            lv_obj_set_style_shadow_width(t, 0, 0);
            lv_obj_set_style_border_width(t, (int) i < nf ? 2 : 0, 0);
            lv_obj_set_style_border_color(t, lv_color_hex(0xE8B450), 0);
            lv_obj_set_style_pad_all(t, 2, 0);
            lv_obj_t *a = lv_label_create(t);
            lv_label_set_text(a, skjold::initialer(ord[i]).c_str());
            lv_obj_set_style_text_font(a, id(f_tittel)->get_lv_font(), 0);
            lv_obj_set_style_text_color(a, lv_color_hex(0xF0EEE8), 0);
            lv_obj_align(a, LV_ALIGN_TOP_MID, 0, 7);
            lv_obj_t *n = lv_label_create(t);
            lv_label_set_text(n, ord[i].c_str());
            lv_label_set_long_mode(n, LV_LABEL_LONG_DOT);
            lv_obj_set_width(n, 62);
            lv_obj_set_style_text_align(n, LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_set_style_text_font(n, id(f_tekst)->get_lv_font(), 0);
            lv_obj_set_style_text_color(n, lv_color_hex(0xDAD7CF), 0);
            lv_obj_align(n, LV_ALIGN_BOTTOM_MID, 0, -4);
            lv_obj_add_event_cb(t, [](lv_event_t *ev) {
              int j = (int) (intptr_t) lv_event_get_user_data(ev);
              if (j < (int) id(apper).size()) id(atv_start_app)->execute(id(apper)[j]);
            }, LV_EVENT_SHORT_CLICKED, (void *) (intptr_t) i);
            lv_obj_add_event_cb(t, [](lv_event_t *ev) {
              id(app_valgt) = (int) (intptr_t) lv_event_get_user_data(ev);
              id(vis_appvalg)->execute();
            }, LV_EVENT_LONG_PRESSED, (void *) (intptr_t) i);
          }
          if (ord.empty()) lv_obj_remove_flag(id(lbl_apper_tom), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_apper_tom), LV_OBJ_FLAG_HIDDEN);

  - id: atv_start_app
    parameters: { app: string }
    then:
      - lambda: 'id(enhet) = 1; id(vis_toast)->execute("Åpner " + app);'
      - homeassistant.action:
          action: media_player.select_source
          data: { entity_id: "${atv_entitet}" }
          data_template: { source: "{{ app }}" }
          variables: { app: !lambda "return app;" }

  - id: vis_appvalg                   # valgpanelet for flisa som holdes inne
    then:
      - lambda: |-
          int i = id(app_valgt);
          if (i < 0 || i >= (int) id(apper).size()) return;
          bool fav = i < id(app_fav_antall);
          lv_label_set_text(id(lbl_appvalg), id(apper)[i].c_str());
          lv_label_set_text(id(lbl_appvalg_fest), fav ? "Løsne" : "Fest");
          if (fav) { lv_obj_remove_state(id(appvalg_v), LV_STATE_DISABLED); lv_obj_remove_state(id(appvalg_h), LV_STATE_DISABLED); }
          else { lv_obj_add_state(id(appvalg_v), LV_STATE_DISABLED); lv_obj_add_state(id(appvalg_h), LV_STATE_DISABLED); }
          lv_obj_remove_flag(id(appvalg), LV_OBJ_FLAG_HIDDEN);
          lv_obj_fade_in(id(appvalg), 150, 0);

  # h: 0 = fest/løsne, −1 = flytt fram, +1 = flytt bak. Favorittene lagres i «Apple TV-favoritter» (også i HA).
  - id: appvalg_handling
    parameters: { h: int }
    then:
      - lambda: |-
          int i = id(app_valgt);
          if (i < 0 || i >= (int) id(apper).size()) return;
          std::vector<std::string> fav = skjold::les_liste(id(atv_fav).state);
          std::string navn = id(apper)[i];
          auto p = std::find(fav.begin(), fav.end(), navn);
          if (h == 0) {
            if (p == fav.end()) fav.push_back(navn); else fav.erase(p);
            lv_obj_add_flag(id(appvalg), LV_OBJ_FLAG_HIDDEN);
          } else if (p != fav.end()) {
            int j = p - fav.begin(), m = j + h;
            if (m < 0 || m >= (int) fav.size()) return;
            std::swap(fav[j], fav[m]);
            id(app_valgt) = m;
          }
          id(atv_fav).make_call().set_value(skjold::slaa_sammen(fav)).perform();

  # ---------- aktiviteter ----------
  # Stegene står i substitutions (akt1_… – akt5_…); nr 5 = «Alt av» (langt trykk på av/på). Hvert steg vises på skjermen
  # mens det kjøres. HA får hendelsen esphome.skjold_fjernkontroll_aktivitet, så du kan legge til mer i en automasjon.
  - id: akt_kjor
    mode: restart
    parameters: { nr: int }
    then:
      - lambda: |-
          struct Akt { const char *navn; int enhet; const char *tv; int inn; const char *proj; const char *atv;
                       const char *app; const char *skj; const char *scene; };
          static const Akt A[6] = {
            {"${akt1_navn}", ${akt1_enhet}, "${akt1_tv}", ${akt1_inngang}, "${akt1_projektor}", "${akt1_atv}", "${akt1_app}", "${akt1_skjold}", "${akt1_scene}"},
            {"${akt2_navn}", ${akt2_enhet}, "${akt2_tv}", ${akt2_inngang}, "${akt2_projektor}", "${akt2_atv}", "${akt2_app}", "${akt2_skjold}", "${akt2_scene}"},
            {"${akt3_navn}", ${akt3_enhet}, "${akt3_tv}", ${akt3_inngang}, "${akt3_projektor}", "${akt3_atv}", "${akt3_app}", "${akt3_skjold}", "${akt3_scene}"},
            {"${akt4_navn}", ${akt4_enhet}, "${akt4_tv}", ${akt4_inngang}, "${akt4_projektor}", "${akt4_atv}", "${akt4_app}", "${akt4_skjold}", "${akt4_scene}"},
            {"${akt5_navn}", ${akt5_enhet}, "${akt5_tv}", ${akt5_inngang}, "${akt5_projektor}", "${akt5_atv}", "${akt5_app}", "${akt5_skjold}", "${akt5_scene}"},
            {"Alt av", 2, "av", 0, "av", "av", "", "av", "${scene_alt_av}"}};
          static const char *INN[6] = {"", "${tv_inngang_1}", "${tv_inngang_2}", "${tv_inngang_3}", "${tv_inngang_4}", "${tv_inngang_5}"};
          if (nr < 0 || nr > 5) return;
          const Akt &a = A[nr];
          auto er = [](const char *s, const char *v) { return strcmp(s, v) == 0; };
          std::vector<std::string> k, t;
          auto steg = [&](std::string kode, std::string tekst) { k.push_back(kode); t.push_back(tekst); };
          if (er(a.tv, "på")) steg("tv1", "Slår på ${enhet_0}");
          if (er(a.proj, "på")) steg("pj1", "Slår på ${enhet_3}");
          if (a.inn >= 1 && a.inn <= 5) steg("inn" + to_string(a.inn), std::string("Bytter til ") + INN[a.inn]);
          if (er(a.atv, "på") || a.app[0]) steg("atv1", "Vekker Apple TV");
          if (a.app[0]) steg(std::string("app") + a.app, std::string("Åpner ") + a.app);
          if (a.skj[0]) steg(std::string("skj") + a.skj, er(a.skj, "av") ? std::string("Slår av Skjold") : std::string("Skjold: ") + a.skj);
          if (a.scene[0]) steg(std::string("scn") + a.scene, std::string("Scene ") + (strchr(a.scene, '.') ? strchr(a.scene, '.') + 1 : a.scene));
          if (er(a.atv, "av")) steg("atv0", "Apple TV i dvale");
          if (er(a.tv, "av")) steg("tv0", "Slår av ${enhet_0}");
          if (er(a.proj, "av")) steg("pj0", "Slår av ${enhet_3}");
          if (k.size() > 8) { k.resize(8); t.resize(8); }
          id(akt_koder) = k; id(akt_i) = 0; id(akt_nr) = nr;
          lv_obj_t *T[8] = {id(akt_t0), id(akt_t1), id(akt_t2), id(akt_t3), id(akt_t4), id(akt_t5), id(akt_t6), id(akt_t7)};
          lv_obj_t *I[8] = {id(akt_i0), id(akt_i1), id(akt_i2), id(akt_i3), id(akt_i4), id(akt_i5), id(akt_i6), id(akt_i7)};
          for (int i = 0; i < 8; i++) {
            lv_label_set_text(T[i], i < (int) t.size() ? (t[i] + " …").c_str() : "");
            lv_obj_set_style_text_color(T[i], lv_color_hex(0x6E6C68), 0);
            lv_label_set_text(I[i], i < (int) t.size() ? LV_SYMBOL_DUMMY : "");
          }
          lv_label_set_text(id(lbl_akt_navn), a.navn);
          lv_obj_remove_flag(id(akt_spinner), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *B[5] = {id(akt_1), id(akt_2), id(akt_3), id(akt_4), id(akt_5)};
          for (int i = 0; i < 5; i++) if (i == nr) lv_obj_add_state(B[i], LV_STATE_CHECKED); else lv_obj_remove_state(B[i], LV_STATE_CHECKED);
      - script.execute: { id: vis_side, side: 8, retning: 0 }
      - homeassistant.event:
          event: esphome.skjold_fjernkontroll_aktivitet
          data: { aktivitet: !lambda "return to_string(id(akt_nr));" }
      - while:
          condition:
            lambda: "return id(akt_i) < (int) id(akt_koder).size();"
          then:
            - lambda: |-
                lv_obj_t *T[8] = {id(akt_t0), id(akt_t1), id(akt_t2), id(akt_t3), id(akt_t4), id(akt_t5), id(akt_t6), id(akt_t7)};
                lv_obj_t *I[8] = {id(akt_i0), id(akt_i1), id(akt_i2), id(akt_i3), id(akt_i4), id(akt_i5), id(akt_i6), id(akt_i7)};
                int i = id(akt_i);
                lv_obj_set_style_text_color(T[i], lv_color_hex(0xF0EEE8), 0);
                lv_obj_set_style_text_color(I[i], lv_color_hex(0xE8B450), 0);
                lv_label_set_text(I[i], LV_SYMBOL_RIGHT);
                std::string s = id(akt_koder)[i], kode = s.substr(0, 3), arg = s.substr(3);
                bool tvha = id(tv_ha) && api::global_api_server->is_connected();
                auto ha = [](const char *tj, const char *ent) { id(ha_kall)->execute(std::string(tj), std::string(ent)); };
                uint32_t v = 300;
                if (kode == "tv1") { if (tvha) ha("media_player.turn_on", "${tv_entitet}"); else id(ir_send)->execute(44); id(tv_paa) = true; v = ${tv_oppstart_ms}; }
                else if (kode == "tv0") { if (tvha) ha("media_player.turn_off", "${tv_entitet}"); else id(ir_send)->execute(45); id(tv_paa) = false; }
                else if (kode == "pj1") { id(ir_send)->execute(56 + 44); id(proj_paa) = true; v = 1500; }
                else if (kode == "pj0") { id(ir_send)->execute(56 + 45); id(proj_paa) = false; }
                else if (kode == "inn") { id(inngang)->execute(0, atoi(arg.c_str())); v = 800; }
                else if (kode == "atv") { ha(arg == "1" ? "remote.turn_on" : "remote.turn_off", "${atv_remote}"); v = arg == "1" ? 1500 : 300; }
                else if (kode == "app") { id(ha_kilde)->execute(std::string("${atv_entitet}"), arg); v = 600; }
                else if (kode == "skj") {
                  if (arg == "av") { id(skjold_post)->execute(std::string("/api/power"), std::string("{\"on\":false}")); id(skjold_paa) = false; }
                  else { id(skjold_post)->execute(std::string("/api/power"), std::string("{\"on\":true}"));
                         id(skjold_post)->execute(std::string("/api/input"), "{\"input\":\"" + arg + "\"}"); id(skjold_paa) = true; v = 500; }
                }
                else if (kode == "scn") { id(ha_scene)->execute(arg); v = 200; }
                id(akt_vent) = v;
            - delay: !lambda "return id(akt_vent);"
            - lambda: |-
                lv_obj_t *T[8] = {id(akt_t0), id(akt_t1), id(akt_t2), id(akt_t3), id(akt_t4), id(akt_t5), id(akt_t6), id(akt_t7)};
                lv_obj_t *I[8] = {id(akt_i0), id(akt_i1), id(akt_i2), id(akt_i3), id(akt_i4), id(akt_i5), id(akt_i6), id(akt_i7)};
                int i = id(akt_i);
                std::string s = lv_label_get_text(T[i]);
                if (s.size() > 4) s.resize(s.size() - 4);   // fjern « …»
                lv_label_set_text(T[i], s.c_str());
                lv_obj_set_style_text_color(T[i], lv_color_hex(0xB4B1AA), 0);
                lv_label_set_text(I[i], LV_SYMBOL_OK);
                id(akt_i) += 1;
      - lambda: |-
          static const int E[6] = {${akt1_enhet}, ${akt2_enhet}, ${akt3_enhet}, ${akt4_enhet}, ${akt5_enhet}, 2};
          lv_obj_add_flag(id(akt_spinner), LV_OBJ_FLAG_HIDDEN);
          id(enhet) = E[id(akt_nr)];
          id(oppdater_enhet)->execute();
      - delay: 900ms
      - if:
          condition:
            lambda: "return id(akt_nr) == 5;"
          then:
            - script.execute: { id: vis_side, side: 0, retning: 0 }
          else:
            - script.execute: { id: vis_enhet, retning: 0 }

  # ---------- Home Assistant ----------
  - id: ha_kall                       # tjeneste med bare entity_id (media_player.turn_on, remote.turn_off …)
    mode: queued
    parameters: { tjeneste: string, entitet: string }
    then:
      - homeassistant.action:
          action: !lambda "return tjeneste;"
          data_template: { entity_id: "{{ e }}" }
          variables: { e: !lambda "return entitet;" }
  - id: ha_kommando                   # remote.send_command (Apple TV: up, down, left, right, select, menu, home …)
    mode: queued
    max_runs: 6
    parameters: { entitet: string, kommando: string }
    then:
      - homeassistant.action:
          action: remote.send_command
          data_template: { entity_id: "{{ e }}", command: "{{ k }}" }
          variables: { e: !lambda "return entitet;", k: !lambda "return kommando;" }
  - id: ha_kilde                      # media_player.select_source (TV-inngang eller Apple TV-app)
    mode: queued
    parameters: { entitet: string, kilde: string }
    then:
      - homeassistant.action:
          action: media_player.select_source
          data_template: { entity_id: "{{ e }}", source: "{{ k }}" }
          variables: { e: !lambda "return entitet;", k: !lambda "return kilde;" }
  - id: ha_demp
    parameters: { entitet: string, paa: bool }
    then:
      - homeassistant.action:
          action: media_player.volume_mute
          data_template: { entity_id: "{{ e }}", is_volume_muted: "{{ m }}" }
          variables: { e: !lambda "return entitet;", m: !lambda 'return paa ? "true" : "false";' }
  - id: ha_lys_sett
    parameters: { entitet: string, paa: bool }
    then:
      - homeassistant.action:
          action: !lambda 'return paa ? "light.turn_on" : "light.turn_off";'
          data_template: { entity_id: "{{ e }}" }
          variables: { e: !lambda "return entitet;" }
  - id: ha_lys_pst
    parameters: { entitet: string, pst: int }
    then:
      - homeassistant.action:
          action: light.turn_on
          data_template: { entity_id: "{{ e }}", brightness_pct: "{{ p }}" }
          variables: { e: !lambda "return entitet;", p: !lambda "return pst;" }
  - id: ha_lys_veksle
    then: [ { homeassistant.action: { action: light.toggle, data: { entity_id: "${ha_lys}" } } } ]
  - id: ha_stikk_veksle
    then: [ { homeassistant.action: { action: switch.toggle, data: { entity_id: "${ha_stikk}" } } } ]
  - id: ha_lys_steg
    parameters: { steg: int }
    then:
      - homeassistant.action:
          action: light.turn_on
          data: { entity_id: "${ha_lys}" }
          data_template: { brightness_step_pct: "{{ steg }}" }
          variables: { steg: !lambda 'return steg;' }
  - id: ha_scene
    parameters: { entitet: string }
    then:
      - homeassistant.action:
          action: scene.turn_on
          data_template: { entity_id: "{{ e }}" }
          variables: { e: !lambda 'return entitet;' }
      - script.execute: { id: vis_toast, tekst: "Scene slått på" }

  # ---------- skjermen: sider, enheter, vinduer ----------
  # Sidene i rekkefølge: 0 start, 1 apper, 2 innganger, 3 spiller, 4 rom, 5 hjem, 6 mer, 7 lær IR, 8 aktivitet starter,
  # 9 Skjold-kilder, 10 i dokken.
  # retning: 1 = skyv mot venstre (fram), −1 = mot høyre (tilbake), 0 = ton inn.
  - id: vis_side
    parameters: { side: int, retning: int }
    then:
      - lambda: |-
          lv_screen_load_anim_t a = retning > 0 ? LV_SCREEN_LOAD_ANIM_MOVE_LEFT : retning < 0 ? LV_SCREEN_LOAD_ANIM_MOVE_RIGHT : LV_SCREEN_LOAD_ANIM_FADE_IN;
          id(lvgl_hoved)->show_page(side, a, retning == 0 ? 160 : 220);
          lv_obj_t *F[4] = {id(fane_0), id(fane_1), id(fane_2), id(fane_3)};
          int f = side == 0 || side == 8 || side == 10 ? 0 : (side <= 4 || side == 9) ? 1 : side == 5 ? 2 : 3;
          for (int i = 0; i < 4; i++) lv_obj_set_style_text_color(F[i], lv_color_hex(i == f ? 0xE8B450 : 0x96948E), 0);
          lv_obj_add_flag(id(velger), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(appvalg), LV_OBJ_FLAG_HIDDEN);
          if (side == 3) id(hent_status)->execute();
          if (side == 4) id(hent_rom)->execute();
          if (side == 2) id(merk_inngang)->execute();
  - id: vis_start
    then: [ { script.execute: { id: vis_side, side: 0, retning: 0 } } ]
  - id: vis_spiller
    then: [ { script.execute: { id: vis_side, side: 3, retning: 0 } } ]
  - id: vis_enhet                     # enhetens egen side: TV/projektor → innganger, Apple TV → apper, Skjold → spiller
    parameters: { retning: int }
    then:
      - lambda: |-
          static const int S[4] = {2, 1, 3, 2};
          id(vis_side)->execute(S[id(enhet) & 3], retning);
  - id: vis_velger
    then:
      - lambda: |-
          lv_obj_remove_flag(id(velger), LV_OBJ_FLAG_HIDDEN);
          lv_obj_fade_in(id(velger), 150, 0);

  # Velg enhet (fra brikken, velgeren eller sveip). retning: +1/−1 ved sveip, 0 ved trykk.
  - id: velg_enhet
    parameters: { e: int, retning: int }
    then:
      - lambda: 'id(enhet) = (e + 4) % 4;'
      - script.execute: oppdater_enhet
      - script.execute: { id: vis_enhet, retning: !lambda "return retning;" }

  - id: oppdater_enhet                # brikken øverst, velgeren og nå-kortet
    then:
      - lambda: |-
          static const char *NAVN[4] = {"${enhet_0}", "${enhet_1}", "${enhet_2}", "${enhet_3}"};
          static const char *IKON[4] = {LV_SYMBOL_VIDEO, LV_SYMBOL_PLAY, LV_SYMBOL_AUDIO, LV_SYMBOL_IMAGE};
          int e = id(enhet) & 3;
          lv_label_set_text(id(lbl_enhet), NAVN[e]);
          lv_label_set_text(id(lbl_enhet_ikon), IKON[e]);
          lv_obj_t *V[4] = {id(velg_0), id(velg_1), id(velg_2), id(velg_3)};
          for (int i = 0; i < 4; i++) if (i == e) lv_obj_add_state(V[i], LV_STATE_CHECKED); else lv_obj_remove_state(V[i], LV_STATE_CHECKED);
          lv_label_set_text(id(fane_1), e == 1 ? LV_SYMBOL_LIST : e == 2 ? LV_SYMBOL_AUDIO : LV_SYMBOL_VIDEO);
      - script.execute: oppdater_naa

  # «Nå»-kortet på Start og minispilleren på app-siden
  - id: oppdater_naa
    mode: restart
    then:
      - lambda: |-
          skjold::rtc_klar();
          int e = id(enhet) & 3;
          std::string t, u, tidtekst;
          int prog = -1;
          bool spill = false, kan_spille = true;
          std::string tilst = skjold::rtc_atv_tilstand;
          auto tilst_tekst = [](const std::string &s) -> std::string {
            if (s == "playing") return "Spiller"; if (s == "paused") return "Pause"; if (s == "idle" || s == "on") return "Klar";
            if (s == "standby" || s == "off") return "I dvale"; return s.empty() ? "Venter på HA" : s; };
          // Apple TV (minispilleren på app-siden vises uansett valgt enhet)
          std::string at = skjold::rtc_atv_tittel, aa = skjold::rtc_atv_app;
          float pos = id(atv_pos);
          if (tilst == "playing" && id(atv_pos_ms)) pos += (millis() - id(atv_pos_ms)) / 1000.0f;
          int aprog = id(atv_dur) > 1 ? std::min(1000, (int) (pos * 1000 / id(atv_dur))) : -1;
          std::string atid = id(atv_dur) > 1 ? skjold::tid((int) pos) + " / " + skjold::tid((int) id(atv_dur)) : "";
          lv_label_set_text(id(lbl_mini_t), (at.empty() ? (aa.empty() ? std::string("${enhet_1}") : aa) : at).c_str());
          lv_label_set_text(id(lbl_mini_u), ((aa.empty() ? std::string("") : aa + " · ") + tilst_tekst(tilst)).c_str());
          lv_label_set_text(id(lbl_mini_tid), atid.c_str());
          lv_label_set_text(id(lbl_mini_spill), tilst == "playing" ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY);
          if (aprog >= 0) { lv_bar_set_value(id(bar_mini), aprog, LV_ANIM_OFF); lv_obj_remove_flag(id(bar_mini), LV_OBJ_FLAG_HIDDEN); }
          else lv_obj_add_flag(id(bar_mini), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(lbl_mini_ini), skjold::initialer(aa.empty() ? std::string("Apple TV") : aa).c_str());
          lv_obj_set_style_bg_color(id(mini_flis), lv_color_hex(skjold::flisfarge(aa.empty() ? std::string("Apple TV") : aa)), 0);
          // Start-kortet for valgt enhet
          if (e == 1) { t = lv_label_get_text(id(lbl_mini_t)); u = lv_label_get_text(id(lbl_mini_u)); prog = aprog; spill = tilst == "playing"; tidtekst = atid; }
          else if (e == 2) { t = id(tittel) == "Skjold" && skjold::rtc_skjold_tittel[0] ? skjold::rtc_skjold_tittel : id(tittel);
                             u = id(artist).empty() ? std::string(skjold::rtc_skjold_artist) : id(artist);
                             if (!id(skjold_paa)) u = "Av"; spill = id(spiller); }
          else if (e == 0) { t = "${enhet_0}"; u = id(tv_paa) ? std::string("På") + (skjold::rtc_tv_kilde[0] ? std::string(" · ") + skjold::rtc_tv_kilde : "") : "Av";
                             kan_spille = false; }
          else { t = "${enhet_3}"; u = id(proj_paa) ? "På" : "Av"; kan_spille = false; }
          lv_label_set_text(id(lbl_naa_t), t.c_str());
          lv_label_set_text(id(lbl_naa_u), u.c_str());
          lv_label_set_text(id(lbl_dokk_t), t.c_str());
          lv_label_set_text(id(lbl_dokk_u), u.c_str());
          lv_label_set_text(id(lbl_dokk_spill), kan_spille ? (spill ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY) : LV_SYMBOL_POWER);
          {   // dokk-kortet: coveret fra Skjold, ellers en flis med initialer (appen på Apple TV, eller enheten)
            static const char *NAVN[4] = {"${enhet_0}", "${enhet_1}", "${enhet_2}", "${enhet_3}"};
            std::string fn = e == 1 && skjold::rtc_atv_app[0] ? std::string(skjold::rtc_atv_app) : std::string(NAVN[e]);
            lv_label_set_text(id(lbl_dokk_ini), skjold::initialer(fn).c_str());
            lv_obj_set_style_bg_color(id(dokk_flis), lv_color_hex(skjold::flisfarge(fn)), 0);
            if (e == 2 && !id(cover_nokkel).empty()) lv_obj_remove_flag(id(img_dokk_cover), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(img_dokk_cover), LV_OBJ_FLAG_HIDDEN);
          }
          if (prog >= 0) { lv_bar_set_value(id(bar_dokk), prog, LV_ANIM_OFF); lv_obj_remove_flag(id(bar_dokk), LV_OBJ_FLAG_HIDDEN); }
          else lv_obj_add_flag(id(bar_dokk), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(lbl_naa_tid), tidtekst.c_str());
          lv_label_set_text(id(lbl_naa_spill), kan_spille ? (spill ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY) : LV_SYMBOL_POWER);
          if (prog >= 0) { lv_bar_set_value(id(bar_naa), prog, LV_ANIM_OFF); lv_obj_remove_flag(id(bar_naa), LV_OBJ_FLAG_HIDDEN); }
          else lv_obj_add_flag(id(bar_naa), LV_OBJ_FLAG_HIDDEN);

  # Spill/pause-knappen på kortet (eller av/på for TV og projektor)
  - id: naa_knapp
    then:
      - lambda: |-
          int e = id(enhet) & 3;
          if (e == 1) id(ha_kommando)->execute(std::string("${atv_remote}"), std::string("play_pause"));
          else if (e == 2) id(skjold_post)->execute(std::string("/api/transport"), std::string("{\"action\":\"playpause\"}"));
          else id(enhet_av_paa)->execute();

  # Kort melding nederst (1,8 s)
  - id: vis_toast
    mode: restart
    parameters: { tekst: string }
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_toast), tekst.c_str());
          lv_obj_remove_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
          lv_obj_fade_in(id(toast), 150, 0);
      - delay: 1800ms
      - lambda: 'lv_obj_fade_out(id(toast), 200, 0);'
      - delay: 220ms
      - lambda: 'lv_obj_add_flag(id(toast), LV_OBJ_FLAG_HIDDEN);'

  # Volumvinduet (1,3 s). nivå: 0–100, −1 = ukjent (IR), −2 = dempet
  - id: vis_volum
    mode: restart
    parameters: { kilde: string, niva: int }
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_vol_kilde), kilde.c_str());
          if (niva == -2) { lv_label_set_text(id(lbl_vol_ikon), LV_SYMBOL_MUTE); lv_label_set_text(id(lbl_vol_tall), "Dempet"); lv_bar_set_value(id(bar_vol), 0, LV_ANIM_OFF); }
          else if (niva < 0) { lv_label_set_text(id(lbl_vol_ikon), LV_SYMBOL_VOLUME_MAX); lv_label_set_text(id(lbl_vol_tall), ""); lv_bar_set_value(id(bar_vol), 50, LV_ANIM_OFF); }
          else { lv_label_set_text(id(lbl_vol_ikon), niva == 0 ? LV_SYMBOL_MUTE : niva < 50 ? LV_SYMBOL_VOLUME_MID : LV_SYMBOL_VOLUME_MAX);
                 lv_label_set_text_fmt(id(lbl_vol_tall), "%d", niva); lv_bar_set_value(id(bar_vol), niva, LV_ANIM_ON); }
          if (lv_obj_has_flag(id(vol_vindu), LV_OBJ_FLAG_HIDDEN)) { lv_obj_remove_flag(id(vol_vindu), LV_OBJ_FLAG_HIDDEN); lv_obj_fade_in(id(vol_vindu), 120, 0); }
      - delay: 1300ms
      - lambda: 'lv_obj_fade_out(id(vol_vindu), 200, 0);'
      - delay: 220ms
      - lambda: 'lv_obj_add_flag(id(vol_vindu), LV_OBJ_FLAG_HIDDEN);'

  # Innstillinger
  - id: sett_lysstyrke
    parameters: { p: int }
    then:
      - lambda: 'id(lysstyrke) = std::max(10, std::min(100, p));'
      - light.turn_on: { id: baklys, brightness: !lambda "return id(lysstyrke) / 100.0f;" }
  - id: oppdater_info
    then:
      - lambda: |-
          char b[160];
          snprintf(b, sizeof b, "Wi-Fi %.0f dBm · %s\nBatteri %.2f V · %.0f %%%s",
                   id(wifi_db).state, id(ip_adr).state.c_str(), id(batteri_v).state, id(batteri).state,
                   id(lader).state ? " · lader" : "");
          lv_label_set_text(id(lbl_info), b);
          lv_slider_set_value(id(sl_lys), id(lysstyrke), LV_ANIM_OFF);
          lv_slider_set_value(id(sl_sovn), id(sovn_s), LV_ANIM_OFF);
          lv_label_set_text_fmt(id(lbl_sovn), "%d s", id(sovn_s));
          lv_obj_t *O[3] = {id(oppsett_a), id(oppsett_b), id(oppsett_c)};
          for (int i = 0; i < 3; i++) if (i == id(oppsett_nr)) lv_obj_add_state(O[i], LV_STATE_CHECKED); else lv_obj_remove_state(O[i], LV_STATE_CHECKED);

  # Vis siste kjente tilstand med en gang den våkner (RTC-minnet), før HA og Skjold svarer
  - id: vis_hurtigbuffer
    then:
      - lambda: |-
          skjold::rtc_klar();
          if (skjold::rtc_skjold_tittel[0]) { id(tittel) = skjold::rtc_skjold_tittel; id(artist) = skjold::rtc_skjold_artist;
            lv_label_set_text(id(lbl_tittel), id(tittel).c_str()); lv_label_set_text(id(lbl_artist), id(artist).c_str()); }
      - script.execute: oppdater_enhet
      - script.execute: bygg_apper
      - script.execute: merk_inngang

  # ---------- dokken ----------
  - id: dokk_inn
    then:
      - script.execute: sovn_teller
      - script.execute: oppdater_dokk
      - script.execute: { id: vis_side, side: 10, retning: 0 }
      - script.execute: { id: vis_toast, tekst: "Lader i dokken" }
  - id: dokk_ut
    then:
      - script.execute: sovn_teller
      - script.execute: { id: vis_side, side: 0, retning: 0 }
  - id: oppdater_dokk                 # klokka, datoen og batteriet på dokk-skjermen
    then:
      - lambda: |-
          static const char *DAG[7] = {"søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"};
          static const char *MND[12] = {"januar", "februar", "mars", "april", "mai", "juni", "juli", "august",
                                        "september", "oktober", "november", "desember"};
          auto t = id(klokka).now();
          if (t.is_valid()) {
            lv_label_set_text_fmt(id(lbl_klokke), "%02d:%02d", t.hour, t.minute);
            lv_label_set_text_fmt(id(lbl_dato), "%s %d. %s", DAG[(t.day_of_week + 6) % 7], t.day_of_month, MND[t.month - 1]);
          }
          float b = id(batteri).state;
          lv_label_set_text_fmt(id(lbl_dokk_bat), "%s", isnan(b) ? "–" : (std::to_string((int) b) + " %").c_str());
          lv_label_set_text(id(lbl_dokk_status), id(lader).state ? "lader" : (b >= 98 ? "fulladet" : "i dokken"));

  # ---------- søvn ----------
  # Én tidsstempel for siste aktivitet (tast, berøring, løft, handling fra HA). Intervallet under legger den i dyp søvn
  # etter «Søvn etter» (Mer-siden, standard ${sovn_etter}), men aldri mens den lader, lærer IR, kjører en aktivitet,
  # eller «Hold våken» er på. 5 s før dimmes skjermen.
  - id: sovn_teller
    then:
      - lambda: 'id(sist_aktiv) = millis();'
      - if:
          condition:
            lambda: "return id(dimmet);"
          then:
            - lambda: "id(dimmet) = false;"
            - light.turn_on: { id: baklys, brightness: !lambda "return id(lysstyrke) / 100.0f;", transition_length: 150ms }
  - id: sov
    then:
      - light.turn_off: baklys
      - delay: 300ms
      - output.turn_off: strom_skjerm      # skjerm, berøring og IR-mottaker uten strøm
      - output.turn_off: vibrator
      - deep_sleep.enter: dyp_sovn

interval:
  - interval: 20ms                   # tastaturet: lange trykk, dobbelttrykk og gjentak
    then:
      - lambda: 'skjold::tastatur.tikk(millis());'
  - interval: 1s                     # søvn, og dokken (klokke, nattdemping)
    then:
      - lambda: |-
          uint32_t stille = millis() - id(sist_aktiv);
          bool vaaken = id(hold_vaaken).state || id(laer_steg) != 0 || id(akt_kjor)->is_running() || skjold::tastatur.noen_nede();
          if (vaaken) { id(sist_aktiv) = millis(); return; }
          uint32_t grense = (uint32_t) id(sovn_s) * 1000;
          if (id(dokket).state) {   // i dokken: aldri søvn; tilbake til dokk-skjermen, og dempet om natta
            id(oppdater_dokk)->execute();
            if (stille >= grense && id(lvgl_hoved)->get_current_page() != 10) id(vis_side)->execute(10, 0);
            auto t = id(klokka).now();
            bool natt = t.is_valid() && (t.hour >= 22 || t.hour < 7);
            if (natt && !id(dimmet) && stille >= 20000) {
              id(dimmet) = true;
              auto c = id(baklys).turn_on(); c.set_brightness(0.06f); c.set_transition_length(1500); c.perform();
            }
            return;
          }
          if (id(lader).state) { id(sist_aktiv) = millis(); return; }   // lader med USB-C: våken
          if (!id(dimmet) && stille + 5000 >= grense) {
            id(dimmet) = true;
            auto c = id(baklys).turn_on(); c.set_brightness(0.15f); c.set_transition_length(400); c.perform();
          }
          if (stille >= grense && !id(sov)->is_running()) id(sov)->execute();
  - interval: 3s
    then:
      - if:
          condition:
            and:
              - wifi.connected
              - lambda: "return id(enhet) == 2 || id(lvgl_hoved)->get_current_page() == 3;"
          then: [ script.execute: hent_status ]
  - interval: 1s                     # framdriften i Apple TV-spilleren
    then:
      - if:
          condition:
            lambda: 'return std::string(skjold::rtc_atv_tilstand) == "playing";'
          then: [ script.execute: oppdater_naa ]

# ---------- skjermbilder ----------
font:
  - { file: "gfonts://Sora@600", id: f_tittel, size: 19, glyphs: &glyfer " !\"#%&'()*+,-./0123456789:;?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyzÆØÅæøåÉéÜüÖöÄä–·«»…›" }
  - { file: "gfonts://Sora@600", id: f_knapp, size: 13, glyphs: *glyfer }
  - { file: "gfonts://Sora@400", id: f_tekst, size: 11, glyphs: *glyfer }
  - { file: "gfonts://Sora@300", id: f_klokke, size: 64, glyphs: "0123456789:–" }

image:
  - platform: online_image
    id: cover
    url: http://${skjold_host}:${skjold_port}/api/cover?w=120
    format: JPEG
    type: RGB565
    resize: 110x110
    update_interval: never
    on_download_finished:
      - lvgl.image.update: { id: img_cover, src: cover }
      - lvgl.image.update: { id: img_dokk_cover, src: cover }
  - platform: online_image            # bildet til det som spilles på Apple TV (entity_picture fra HA)
    id: atv_bilde
    url: ${ha_url}/
    format: JPEG
    type: RGB565
    resize: 44x44
    update_interval: never
    on_download_finished:
      - lvgl.image.update: { id: img_atv, src: atv_bilde }
      - lvgl.widget.show: img_atv
    on_error:
      - lvgl.widget.hide: img_atv

lvgl:
  id: lvgl_hoved
  displays: [ skjerm ]
  touchscreens: [ beroring ]
  buffer_size: 25%
  bg_color: 0x101012
  default_font: f_tekst
  text_color: 0xF0EEE8
  theme:
    button:
      bg_color: 0x202023
      bg_grad_color: 0x202023
      radius: 12
      border_width: 0
      shadow_width: 0
      text_color: 0xF0EEE8
      text_font: f_knapp
      checked:
        bg_color: 0x342C1E
        border_width: 1
        border_color: 0xE8B450
        text_color: 0xE8B450
      pressed:
        bg_color: 0x3A3A3E
      disabled:
