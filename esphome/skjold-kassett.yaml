# Skjold Kassett – NFC-kassettspiller (ESP32-S3 Zero + PN532 i I²C + WS2812-lys + summer + spolemotor)
# Flash: https://web.esphome.io (første gang via USB-C), deretter OTA fra ESPHome i Home Assistant.
# Se kabinett/kassett/LES_MEG.md for kobling.
substitutions:
  name: skjold-kassett
  friendly_name: Skjold Kassett
  # Adressen til Skjold-enheten som skal spille (mDNS-navn eller IP). ESPHome kan ikke bla i mDNS-tjenester,
  # så bruk <navn>.local som Skjold annonserer (_kipultamp._tcp → vertsnavnet), f.eks. skjold-stue.local.
  skjold_host: skjold.local
  skjold_port: "8765"
  pause_on_remove: "true"
  # Spolene i vinduet: N20-girmotor (6 V, 200 o/min) via DRV8833. spole_max_rps = spolenes fart ved 100 % pådrag
  # (motor ≈ 165 o/min på 5 V × trinseforhold 5/7,6 ≈ 1,8 omdr/s). Juster hvis spolene går for fort eller sakte.
  spole_max_rps: "1.8"
  spole_min_duty: "0.22"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on: { id: ring, effect: "Pust", brightness: 30% }

esp32:
  board: esp32-s3-devkitc-1
  framework: { type: esp-idf }

logger:
api:
  encryption:
    key: !secret skjold_kassett_api_key
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: { ssid: "Skjold Kassett" }
captive_portal:

http_request:
  verify_ssl: false
  timeout: 4s

i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true
  frequency: 400kHz

pn532_i2c:
  id: nfc_leser
  update_interval: 400ms
  on_tag:
    then:
      - logger.log: { format: "Kassett inn: %s", args: ["x.c_str()"] }
      - homeassistant.event:
          event: esphome.skjold_kassett
          data: { uid: !lambda "return x;", state: "in" }
      - http_request.post:
          url: http://${skjold_host}:${skjold_port}/api/nfc/scan
          request_headers: { Content-Type: application/json }
          json:
            uid: !lambda "return x;"
            device: ${name}
            ndef: !lambda |-
              if (tag.has_ndef_message()) {
                auto recs = tag.get_ndef_message()->get_records();
                if (!recs.empty()) return recs[0]->get_payload();
              }
              return std::string("");
          capture_response: true
          on_response:
            then:
              - if:
                  condition: { lambda: "return response->status_code == 200 && body.find(\"\\\"known\\\": true\") != std::string::npos;" }
                  then:
                    - light.turn_on: { id: ring, effect: "Lest", brightness: 80%, red: 100%, green: 72%, blue: 30% }
                    - rtttl.play: "ok:d=16,o=6,b=180:c,e,g"
                  else:
                    - light.turn_on: { id: ring, effect: "Ukjent", brightness: 70%, red: 30%, green: 55%, blue: 100% }
                    - rtttl.play: "ukjent:d=8,o=5,b=160:g,c"
          on_error:
            then:
              - light.turn_on: { id: ring, effect: "Feil", brightness: 80%, red: 100%, green: 15%, blue: 10% }
              - rtttl.play: "feil:d=4,o=4,b=120:c"
  on_tag_removed:
    then:
      - homeassistant.event:
          event: esphome.skjold_kassett
          data: { uid: !lambda "return x;", state: "out" }
      - if:
          condition: { lambda: "return std::string(\"${pause_on_remove}\") == \"true\";" }
          then:
            - http_request.post:
                url: http://${skjold_host}:${skjold_port}/api/nfc/remove
                request_headers: { Content-Type: application/json }
                json: { uid: !lambda "return x;", device: "${name}" }
      - light.turn_on: { id: ring, effect: "Pust", brightness: 30%, red: 100%, green: 78%, blue: 35% }

output:
  - platform: ledc
    id: buzzer_out
    pin: GPIO7
  # DRV8833: AIN1 = GPIO8, AIN2 = GPIO9 (nSLEEP til 3V3, VM til 5V). 20 kHz → ingen hørbar PWM-pipelyd.
  - platform: ledc
    id: spole_a
    pin: GPIO8
    frequency: 20000Hz
  - platform: ledc
    id: spole_b
    pin: GPIO9
    frequency: 20000Hz

globals:
  - { id: spole_mal, type: float, initial_value: "0" }    # ønsket fart (omdr/s, negativ = bakover)
  - { id: spole_naa, type: float, initial_value: "0" }    # fart nå (rampes mykt mot målet)
  - { id: spole_kick, type: int, initial_value: "0" }

interval:
  # Spør Skjold hva spolene skal gjøre (spill / spol / tilbake / stopp)
  - interval: 600ms
    then:
      - http_request.get:
          url: http://${skjold_host}:${skjold_port}/api/nfc/spoler
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) { id(spole_mal) = 0; return; }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    float rps = root["rps"] | 0.0f;
                    int dir = root["retning"] | 1;
                    id(spole_mal) = rps * (dir < 0 ? -1.0f : 1.0f);
                    return true;
                  });
          on_error:
            then:
              - lambda: "id(spole_mal) = 0;"
  # Myk akselerasjon (ca. 2 omdr/s²) og pådrag til DRV8833
  - interval: 40ms
    then:
      - lambda: |-
          const float maxr = ${spole_max_rps}, mind = ${spole_min_duty}, step = 0.08f;
          float m = id(spole_mal), n = id(spole_naa);
          float was = n;
          n += std::max(-step, std::min(step, m - n));
          id(spole_naa) = n;
          float a = fabsf(n);
          if (a < 0.03f) { id(spole_a).set_level(0); id(spole_b).set_level(0); id(spole_kick) = 0; return; }
          if (fabsf(was) < 0.03f) id(spole_kick) = 2;          // et lite «spark» så girmotoren kommer i gang
          float d = id(spole_kick) > 0 ? 1.0f : std::min(1.0f, mind + (1.0f - mind) * a / maxr);
          if (id(spole_kick) > 0) id(spole_kick)--;
          if (n > 0) { id(spole_b).set_level(0); id(spole_a).set_level(d); }
          else       { id(spole_a).set_level(0); id(spole_b).set_level(d); }
rtttl:
  output: buzzer_out

light:
  - platform: esp32_rmt_led_strip
    id: ring
    name: "Lys"
    pin: GPIO4
    num_leds: 5             # 5 LED (60/m) i lista bak sporet, under lyslederen i toppen
    rgb_order: GRB
    chipset: WS2812
    default_transition_length: 300ms
    effects:
      - pulse: { name: "Pust", transition_length: 1.6s, update_interval: 1.6s, min_brightness: 10%, max_brightness: 35% }
      - addressable_scan: { name: "Lest", move_interval: 30ms, scan_width: 2 }
      - pulse: { name: "Ukjent", transition_length: 400ms, update_interval: 400ms }
      - strobe:
          name: "Feil"
          colors:
            - { state: true, brightness: 100%, red: 100%, green: 10%, blue: 10%, duration: 150ms }
            - { state: false, duration: 150ms }
