<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skjold Lab Valhalla</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--kort:#141415;--kant:#242426;--tekst:#f2f2ee;--demp:#8b8b86;--gull:#f0c46a;--gull2:#d9a441;--rod:#e05a4a;--gronn:#6fcf7f;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,rgba(217,164,65,.12),transparent 60%),var(--bg);color:var(--tekst);font:15px/1.45 Sora,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
a{color:var(--gull)}
header{display:flex;align-items:center;gap:16px;padding:22px 32px;border-bottom:1px solid var(--kant);position:sticky;top:0;background:rgba(11,11,12,.86);backdrop-filter:blur(10px);z-index:5}
.logo{display:flex;gap:4px;align-items:flex-start;height:28px}.logo i{width:5px;border-radius:3px;background:var(--tekst)}.logo i:nth-child(3){background:var(--gull2)}
.tittel{display:flex;flex-direction:column;gap:1px}.tittel b{font-size:19px;letter-spacing:-.01em}.tittel span{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--gull)}
nav{display:flex;gap:6px;margin-left:24px;flex-wrap:wrap}nav button{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--kant);background:transparent;color:var(--demp);font:inherit;font-size:13.5px;cursor:pointer}
nav button.på{background:var(--tekst);color:#0b0b0c;border-color:var(--tekst);font-weight:600}
.meg{margin-left:auto;font-size:12.5px;color:var(--demp);text-align:right}.meg b{color:var(--tekst);display:block;font-weight:600}
main{padding:28px 32px 60px;max-width:1280px;margin:0 auto}
h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}.under{color:var(--demp);margin:0 0 24px}
.rutenett{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tall{background:var(--kort);border:1px solid var(--kant);border-radius:16px;padding:18px 20px}.tall span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--demp)}.tall b{display:block;font-size:34px;font-weight:300;margin-top:6px}.tall small{color:var(--demp)}
.verktoy{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
input,select{height:40px;border-radius:12px;border:1px solid var(--kant);background:#101011;color:var(--tekst);padding:0 14px;font:inherit;font-size:14px;outline:none}input:focus{border-color:var(--gull2)}
.tabell{background:var(--kort);border:1px solid var(--kant);border-radius:16px;overflow:hidden}
.rad{display:grid;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid #1d1d1f}.rad:first-child{border-top:none}
.rad.hode{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--demp);background:#111112}
.kontoer .rad{grid-template-columns:minmax(220px,1.4fr) 1.3fr 110px 130px 330px}
.hjem .rad{grid-template-columns:minmax(180px,1fr) minmax(220px,1.6fr) 120px 110px 300px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:#1c1c1e;border:1px solid var(--kant);font-size:12px;margin:2px 4px 2px 0;white-space:nowrap}
.chip.eier{border-color:#5a4420;color:var(--gull);background:#1c170d}.chip button{border:none;background:none;color:var(--demp);cursor:pointer;padding:0;font-size:14px}
.ava{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f3cf7f,#d9a441);color:#0b0b0c;font-weight:600;font-size:14px}
.vh{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:18px;background:var(--kort,#141415);border:1px solid var(--kant,#242426);max-width:760px}.vh.på{border-color:#5a4420;background:linear-gradient(135deg,#1c170d,#141415 70%)}
.vh label{display:flex;flex-direction:column;gap:6px}.vh input,.vh select{height:40px;border-radius:10px;border:1px solid var(--kant,#242426);background:#101011;color:inherit;padding:0 12px;font:inherit}
.vhbanner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:#1c170d;border:1px solid #5a4420;margin-bottom:18px}
.merke{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 8px;border-radius:6px;background:#1c1c1e;color:var(--demp)}.merke.rod{background:#2a1210;color:#ff9a8a}.merke.gull{background:#1c170d;color:var(--gull)}.merke.gronn{background:#10241a;color:var(--gronn)}
.knapper{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.k{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--kant);background:#1b1b1c;color:var(--tekst);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}.k:hover{border-color:#3a3a3c}.k.gull{background:var(--gull);color:#0b0b0c;border-color:var(--gull)}.k.rod{color:#ff9a8a;border-color:#3a2a20}
.sub{color:var(--demp);font-size:12px}
.tom{padding:40px;text-align:center;color:var(--demp)}
.melding{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1c1c1e;border:1px solid var(--kant);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}.melding.vis{opacity:1}
dialog{background:var(--kort);color:var(--tekst);border:1px solid var(--kant);border-radius:18px;padding:24px;max-width:440px;width:92vw}dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 8px}dialog p{color:var(--demp);margin:0 0 16px}dialog input{width:100%;margin-bottom:16px}.dknapper{display:flex;gap:8px;justify-content:flex-end}
.feil{padding:60px 20px;text-align:center}.feil h2{font-weight:600}
@media (max-width:900px){header{padding:16px;flex-wrap:wrap}nav{margin-left:0}main{padding:20px 16px}.kontoer .rad,.hjem .rad{grid-template-columns:1fr}.rad.hode{display:none}.knapper{justify-content:flex-start}}
.senter{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.senter>.kort{grid-column:span 6}.senter>.kort.bred{grid-column:span 12}.senter>.kort.tredel{grid-column:span 4}
.kort{background:var(--kort);border:1px solid var(--kant);border-radius:16px;padding:18px 20px;min-width:0}.kort h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:10px}.kort h3 .sub{margin-left:auto;font-weight:400}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px;grid-column:span 12}.kpi .tall b{font-size:30px}
.graf{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}.graf i{flex:1;background:linear-gradient(180deg,var(--gull),#8a6520);border-radius:3px 3px 0 0;min-height:2px;position:relative}.graf i:hover::after{content:attr(data-n);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;font-style:normal;background:#1c1c1e;padding:2px 6px;border-radius:5px;white-space:nowrap}
.akse{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--demp);margin-top:6px}
.strom{display:flex;flex-direction:column;max-height:430px;overflow:auto}.hend{display:grid;grid-template-columns:104px 150px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid #1d1d1f;font-size:13px}.hend:first-child{border-top:none}.hend .tid{font-family:var(--mono);font-size:11px;color:var(--demp)}.hend .hva{min-width:0;overflow:hidden;text-overflow:ellipsis}
.type{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:#1c1c1e;color:#c9c9c4;white-space:nowrap;justify-self:start}.type.gronn{background:#10241a;color:var(--gronn)}.type.rod{background:#2a1210;color:#ff9a8a}.type.gull{background:#1c170d;color:var(--gull)}.type.bla{background:#101a2a;color:#8ab4ff}
.lenke{border:none;background:none;color:var(--tekst);font:inherit;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:#3a3a3c;text-underline-offset:3px}.lenke:hover{text-decoration-color:var(--gull)}
.liste{display:flex;flex-direction:column}.liste .l{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #1d1d1f;font-size:13px;min-width:0}.liste .l:first-child{border-top:none}.liste .l>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prikk{width:8px;height:8px;border-radius:4px;display:inline-block;background:#3a3a37;flex-shrink:0}.prikk.on{background:var(--gronn);box-shadow:0 0 8px rgba(111,207,127,.6)}
.enheter .rad{grid-template-columns:minmax(200px,1.3fr) 90px 90px minmax(160px,1fr) 150px 120px 90px}
.logg .rad{grid-template-columns:120px 170px minmax(170px,1fr) minmax(200px,1.5fr) 150px;font-size:13px;padding:10px 18px}
.skuff{position:fixed;inset:0 0 0 auto;width:min(760px,100vw);background:#0f0f10;border-left:1px solid var(--kant);z-index:20;overflow:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 80px rgba(0,0,0,.5)}.skuff.apen{transform:none}
.skuffbak{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s}.skuffbak.apen{opacity:1;pointer-events:auto}
.skuff .topp{position:sticky;top:0;background:rgba(15,15,16,.94);backdrop-filter:blur(8px);padding:20px 24px;border-bottom:1px solid var(--kant);display:flex;gap:14px;align-items:center;z-index:2}.skuff .topp h2{margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis}.skuff .innhold{padding:20px 24px 60px;display:flex;flex-direction:column;gap:14px}
.ava.stor{width:56px;height:56px;font-size:22px}
.felt2{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:13px}.felt2>span:nth-child(odd){color:var(--demp)}
.som{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 32px;background:linear-gradient(90deg,#3a2a0c,#1c170d);border-bottom:1px solid #5a4420;font-size:13.5px}
.chipsrad{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:1000px){.senter>.kort,.senter>.kort.tredel{grid-column:span 12}.enheter .rad,.logg .rad{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"><i style="height:16px"></i><i style="height:24px"></i><i style="height:30px"></i><i style="height:24px"></i><i style="height:16px"></i></div>
  <div class="tittel"><span>SKJOLD LAB</span><b>Valhalla</b></div>
  <nav id="nav"></nav>
  <div class="meg" id="meg"></div>
</header>
<div id="somBanner"></div>
<main id="main"><div class="tom">Henter …</div></main>
<div class="skuffbak" id="skuffbak"></div><aside class="skuff" id="skuff" aria-label="Detaljer"></aside>
<div class="melding" id="melding"></div>
<dialog id="dlg"><h3 id="dTittel"></h3><p id="dTekst"></p><input id="dInn"><div class="dknapper"><button class="k" id="dAvbryt">Avbryt</button><button class="k gull" id="dOk">OK</button></div></dialog>
<script>
"use strict";
// Skjold Lab Valhalla – kontrollsenteret for skyen bak Skjold-hjem: kontoer, hjem, enheter, hendelseslogg og drift.
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dato = (t) => (t ? new Date(t * 1000).toLocaleString("nb-NO", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "–");
const kl = (t) => { const d = new Date(t * 1000), i = new Date(); return d.toDateString() === i.toDateString() ? d.toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : d.toLocaleString("nb-NO", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const siden = (t) => { if (!t) return "aldri"; const s = Date.now() / 1000 - t; return s < 120 ? "nå" : s < 3600 ? Math.round(s / 60) + " min siden" : s < 86400 ? Math.round(s / 3600) + " t siden" : Math.round(s / 86400) + " d siden"; };
const enc = encodeURIComponent;
const FANER = [["senter", "Kontrollsenter"], ["kontoer", "Kontoer"], ["hjem", "Hjem"], ["enheter", "Enheter"], ["logg", "Logg"], ["tjenesten", "Tjenesten"]];
let FORSTE = true, MEG = null, FANE = ({ oversikt: "senter" })[location.hash.slice(1)] || location.hash.slice(1) || "senter", DATA = {}, SOK = "", FILTER = { status: "", produkt: "" }, LOGGF = { q: "", type: "", epost: "" }, LIVE = true;
if (!FANER.some(([k]) => k === FANE)) FANE = "senter";
// hendelsestyper: [navn, farge]
const HT = {
  innlogging: ["Innlogging", "bla"], bekreftet: ["Bekreftet", "gronn"], bekreft_feil: ["Feil bekreftelse", "rod"], sperret_forsok: ["Sperret – forsøk", "rod"],
  profil: ["Profil endret", ""], kodeapp_pa: ["Kodeapp på", "gronn"], kodeapp_av: ["Kodeapp av", "rod"], nye_reservekoder: ["Nye reservekoder", ""],
  passkey_ny: ["Ny passkey", "gronn"], passkey_fjernet: ["Passkey fjernet", ""], godkjenning: ["Godkjenning", ""], utlogget: ["Logget ut", ""],
  logg_ut_overalt: ["Logget ut overalt", ""], konto_slettet: ["Konto slettet", "rod"], hjem_nytt: ["Nytt hjem", "gronn"], hjem_endret: ["Hjem endret", ""],
  hjem_slettet: ["Hjem slettet", "rod"], deling: ["Deling", ""], eier_overfort: ["Eier overført", "gull"], koblingskode: ["Koblingskode", ""],
  enhet_koblet: ["Enhet koblet", "gronn"], enhet_tilkoblet: ["Enhet på nett", "gronn"], enhet_frakoblet: ["Enhet av nett", ""], enhet_fjernet: ["Enhet fjernet", "rod"],
  vedlikehold: ["Vedlikehold", "gull"], som_start: ["Logget inn som", "gull"], som_handling: ["Handling som", "gull"], som_slutt: ["Avsluttet «som»", "gull"]
};
const typeNavn = (t) => (HT[t] || [t.startsWith("admin_") ? "Admin: " + t.slice(6).replace(/_/g, " ") : t])[0];
const typeFarge = (t) => (HT[t] || [0, t.startsWith("admin_") ? "gull" : ""])[1];
const typeMerke = (t) => `<span class="type ${typeFarge(t)}">${esc(typeNavn(t))}</span>`;
const ava = (k, stor = false) => k?.bilde && /^data:image\/(jpeg|png|webp);base64,/.test(k.bilde) ? `<img src="${k.bilde}" alt="" class="ava${stor ? " stor" : ""}">` : `<span class="ava${stor ? " stor" : ""}">${esc(((k?.profil?.navn || k?.epost || "?")[0] || "?").toUpperCase())}</span>`;
const kontoLenke = (e) => e ? `<button class="lenke" data-konto="${esc(e)}">${esc(e)}</button>` : "";
const stedLenke = (id, navn) => id ? `<button class="lenke" data-hjem="${esc(id)}">${esc(navn || id)}</button>` : "";
function hendelse(h, kort = false) {
  const hvor = [h.by, h.land].filter(Boolean).join(", ");
  const detaljer = [h.tekst ? esc(h.tekst) : "", h.sted ? "hjem " + stedLenke(h.sted, (DATA.stedNavn || {})[h.sted]) : "", h.enhet ? `enhet <span style="font-family:var(--mono)">${esc(h.enhet)}</span>` : "", h.av && h.av !== h.epost ? "av " + kontoLenke(h.av) : "", !kort && (hvor || h.ip) ? `<span class="sub">${esc(hvor)}${h.ip ? " · " + esc(h.ip) : ""}</span>` : ""].filter(Boolean).join(" · ");
  return `<div class="hend"><span class="tid" title="${esc(dato(h.t))}">${esc(kl(h.t))}</span>${typeMerke(h.type)}<span class="hva">${h.epost ? kontoLenke(h.epost) + " " : ""}${detaljer}</span></div>`;
}
function melding(t) { const m = $("#melding"); m.textContent = t; m.classList.add("vis"); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove("vis"), 3200); }
async function kall(metode, sti, kropp) {
  const r = await fetch("/api/valhalla" + sti, { method: metode, headers: kropp ? { "content-type": "application/json" } : {}, body: kropp ? JSON.stringify(kropp) : undefined, credentials: "include" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || j.feil || ("HTTP " + r.status));
  return j;
}
function spor({ tittel, tekst, verdi = "", plass = "", ok = "OK", farlig = false, krever = null }) {
  return new Promise((ferdig) => {
    const d = $("#dlg"), inn = $("#dInn");
    $("#dTittel").textContent = tittel; $("#dTekst").textContent = tekst;
    inn.style.display = plass || krever ? "" : "none"; inn.value = verdi; inn.placeholder = plass || krever || "";
    $("#dOk").textContent = ok; $("#dOk").className = "k " + (farlig ? "rod" : "gull");
    const lukk = (v) => { d.close(); ferdig(v); };
    $("#dAvbryt").onclick = () => lukk(null);
    $("#dOk").onclick = () => { if (krever && inn.value.trim() !== krever) { inn.focus(); return; } lukk(plass || krever ? inn.value.trim() : true); };
    d.showModal(); if (plass || krever) inn.focus();
  });
}
function tegnNav() { $("#nav").innerHTML = FANER.map(([k, n]) => `<button class="${k === FANE ? "på" : ""}" data-f="${k}">${n}</button>`).join(""); }
document.addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (!b) return; FANE = b.dataset.f; SOK = ""; location.hash = FANE; vis(); });
const sokFelt = (plass, bredde = 280) => `<input id="sok" placeholder="${plass}" value="${esc(SOK)}" style="width:${bredde}px">`;
function kobleSok() { const s = $("#sok"); if (s) s.oninput = (e) => { SOK = e.target.value; const p = e.target.selectionStart; vis(true).then(() => { const n = $("#sok"); n.focus(); n.setSelectionRange(p, p); }); }; }
function csv(rader, navn) {
  const tekst = rader.map((r) => r.map((x) => '"' + String(x ?? "").replace(/"/g, '""') + '"').join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + tekst], { type: "text/csv" })); a.download = navn; a.click();
}
async function hent(lokal) {
  if (lokal) return;
  const t = [];
  if (FANE === "senter" || FANE === "tjenesten" || !DATA.o) t.push(kall("GET", "/oversikt" + (FORSTE ? "?synk=1" : "")).then((x) => { DATA.o = x; FORSTE = false; }));
  if (FANE === "senter") t.push(kall("GET", "/statistikk").then((x) => { DATA.stat = x; }), kall("GET", "/logg?limit=40").then((x) => { DATA.strom = x.hendelser; }));
  if (FANE === "senter" || FANE === "enheter") t.push(kall("GET", "/enheter").then((x) => { DATA.e = x; }));
  if (FANE === "kontoer") t.push(kall("GET", "/kontoer").then((x) => { DATA.k = x; }));
  if (FANE === "hjem" || !DATA.s) t.push(kall("GET", "/steder").then((x) => { DATA.s = x; DATA.stedNavn = Object.fromEntries(x.map((s) => [s.id, s.navn])); }));
  if (FANE === "logg") t.push(lastLogg(false));
  await Promise.all(t);
}
async function lastLogg(mer) {
  const q = new URLSearchParams({ limit: "150" });
  for (const [k, v] of Object.entries(LOGGF)) if (v) q.set(k, v);
  if (mer && DATA.loggNeste) q.set("for", DATA.loggNeste);
  const r = await kall("GET", "/logg?" + q);
  DATA.logg = mer ? [...(DATA.logg || []), ...r.hendelser] : r.hendelser; DATA.loggNeste = r.neste;
}
let LIVET = 0;
async function vis(lokal = false) {
  tegnNav(); clearInterval(window._vhT); clearTimeout(LIVET);
  const m = $("#main");
  try { await hent(lokal); } catch (e) { m.innerHTML = `<div class="feil"><h2>${esc(e.message)}</h2><p class="sub">Valhalla er bare for tjenesteeieren og administratorer av Skjold Lab.</p></div>`; return; }
  const o = DATA.o;
  if (FANE === "senter") {
    const st = DATA.stat || { perTime: [], perType: {} }, en = DATA.e || [], on = en.filter((x) => x.online).length;
    const maks = Math.max(1, ...st.perTime);
    const versjoner = {}; for (const x of en) versjoner[x.versjon || "ukjent"] = (versjoner[x.versjon || "ukjent"] || 0) + 1;
    const produkter = {}; for (const x of en) produkter[x.produkt || "ukjent"] = (produkter[x.produkt || "ukjent"] || 0) + 1;
    const typer = Object.entries(st.perType).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const borte = en.filter((x) => !x.online).sort((a, b) => (b.sist || 0) - (a.sist || 0)).slice(0, 8);
    const feil = (st.perType.bekreft_feil || 0) + (st.perType.sperret_forsok || 0);
    m.innerHTML = `<h1>Kontrollsenter</h1><p class="under">Hele Skjold-skyen i sanntid – kontoer, hjem, enheter og alt som skjer.</p>
      <div class="senter">

      ${t.aktiv ? `<button class="k" data-tofa="${esc(k.epost)}">Tilbakestill totrinn</button>` : ""}
      ${sjef ? "" : `<button class="k ${k.sperret ? "" : "rod"}" data-sperr="${esc(k.epost)}" data-v="${k.sperret ? 0 : 1}">${k.sperret ? "Opphev sperring" : "Sperr"}</button>`}
      ${MEG.eier && !sjef ? `<button class="k" data-admin="${esc(k.epost)}" data-v="${k.admin ? 0 : 1}">${k.admin ? "Fjern admin" : "Gjør til admin"}</button>` : ""}
      ${sjef ? "" : `<button class="k rod" data-slettkonto="${esc(k.epost)}">Slett konto</button>`}
    </div>
    <div class="kort"><h3>Konto</h3><div class="felt2">
      <span>E-post</span><span>${esc(k.epost)}</span><span>Navn</span><span>${esc(p.navn || "–")}</span>
      <span>Konto opprettet</span><span>${dato(p.opprettet || k.forst)}</span><span>Først sett</span><span>${dato(k.forst)}</span><span>Sist sett</span><span>${dato(k.sist)} (${siden(k.sist)})</span>
      <span>Kodeapp</span><span>${t.kodeapp ? "På · " + (t.reservekoderIgjen ?? 0) + " reservekoder igjen" : "Av"}</span>
      <span>Passkeys</span><span>${(t.passkeys || []).map((n) => esc(n.navn) + ` <span class="sub">(${n.type === "nokkel" ? "sikkerhetsnøkkel" : "passkey"}, ${n.sist ? "brukt " + siden(n.sist) : "ikke brukt"})</span>`).join("<br>") || "Ingen"}</span>
      <span>Skjold Cloud</span><span>${(k.sync || []).map((x) => esc(x.del) + ` <span class="sub">${Math.round(x.storrelse / 102.4) / 10} kB · ${siden(x.endret)}</span>`).join("<br>") || "Ingenting lagret"}</span>
    </div></div>
    <div class="kort"><h3>Påloggede enheter<span class="sub">${okter.length}</span></h3><div class="liste">${okter.map((o) => `<div class="l"><span><b>${esc(o.navn)}</b> <span class="sub">${esc(o.sted || "")} · opprettet ${dato(o.opprettet)} · sist ${siden(o.sist)} · ${o.bekreftet ? "bekreftet" + (o.metode ? " med " + esc(o.metode) : "") : "ikke bekreftet"}</span></span><button class="k" data-slettokt="${esc(o.sid)}" data-e="${esc(k.epost)}">Logg ut</button></div>`).join("") || '<span class="sub">Ingen påloggede enheter.</span>'}</div></div>
    <div class="kort"><h3>Hjem<span class="sub">${(k.steder || []).length}</span></h3><div class="liste">${(k.steder || []).map((s) => { const en = s.enheter || []; return `<div class="l"><span>${s.eier === k.epost ? "★ " : ""}${stedLenke(s.id, s.navn)} <span class="sub">${s.eier === k.epost ? "eier" : "medlem"} · ${en.filter((e) => e.online).length}/${en.length} enheter på nett · ${(s.medlemmer || []).length} medlemmer</span></span></div>`
      + en.map((e) => `<div class="l" style="padding-left:18px"><span><span class="prikk ${e.online ? "on" : ""}"></span> ${esc(e.navn)} <span class="sub">${esc(e.produkt || "")} · ${esc(e.versjon || "–")} · ${e.online ? "på nett" + (e.lan?.ip ? " · " + esc(e.lan.ip) : "") : "sist " + siden(e.sist)}</span></span></div>`).join(""); }).join("") || '<span class="sub">Ingen hjem.</span>'}</div></div>
    <div class="kort"><h3>Logg<span class="sub">${(k.hendelser || []).length} siste</span></h3><div class="strom" style="max-height:none">${(k.hendelser || []).map((h) => hendelse(h)).join("") || '<span class="sub">Ingen hendelser.</span>'}</div></div>
  </div>`;
}
function hjemSkuff(s) {
  const en = s.enheter || [];
  return `<div class="topp"><span class="ava stor" style="border-radius:14px">${esc((s.navn || "?")[0].toUpperCase())}</span><div style="min-width:0;flex:1"><h2>${esc(s.navn)}</h2><span class="sub" style="font-family:var(--mono)">${esc(s.id)}</span></div><button class="k" data-lukk>Lukk ✕</button></div>
  <div class="innhold">
    <div class="knapper" style="justify-content:flex-start"><button class="k" data-hjemnavn="${s.id}" data-v="${esc(s.navn)}">Endre navn</button><button class="k" data-legg="${s.id}">+ Medlem</button><button class="k" data-eier="${s.id}">Overfør eierskap</button><button class="k rod" data-slett="${s.id}" data-n="${esc(s.navn)}">Slett hjemmet</button></div>
    <div class="kort"><h3>Hjemmet</h3><div class="felt2"><span>Eier</span><span>${kontoLenke(s.eier)}</span><span>Medlemmer</span><span>${(s.medlemmer || []).map((e) => e === s.eier ? kontoLenke(e) + " ★" : kontoLenke(e) + ` <button class="lenke sub" data-fjern="${esc(e)}" data-s="${s.id}">fjern</button>`).join("<br>")}</span>
      <span>Opprettet</span><span>${dato(s.opprettet)}</span><span>Automatisk innmelding</span><span>${s.autoLegg ? "På" : "Av"}</span><span>Enheter</span><span>${en.filter((e) => e.online).length} av ${en.length} på nett</span></div></div>
    <div class="kort"><h3>Enheter</h3><div class="liste">${en.map((e) => `<div class="l" style="align-items:flex-start"><span style="white-space:normal"><span class="prikk ${e.online ? "on" : ""}"></span> <b>${esc(e.navn)}</b> ${e.aktivHoved ? '<span class="merke gull">AKTIV HOVED</span>' : e.hoved ? '<span class="merke">HOVED</span>' : e.reserveNr ? `<span class="merke">RESERVE ${e.reserveNr}</span>` : ""}<br>
      <span class="sub" style="font-family:var(--mono)">${esc(e.id)}</span><br><span class="sub">${esc(e.produkt || "–")} · versjon ${esc(e.versjon || "–")}${e.rom ? " · rom " + esc(e.rom) : ""} · ${e.online ? "på nett" : "sist sett " + siden(e.sist)}${e.lan?.ip ? " · LAN " + esc(e.lan.ip) + ":" + esc(e.lan.port || "") : ""} · koblet til ${dato(e.lagtTil)}</span></span>
      <button class="k rod" data-fjernenhet="${esc(e.id)}" data-s="${s.id}" data-n="${esc(e.navn)}">Fjern</button></div>`).join("") || '<span class="sub">Ingen enheter koblet til.</span>'}</div></div>
    <div class="kort"><h3>Logg<span class="sub">${(s.hendelser || []).length} siste</span></h3><div class="strom" style="max-height:none">${(s.hendelser || []).map((h) => hendelse(h)).join("") || '<span class="sub">Ingen hendelser.</span>'}</div></div>
  </div>`;
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || b.dataset.f) return;
  const d = b.dataset;
  try {
    if ("lukk" in d) { lukkSkuff(); return; }
    if (d.konto) { await apneSkuff("konto", d.konto); return; }
    if (d.hjem) { await apneSkuff("hjem", d.hjem); return; }
    if (d.som) {
      if (!(await spor({ tittel: "Logge inn som " + d.som + "?", tekst: "I én time ser Skjold-hjem, appen i denne nettleseren og konto-siden kontoen deres – hjem, enheter og innstillinger. Sikkerhet (totrinn, passkeys, utlogging, sletting) kan ikke endres. Brukeren ser i aktivitetsloggen sin at Skjold Lab har vært innlogget.", ok: "Logg inn som" }))) return;
      await kall("POST", "/som", { epost: d.som }); location.href = "/";
      return;
    }
    if (d.somslutt !== undefined) { await kall("DELETE", "/som"); location.reload(); return; }
    else if (d.sperr) { const v = d.v === "1"; if (v && !(await spor({ tittel: "Sperr " + d.sperr + "?", tekst: "Kontoen kommer ikke inn på Skjold-hjem før sperringen oppheves. Hjemmene og enhetene beholdes.", ok: "Sperr", farlig: true }))) return; await kall("POST", "/kontoer/" + enc(d.sperr), { sperret: v }); melding(v ? "Kontoen er sperret" : "Sperringen er opphevet"); }
    else if (d.tofa) { if (!(await spor({ tittel: "Tilbakestill totrinnsbekreftelse for " + d.tofa + "?", tekst: "Kodeappen, reservekodene og alle passkeys fjernes. Bruk dette bare når du har bekreftet hvem personen er.", ok: "Tilbakestill", farlig: true }))) return; await kall("POST", "/kontoer/" + enc(d.tofa), { tofaAv: true }); melding("Totrinnsbekreftelsen er slått av"); }
    else if (d.admin) { const v = d.v === "1"; await kall("POST", "/kontoer/" + enc(d.admin), { admin: v }); melding(v ? "Har nå tilgang til Valhalla" : "Valhalla-tilgangen er fjernet"); }
    else if (d.loggut) { if (!(await spor({ tittel: "Logge ut alle enhetene til " + d.loggut + "?", tekst: "Alle nettlesere og telefoner må logge inn igjen.", ok: "Logg ut alle", farlig: true }))) return; await kall("POST", "/kontoer/" + enc(d.loggut), { loggUt: true }); melding("Alle enhetene er logget ut"); }
    else if (d.slettokt) { await kall("POST", "/kontoer/" + enc(d.e), { slettOkt: d.slettokt }); melding("Enheten er logget ut"); }
    else if (d.navn) { const n = await spor({ tittel: "Navn på " + d.navn, tekst: "Vises for dem kontoen deler hjem med.", verdi: d.v, plass: "Navn", ok: "Lagre" }); if (n === null) return; await kall("POST", "/kontoer/" + enc(d.navn), { navn: n }); melding("Navnet er endret"); }
    else if (d.slettkonto) { if (!(await spor({ tittel: "Slett kontoen " + d.slettkonto + "?", tekst: "Kontoen fjernes fra hjemmene den er medlem av, Skjold Cloud-dataene slettes og alle økter logges ut. Eier kontoen et hjem, må det overføres eller slettes først. Skriv e-postadressen for å bekrefte.", krever: d.slettkonto, ok: "Slett for godt", farlig: true }))) return; await kall("POST", "/kontoer/" + enc(d.slettkonto), { slett: true }); melding("Kontoen er slettet"); lukkSkuff(); }
    else if (d.hjemnavn) { const n = await spor({ tittel: "Nytt navn på hjemmet", tekst: "Endres for alle medlemmene med en gang.", verdi: d.v, plass: "Navn", ok: "Lagre" }); if (!n) return; await kall("POST", "/steder/" + d.hjemnavn, { navn: n }); melding("Hjemmet har fått nytt navn"); }
    else if (d.fjernenhet) { if (!(await spor({ tittel: "Fjern «" + d.n + "»?", tekst: "Enheten kobles fra hjemmet og må kobles til på nytt med en kode. Den meldes ikke inn automatisk igjen.", ok: "Fjern", farlig: true }))) return; await kall("DELETE", "/steder/" + d.s + "/enheter/" + enc(d.fjernenhet)); melding("Enheten er fjernet"); }
    else if (d.vh) {
      const o = DATA.o.vedlikehold || {}, naa = Math.floor(Date.now() / 1000);
      if (d.vh === "0") { await kall("POST", "/vedlikehold", { aktiv: false }); melding("Tjenesten er tilbake i drift"); }
      else if (d.vh === "forleng") { await kall("POST", "/vedlikehold", { ...o, aktiv: true, til: Math.max(o.til || naa, naa) + 900 }); melding("Forlenget med 15 minutter"); }
      else {
        const v = $("#vhVarighet").value;
        const til = v === "egen" ? Math.floor(new Date($("#vhKl").value).getTime() / 1000) || 0 : Number(v) ? naa + Number(v) * 60 : 0;
        if (!o.aktiv && !(await spor({ tittel: "Starte vedlikehold?", tekst: "Alle unntatt eiere og admins mister fjernstyring, deling og Skjold Cloud til du avslutter. De får beskjed om at Skjold fortsatt virker lokalt.", ok: "Start vedlikehold", farlig: true }))) return;
        await kall("POST", "/vedlikehold", { aktiv: true, melding: $("#vhMelding").value.trim(), til });
        melding(o.aktiv ? "Vedlikeholdet er oppdatert" : "Vedlikehold startet");
      }
    }
    else if (d.admin) { const v = d.v === "1"; await kall("POST", "/kontoer/" + encodeURIComponent(d.admin), { admin: v }); melding(v ? "Har nå tilgang til Valhalla" : "Valhalla-tilgangen er fjernet"); }
    else if (d.legg) { const ep = await spor({ tittel: "Legg til medlem", tekst: "Personen ser hjemmet neste gang hen logger inn med denne e-postadressen.", plass: "navn@eksempel.no", ok: "Legg til" }); if (!ep) return; await kall("POST", "/steder/" + d.legg, { leggTil: ep }); melding("Medlemmet er lagt til"); }
    else if (d.fjern) { if (!(await spor({ tittel: "Fjern " + d.fjern + "?", tekst: "Personen mister tilgangen til hjemmet.", ok: "Fjern", farlig: true }))) return; await kall("POST", "/steder/" + d.s, { fjern: d.fjern }); melding("Medlemmet er fjernet"); }
    else if (d.eier) { const ep = await spor({ tittel: "Overfør eierskap", tekst: "Ny eier (legges til som medlem hvis hen ikke er det). Den gamle eieren blir medlem.", plass: "ny.eier@eksempel.no", ok: "Overfør" }); if (!ep) return; await kall("POST", "/steder/" + d.eier, { eier: ep }); melding("Eierskapet er overført"); }
    else if (d.slett) { if (!(await spor({ tittel: "Slett «" + d.n + "»?", tekst: "Hjemmet og koblingene til enhetene slettes for alle medlemmene. Skriv navnet for å bekrefte.", krever: d.n, ok: "Slett for godt", farlig: true }))) return; await kall("DELETE", "/steder/" + d.slett); melding("Hjemmet er slettet"); }
    else return;
    if (d.slett && SKUFF?.type === "hjem") lukkSkuff();
    DATA.k = null; await vis();
    if (SKUFF) await apneSkuff(SKUFF.type, SKUFF.id);
  } catch (err) { melding(err.message); }
});

(async () => {
  try {
    const r = await fetch("/api/hjem/meg", { credentials: "include" });
    MEG = await r.json();
    if (!r.ok) throw new Error(MEG.error || "ikke innlogget");
    const megSelv = MEG.som ? MEG.som.admin : MEG.epost;
    $("#meg").innerHTML = `<b>${esc(megSelv)}</b>${MEG.eier ? "Tjenesteeier" : MEG.valhalla ? "Administrator" : "Ingen tilgang"}`;
    if (MEG.som) $("#somBanner").innerHTML = `<div class="som"><b>Du er logget inn som ${esc(MEG.epost)}</b><span class="sub" style="color:#d9c9a4">Skjold-hjem og konto-siden i denne nettleseren viser kontoen deres til kl. ${new Date(MEG.som.utloper * 1000).toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" })}.</span><a class="k" href="/" style="display:inline-flex;align-items:center;text-decoration:none">Åpne Skjold-hjem</a><a class="k" href="/konto" style="display:inline-flex;align-items:center;text-decoration:none">Konto-siden</a><button class="k gull" data-somslutt>Avslutt</button></div>`;
    if (MEG.tofa && !MEG.tofaOk) { $("#main").innerHTML = '<div class="feil"><h2>Bekreft at det er deg</h2><p class="sub">Totrinnsbekreftelse er på for kontoen din. Bekreft denne nettleseren med passkey, kode eller fra en annen enhet.</p><p><a href="/konto?fra=/valhalla/">Bekreft på konto-siden</a></p></div>'; tegnNav(); return; }
    if (!MEG.valhalla) { $("#main").innerHTML = '<div class="feil"><h2>Ingen tilgang til Valhalla</h2><p class="sub">Valhalla er bare for tjenesteeieren og administratorer av Skjold Lab.</p><p><a href="/">Til Skjold-hjem</a></p></div>'; tegnNav(); return; }
    MEG.eier = !!MEG.eier;
    await vis();
    const m = /^#(konto|hjem)=(.+)$/.exec(location.hash); if (m) apneSkuff(m[1], decodeURIComponent(m[2]));
  } catch (e) { $("#main").innerHTML = `<div class="feil"><h2>Logg inn på Skjold-hjem først</h2><p class="sub">${esc(e.message)}</p><p><a href="/">Logg inn</a></p></div>`; }
})();
</script>
</body>
</html>
