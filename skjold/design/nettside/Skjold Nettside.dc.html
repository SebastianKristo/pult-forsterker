<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Skjold – lyd laget i Norge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Skjold S1 og Skjold Node: streamingforsterker og nettverksspiller med AirPlay, Blåtann og Lyrion-radio. Åpen kildekode.">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="site/skjold_site_data.js"></script>
<script src="site/skjold_site_fx.js"></script>
<style>html{scroll-behavior:smooth}body{margin:0;background:#000;color:#f5f5f2;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:hover{opacity:.8}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh">
  <dc-import name="Skjold Nav" active="" hint-size="100%,52px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <section data-screen-label="Home hero" style="padding:120px 22px 90px;text-align:center;background:#000">
    <div data-reveal="0" style="display:flex;gap:6px;align-items:flex-start;justify-content:center;height:54px">
      <div style="width:10px;height:28px;border-radius:5px;background:#f5f5f2"></div><div style="width:10px;height:42px;border-radius:5px;background:#f5f5f2"></div><div style="width:10px;height:54px;border-radius:5px;background:#f5f5f2"></div><div style="width:10px;height:42px;border-radius:5px;background:#f5f5f2"></div><div style="width:10px;height:28px;border-radius:5px;background:#f5f5f2"></div>
    </div>
    <h1 data-reveal="100" style="margin:30px auto 0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(46px,9vw,104px);line-height:1;letter-spacing:-.03em;max-width:980px;text-wrap:balance">{{ t.homeH }}</h1>
    <p data-reveal="200" style="margin:20px auto 0;max-width:560px;font-size:clamp(18px,2.2vw,23px);line-height:1.45;color:#a8a8a3">{{ t.homeP }}</p>
  </section>
  <section style="padding:0 12px 12px;background:#000;display:flex;flex-direction:column;gap:12px">
    <sc-for list="{{ products }}" as="p" hint-placeholder-count="2">
      <a href="{{ p.href }}" data-reveal="0" style="display:block;background:{{ p.bg }};color:#1d1d1b;border-radius:28px;padding:70px 22px 0;text-align:center;overflow:hidden">
        <div style="font-family:Sora,sans-serif;font-size:19px;font-weight:600;color:#8a7f60">{{ p.k }}</div>
        <div style="margin-top:8px;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(38px,6vw,68px);line-height:1.03;letter-spacing:-.02em;text-wrap:balance">{{ p.h }}</div>
        <div style="margin:14px auto 0;max-width:560px;font-size:17px;line-height:1.45;color:#55534c;text-wrap:pretty">{{ p.p }}</div>
        <div style="margin-top:18px;font-size:16px;color:#1d1d1b">{{ t.more }} ›</div>
        <img data-zoom="1" src="{{ p.img }}" alt="{{ p.k }}" style="display:block;width:min(1000px,110%);margin:10px auto 0;transform-origin:50% 40%">
      </a>
    </sc-for>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
        <a href="{{ c.href }}" data-reveal="{{ c.d }}" style="background:#111113;border-radius:28px;padding:44px 34px;display:flex;flex-direction:column;gap:12px;min-height:280px">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#d8cfb4">{{ c.k }}</div>
          <div style="font-family:Sora,sans-serif;font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.01em;text-wrap:balance">{{ c.h }}</div>
          <div style="font-size:16px;line-height:1.5;color:#a8a8a3;flex:1;text-wrap:pretty">{{ c.p }}</div>
          <div style="font-size:15px">{{ t.more }} ›</div>
        </a>
      </sc-for>
    </div>
  </section>
  <dc-import name="Skjold Interesse" product="Begge" hint-size="100%,760px"></dc-import>
  <footer style="padding:40px 22px 60px;background:#000;border-top:1px solid #1c1c1e">
    <div style="max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:#8b8b86"><div>{{ t.footer }}</div><div style="font-family:'IBM Plex Mono',monospace">skjold.smarthjemexperten.no</div></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CARDS=[['Programvare',{no:'PROGRAMVARE',en:'SOFTWARE'},{no:'Programvaren følger med.',en:'The software comes with it.'},{no:'Appen, webgrensesnittet, Skjold OS og Flasher.',en:'App, web interface, Skjold OS and Flasher.'}],
 ['Programvare#integrasjoner',{no:'INTEGRASJONER',en:'INTEGRATIONS'},{no:'Fungerer med det du har.',en:'Works with what you have.'},{no:'Lyrion, Home Assistant, Homey og Spotify Connect.',en:'Lyrion, Home Assistant, Homey and Spotify Connect.'}],
 ['Sammenlign',{no:'SAMMENLIGN',en:'COMPARE'},{no:'Hvilken Skjold?',en:'Which Skjold?'},{no:'S1 og Node side om side, med alle spesifikasjonene.',en:'S1 and Node side by side, with every specification.'}],
 ['Stotte',{no:'STØTTE',en:'SUPPORT'},{no:'Bygg den selv.',en:'Build it yourself.'},{no:'Bruksanvisninger, produksjonsfiler og SD-bilde. Alt er åpen kildekode.',en:'Manuals, production files and SD image. All open source.'}],
 ['Om',{no:'OM SKJOLD',en:'ABOUT'},{no:'Historien bak.',en:'The story behind it.'},{no:'Fra pultforsterker til to produkter, og baktanken.',en:'From desk amplifier to two products, and the idea.'}]];
class Component extends DCLogic {
  state={l:'no'};
  componentDidMount(){ const go=()=>{ if(!window.SKJOLD_SITE||!window.SKJOLD_FX){ this.to=setTimeout(go,50); return; } this.setState({l:window.SKJOLD_SITE.lang()}); window.SKJOLD_FX.init(); }; go(); this.onL=()=>this.setState({l:window.SKJOLD_SITE.lang()}); window.addEventListener('skjold-lang',this.onL); }
  componentWillUnmount(){ clearTimeout(this.to); window.removeEventListener('skjold-lang',this.onL); }
  renderVals(){ const S=window.SKJOLD_SITE; if(!S) return {}; const l=this.state.l, t=S.ui[l], s1=S.tr(S.s1.hero,l), nd=S.tr(S.node.hero,l);
    return { t,
      products:[{...s1,href:S.P('S1'),bg:'#e9e9ec'},{...nd,href:S.P('Node'),bg:'#ecebe7'}],
      cards:CARDS.map(([f,k,h,p],i)=>({href:f.includes('#')?S.P(f.split('#')[0])+'#'+f.split('#')[1]:S.P(f),k:k[l],h:h[l],p:p[l],d:String((i%2)*100)})) }; }
}
</script>
</body>
</html>
