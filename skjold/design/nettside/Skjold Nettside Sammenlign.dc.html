<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Skjold – Sammenlign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="site/skjold_site_data.js"></script>
<script src="site/skjold_site_fx.js"></script>
<style>html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#1d1d1b;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:hover{opacity:.8}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh;background:#fff;color:#1d1d1b">
  <dc-import name="Skjold Nav" active="Sammenlign" hint-size="100%,52px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <section style="padding:100px 22px 40px;text-align:center">
    <h1 data-reveal="0" style="margin:0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(44px,7vw,80px);letter-spacing:-.025em">{{ t.cmpH }}</h1>
  </section>
  <section style="padding:0 22px">
    <div style="max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
      <sc-for list="{{ prods }}" as="p" hint-placeholder-count="2">
        <a href="{{ p.href }}" data-reveal="{{ p.d }}" style="background:{{ p.bg }};border-radius:24px;padding:28px 18px 18px;text-align:center;display:flex;flex-direction:column;gap:6px">
          <img src="{{ p.img }}" alt="{{ p.h }}" style="width:100%;aspect-ratio:16/10;object-fit:contain">
          <div style="font-family:Sora,sans-serif;font-size:26px;font-weight:600">{{ p.h }}</div>
          <div style="font-size:15px;color:#6b6a64">{{ t.more }} ›</div>
        </a>
      </sc-for>
    </div>
  </section>
  <section style="padding:60px 22px 110px">
    <div style="max-width:1080px;margin:0 auto;overflow-x:auto">
      <div style="min-width:620px;display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,1.6fr) minmax(0,1.6fr)">
        <sc-for list="{{ cmp }}" as="r" hint-placeholder-count="10">
          <div data-reveal="0" style="padding:16px 0;border-top:1px solid #e3e0d7;font-size:14px;color:#7a776d">{{ r.k }}</div>
          <div data-reveal="0" style="padding:16px;border-top:1px solid #e3e0d7;font-size:16px;line-height:1.45">{{ r.a }}</div>
          <div data-reveal="0" style="padding:16px;border-top:1px solid #e3e0d7;font-size:16px;line-height:1.45">{{ r.b }}</div>
        </sc-for>
      </div>
    </div>
  </section>
  <section style="padding:110px 22px;background:#f5f4f0">
    <div style="max-width:1080px;margin:0 auto">
      <h2 data-reveal="0" style="margin:0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(34px,5vw,56px);letter-spacing:-.02em">{{ t.specH }}</h2>
      <div style="margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:48px">
        <sc-for list="{{ specs }}" as="sp" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column">
            <div style="font-family:Sora,sans-serif;font-size:24px;font-weight:600;padding-bottom:14px;border-bottom:2px solid #1d1d1b">{{ sp.h }}</div>
            <sc-for list="{{ sp.rows }}" as="r" hint-placeholder-count="8">
              <div style="display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;padding:13px 0;border-bottom:1px solid #e3e0d7">
                <div style="font-size:13px;color:#7a776d;padding-top:2px">{{ r.k }}</div>
                <div style="font-size:15px;line-height:1.5">{{ r.v }}</div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </section>
  <footer style="padding:40px 22px 60px;background:#000;border-top:1px solid #1c1c1e">
    <div style="max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:#8b8b86"><div>{{ t.footer }}</div><div style="font-family:'IBM Plex Mono',monospace">skjold.smarthjemexperten.no</div></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={l:'no'};
  componentDidMount(){ const go=()=>{ if(!window.SKJOLD_SITE||!window.SKJOLD_FX){ this.to=setTimeout(go,50); return; } this.setState({l:window.SKJOLD_SITE.lang()}); window.SKJOLD_FX.init(); }; go(); this.onL=()=>this.setState({l:window.SKJOLD_SITE.lang()}); window.addEventListener('skjold-lang',this.onL); }
  componentWillUnmount(){ clearTimeout(this.to); window.removeEventListener('skjold-lang',this.onL); }
  renderVals(){ const S=window.SKJOLD_SITE; if(!S) return {}; const l=this.state.l;
    return { t:S.ui[l],
      prods:[{h:'Skjold S1',img:'renders/01-s1.png',bg:'#e9e9ec',href:S.P('S1'),d:'0'},{h:'Skjold Node',img:'renders/01-node.png',bg:'#ecebe7',href:S.P('Node'),d:'100'}],
      cmp:S.tr(S.cmp,l).map(([k,a,b])=>({k,a,b})),
      specs:S.tr(S.specs,l).map(s=>({h:s.h,rows:s.rows.map(([k,v])=>({k,v}))})) }; }
}
</script>
</body>
</html>
