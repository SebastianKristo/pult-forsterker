<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Skjold – Støtte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="site/skjold_site_data.js"></script>
<script src="site/skjold_site_fx.js"></script>
<style>html{scroll-behavior:smooth}body{margin:0;background:#000;color:#f5f5f2;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:hover{opacity:.8}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh">
  <dc-import name="Skjold Nav" active="Stotte" hint-size="100%,52px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <section style="padding:100px 22px 110px">
    <div style="max-width:1080px;margin:0 auto">
      <h1 data-reveal="0" style="margin:0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(44px,7vw,80px);letter-spacing:-.025em">{{ t.manH }}</h1>
      <div style="margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px">
        <sc-for list="{{ manuals }}" as="m" hint-placeholder-count="4">
          <a href="{{ m.href }}" data-reveal="{{ m.d }}" style="background:#111113;border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:8px;min-height:160px">
            <div style="font-family:Sora,sans-serif;font-size:20px;font-weight:600">{{ m.h }}</div>
            <div style="font-size:14.5px;line-height:1.5;color:#a8a8a3;flex:1">{{ m.p }}</div>
            <div style="font-size:14px;color:#d8cfb4">{{ t.read }} ›</div>
          </a>
        </sc-for>
      </div>
    </div>
  </section>
  <section style="padding:110px 22px;background:#0b0b0c">
    <div style="max-width:1080px;margin:0 auto">
      <div data-reveal="0" style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;color:#8b8b86">{{ t.buildK }}</div>
      <h2 data-reveal="60" style="margin:12px 0 0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.02em;max-width:760px;text-wrap:balance">{{ t.buildH }}</h2>
      <div style="margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px">
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
          <div data-reveal="{{ s.d }}" style="border:1px solid #26262a;border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;gap:10px">
            <div style="font-family:Sora,sans-serif;font-size:40px;font-weight:300;color:#d8cfb4;line-height:1">{{ s.n }}</div>
            <div style="font-family:Sora,sans-serif;font-size:19px;font-weight:600">{{ s.h }}</div>
            <div style="font-size:14.5px;line-height:1.5;color:#a8a8a3;text-wrap:pretty">{{ s.p }}</div>
          </div>
        </sc-for>
      </div>
      <div style="margin-top:28px"><a href="{{ repoHref }}" style="display:inline-block;padding:11px 22px;border-radius:99px;background:#f5f5f2;color:#000;font-size:15px;font-weight:500;white-space:nowrap">{{ t.github }}</a></div>
    </div>
  </section>
  <section style="padding:110px 22px;background:#fff;color:#1d1d1b">
    <div style="max-width:1080px;margin:0 auto">
      <h2 data-reveal="0" style="margin:0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(34px,5vw,56px);letter-spacing:-.02em">{{ t.dlH }}</h2>
      <div style="margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:0 40px">
        <sc-for list="{{ downloads }}" as="d" hint-placeholder-count="10">
          <a href="{{ d.f }}" style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #e3e0d7">
            <div style="display:flex;flex-direction:column;gap:3px;min-width:0"><div style="font-size:15.5px;font-weight:500">{{ d.h }}</div><div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7a776d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ d.f }}</div></div>
            <div style="font-size:18px;color:#8a7f60;flex:none">↓</div>
          </a>
        </sc-for>
      </div>
    </div>
  </section>
  <footer style="padding:40px 22px 60px;background:#000;border-top:1px solid #1c1c1e">
    <div style="max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:#8b8b86"><div>{{ t.footer }}</div><div style="font-family:'IBM Plex Mono',monospace">skjold.smarthjemexperten.no</div></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;repoUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state={l:'no'};
  componentDidMount(){ const go=()=>{ if(!window.SKJOLD_SITE||!window.SKJOLD_FX){ this.to=setTimeout(go,50); return; } this.setState({l:window.SKJOLD_SITE.lang()}); window.SKJOLD_FX.init(); }; go(); this.onL=()=>this.setState({l:window.SKJOLD_SITE.lang()}); window.addEventListener('skjold-lang',this.onL); }
  componentWillUnmount(){ clearTimeout(this.to); window.removeEventListener('skjold-lang',this.onL); }
  renderVals(){ const S=window.SKJOLD_SITE; if(!S) return {}; const l=this.state.l;
    return { t:S.ui[l], manuals:S.tr(S.manuals,l).map((m,i)=>({...m,d:String(i*80)})),
      steps:S.tr(S.steps,l).map(([h,p],i)=>({n:String(i+1),h,p,d:String(i*80)})),
      downloads:S.tr(S.downloads,l).map(([h,f])=>({h,f})), repoHref:this.props.repoUrl||'NETTSIDE_PUBLISERING.md' }; }
}
</script>
</body>
</html>
