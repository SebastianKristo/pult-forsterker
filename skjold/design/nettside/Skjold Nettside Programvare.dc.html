<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Skjold – Programvare</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="site/skjold_site_data.js"></script>
<script src="site/skjold_site_fx.js"></script>
<style>html{scroll-behavior:smooth}body{margin:0;background:#000;color:#f5f5f2;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:hover{opacity:.8}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh">
  <dc-import name="Skjold Nav" active="Programvare" hint-size="100%,52px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <section style="padding:110px 22px 60px;text-align:center">
    <div data-reveal="0" style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;color:#d8cfb4">SKJOLD OS</div>
    <h1 data-reveal="80" style="margin:14px auto 0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(44px,8vw,92px);line-height:1;letter-spacing:-.025em;max-width:900px;text-wrap:balance">{{ t.swH }}</h1>
  </section>
  <section style="padding:0 22px 40px">
    <div style="max-width:1080px;margin:0 auto;border-radius:28px;overflow:hidden;background:#ecebe7"><img data-zoom="1" src="renders/02-node.png" alt="Skjold OS" style="display:block;width:100%;transform-origin:50% 50%"></div>
  </section>
  <section style="padding:40px 22px 110px">
    <div style="max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px">
      <sc-for list="{{ sw }}" as="a" hint-placeholder-count="4">
        <a href="{{ a.href }}" data-reveal="{{ a.d }}" style="background:#111113;border-radius:24px;padding:30px 26px;display:flex;flex-direction:column;gap:10px;min-height:250px">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d8cfb4;letter-spacing:.08em">{{ a.k }}</div>
          <div style="font-family:Sora,sans-serif;font-size:25px;font-weight:600;line-height:1.15">{{ a.h }}</div>
          <div style="font-size:15.5px;line-height:1.5;color:#a8a8a3;flex:1;text-wrap:pretty">{{ a.p }}</div>
          <div style="font-size:15px">{{ t.open }} ›</div>
        </a>
      </sc-for>
    </div>
  </section>
  <section id="integrasjoner" data-screen-label="Integrations" style="padding:110px 22px;background:#fff;color:#1d1d1b">
    <div style="max-width:1080px;margin:0 auto">
      <div data-reveal="0" style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;color:#7a776d">{{ t.intK }}</div>
      <h2 data-reveal="60" style="margin:12px 0 0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.02em;max-width:760px;text-wrap:balance">{{ t.intH }}</h2>
      <div style="margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px">
        <sc-for list="{{ integ }}" as="i" hint-placeholder-count="4">
          <div data-reveal="{{ i.d }}" style="background:#f5f4f0;border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:10px;min-height:250px">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#8a7f60">{{ i.k }}</div>
            <div style="font-family:Sora,sans-serif;font-size:26px;font-weight:600;letter-spacing:-.01em">{{ i.h }}</div>
            <div style="font-size:15px;line-height:1.5;color:#55534c;text-wrap:pretty">{{ i.p }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>
  <section style="padding:110px 22px;background:#f5f4f0;color:#1d1d1b">
    <div style="max-width:1080px;margin:0 auto">
      <h2 data-reveal="0" style="margin:0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(34px,5vw,56px);letter-spacing:-.02em">{{ t.osH }}</h2>
      <div style="margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 48px">
        <sc-for list="{{ os }}" as="f" hint-placeholder-count="6">
          <div data-reveal="0" style="padding:22px 0;border-top:1px solid #d9d6cc;display:flex;flex-direction:column;gap:6px">
            <div style="font-family:Sora,sans-serif;font-size:20px;font-weight:600">{{ f.h }}</div>
            <div style="font-size:15.5px;line-height:1.5;color:#55534c">{{ f.p }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>
  <footer style="padding:40px 22px 60px;background:#000;border-top:1px solid #1c1c1e">
    <div style="max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:#8b8b86"><div>{{ t.footer }}</div><div style="font-family:'IBM Plex Mono',monospace">skjold.smarthjemexperten.no</div></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={l:'no'};
  componentDidMount(){ const go=()=>{ if(!window.SKJOLD_SITE||!window.SKJOLD_FX){ this.to=setTimeout(go,50); return; } this.setState({l:window.SKJOLD_SITE.lang()}); window.SKJOLD_FX.init(); }; go(); this.onL=()=>this.setState({l:window.SKJOLD_SITE.lang()}); window.addEventListener('skjold-lang',this.onL); }
  componentWillUnmount(){ clearTimeout(this.to); window.removeEventListener('skjold-lang',this.onL); }
  renderVals(){ const S=window.SKJOLD_SITE; if(!S) return {}; const l=this.state.l;
    return { t:S.ui[l], sw:S.tr(S.software,l).map((a,i)=>({...a,d:String(i*80)})), os:S.tr(S.osFeatures,l).map(([h,p])=>({h,p})), integ:S.tr(S.integrations,l).map(([h,k,p],i)=>({h,k,p,d:String(i*80)})) }; }
}
</script>
</body>
</html>
