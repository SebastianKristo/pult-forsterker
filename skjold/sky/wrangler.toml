# Skjold-hjem – sky-relé (se README.md og docs/SKJOLD_HJEM.md)
name = "skjold-hjem"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
keep_vars = true

# Egen adresse. custom_domain = true lager DNS-posten og sertifikatet automatisk (sonen skjold-lab.com ligger i samme
# Cloudflare-konto). API-tokenet i GitHub trenger «Workers Routes: Edit» for sonen.
routes = [
  { pattern = "hjem.skjold-lab.com", custom_domain = true }
]

# Web-UI-et (skjold/app) bygges i CI før deploy og legges ut som statiske filer.
# Worker-koden kjøres først for /api/* og /enhet/*; alt annet hentes fra ASSETS (SPA-fallback til index.html).
[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/enhet/*"]

[[durable_objects.bindings]]
name = "STED"
class_name = "Sted"

[[durable_objects.bindings]]
name = "KONTO"
class_name = "Konto"

[[durable_objects.bindings]]
name = "KODER"
class_name = "Koder"

[[durable_objects.bindings]]
name = "HOYTTALERE"
class_name = "Hoyttalere"

[[durable_objects.bindings]]
name = "DELINGER"
class_name = "Delinger"

# SQLite-baserte Durable Objects (gratisplanen)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sted", "Konto", "Koder"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hoyttalere"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Delinger"]

# Variabler settes i dashbordet (Workers & Pages → skjold-hjem → Settings → Variables and Secrets) eller med
# «npx wrangler secret put NAVN», og beholdes ved deploy (keep_vars):
#   ACCESS_TEAM_DOMAIN – Access-teamet, f.eks. «smarthjem» eller «smarthjem.cloudflareaccess.com»
#   MOD_TOKEN          – (valgfri) moderatornøkkel for /hoyttaler/moder (Bearer)
#   ACCESS_AUD         – «Application Audience (AUD) Tag» fra Access-applikasjonen
# Når begge er satt verifiseres JWT-en fra Access (Cf-Access-Jwt-Assertion). Uten dem avvises alle /api/hjem-kall,
# med mindre DEV_INSECURE = "1" (bare lokalt: «npx wrangler dev --var DEV_INSECURE:1», godtar headeren X-Skjold-User).
