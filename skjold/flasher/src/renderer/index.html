<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
<title>Skjold Flasher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <div class="titlebar"><span>Skjold Flasher</span></div>
  <div class="layout">
    <aside>
      <div class="brand">
        <div class="bars"><i style="height:9px"></i><i style="height:13px"></i><i style="height:18px"></i><i style="height:13px"></i><i style="height:9px"></i></div>
        <div class="brand-t"><b>SKJOLD</b><span id="ver">FLASHER 1.0</span></div>
      </div>
      <div id="steps" class="steps"></div>
      <div id="imginfo" class="imginfo"></div>
    </aside>
    <main>
      <div id="page" class="page"></div>
      <div class="footer">
        <button id="back" class="btn ghost" hidden>Tilbake</button>
        <button id="next" class="btn primary">Neste</button>
      </div>
    </main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
