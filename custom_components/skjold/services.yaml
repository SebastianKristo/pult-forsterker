presence_mode:
  name: Tilstede-modus
  description: Slå tilstede-modus («Bortreise») av eller på. Skjold spiller da radio i tilfeldige økter med lavt volum.
  fields:
    "on":
      name: På
      description: true for på, false for av.
      required: true
      default: true
      selector:
        boolean:
    entry_id:
      name: Enhet
      description: Valgfritt – bare denne Skjold-enheten (config entry). Tom = alle.
      selector:
        config_entry:
          integration: skjold

set_eq_profile:
  name: Sett EQ-profil
  description: Velg en ferdig lydprofil (Flat, Bass+, Vokal, Kveld, Podkast …) for kilden som spiller, eller en bestemt kilde.
  fields:
    entity_id:
      name: Skjold
      required: true
      selector:
        entity:
          integration: skjold
          domain: media_player
    profile:
      name: Profil
      required: true
      selector:
        select:
          options: ["Flat", "Bass+", "Vokal", "Kveld", "Podkast", "Klassisk", "Rock", "Pop", "Elektronisk", "Hip-hop", "Jazz", "Akustisk", "Små høyttalere", "Lavt volum"]
    source:
      name: Kilde
      description: Valgfritt – air, bt, radio, aux, usb eller hp. Tom = det som spiller nå.
      selector:
        select:
          options: ["air", "bt", "radio", "aux", "usb", "hp"]
ask:
  name: Spill noe til …
  description: Beskriv hva du vil høre («rolig jazz til middag»), så setter Skjold sammen en kø.
  fields:
    entity_id:
      name: Skjold
      required: true
      selector:
        entity:
          integration: skjold
          domain: media_player
    text:
      name: Ønske
      required: true
      example: rolig jazz til middag
      selector:
        text:

duck:
  name: Senk musikken og si …
  description: Senker volumet på Skjold, leser opp en tekst og/eller spiller en lyd, og løfter volumet mykt igjen etterpå (f.eks. «Vaskemaskinen er ferdig»).
  fields:
    tekst:
      name: Tekst
      description: Leses opp på norsk.
      example: Vaskemaskinen er ferdig
      selector:
        text:
    lyd:
      name: Lyd
      description: Valgfri lydfil (http/https) som spilles oppå musikken.
      selector:
        text:
    db:
      name: Senk med (dB)
      description: Hvor mye volumet senkes. Tom = innstillingen på Skjold (standard −20 dB).
      selector:
        number:
          min: -60
          max: -3
          unit_of_measurement: dB
    sekunder:
      name: Hold nede (sekunder)
      description: Hvor lenge musikken holdes nede etter varselet.
      default: 0
      selector:
        number:
          min: 0
          max: 300
    entry_id:
      name: Enhet
      description: Valgfritt – bare denne Skjold-enheten. Tom = alle.
      selector:
        config_entry:
          integration: skjold
