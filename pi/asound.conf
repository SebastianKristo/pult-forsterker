# /etc/asound.conf – alle digitale kilder (AirPlay, Bluetooth, USB) deler DAC-en via dmix
pcm.dac {
  type hw
  card 0
}
pcm.dmixer {
  type dmix
  ipc_key 1024
  ipc_perm 0666
  slave {
    pcm "dac"
    rate 44100
    format S32_LE
    channels 2
    period_size 1024
    buffer_size 8192
  }
}
pcm.!default {
  type plug
  slave.pcm "dmixer"
}
ctl.!default {
  type hw
  card 0
}
