# /etc/asound.conf – alle digitale kilder (AirPlay, Bluetooth, USB) deler én dmix som går inn i
# en ALSA-loopback. CamillaDSP leser fra loopbacken (hw:Loopback,1), legger på loudness og
# digitalt volum, og skriver til DAC-en (hw:sndrpihifiberry).
pcm.loop_out {
  type hw
  card Loopback
  device 0
}
pcm.dmixer {
  type dmix
  ipc_key 1024
  ipc_perm 0666
  slave {
    pcm "loop_out"
    rate 44100
    format S32_LE
    channels 2
    period_size 1024
    buffer_size 8192
  }
}
pcm.!default {
  type plug
  slave.pcm "dmixer"
}
# Direkte til DAC-en (brukes bare av CamillaDSP)
pcm.dac {
  type hw
  card sndrpihifiberry
}
ctl.!default {
  type hw
  card sndrpihifiberry
}
