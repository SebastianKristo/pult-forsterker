# /etc/asound.conf – alle digitale kilder deler én dmix som går inn i en ALSA-loopback. CamillaDSP leser fra
# loopbacken (hw:Loopback,1), legger på loudness og hovedvolum, og skriver til DAC-en.
# Hver kilde har sitt eget nivå (softvol-kontroll «KI …» på kortet Loopback) så kildene kan mikses med hvert sitt volum.
pcm.loop_out {
  type hw
  card Loopback
  device 0
}
pcm.dmixer {
  type dmix
  ipc_key 1024
  ipc_perm 0666
  slave {
    pcm "loop_out"
    rate 48000
    format S32_LE
    channels 2
    period_size 1024
    buffer_size 8192
  }
}
pcm.!default {
  type plug
  slave.pcm "dmixer"
}
# Kilder med eget nivå: airplay, bt, usb, radio, aux1, aux2 (0–100, lineært i dB fra −60 til 0)
pcm.airplay { type plug; slave.pcm "sv_airplay" }
pcm.bt      { type plug; slave.pcm "sv_bt" }
pcm.usb     { type plug; slave.pcm "sv_usb" }
pcm.radio   { type plug; slave.pcm "sv_radio" }
pcm.aux1    { type plug; slave.pcm "sv_aux1" }
pcm.aux2    { type plug; slave.pcm "sv_aux2" }
pcm.sv_airplay { type softvol; slave.pcm "dmixer"; control { name "KI AirPlay";   card Loopback }; min_dB -60.0; max_dB 0.0; resolution 101 }
pcm.sv_bt      { type softvol; slave.pcm "dmixer"; control { name "KI Bluetooth"; card Loopback }; min_dB -60.0; max_dB 0.0; resolution 101 }
pcm.sv_usb     { type softvol; slave.pcm "dmixer"; control { name "KI USB";       card Loopback }; min_dB -60.0; max_dB 0.0; resolution 101 }
pcm.sv_radio   { type softvol; slave.pcm "dmixer"; control { name "KI Radio";     card Loopback }; min_dB -60.0; max_dB 0.0; resolution 101 }
pcm.sv_aux1    { type softvol; slave.pcm "dmixer"; control { name "KI AUX1";      card Loopback }; min_dB -60.0; max_dB 0.0; resolution 101 }
pcm.sv_aux2    { type softvol; slave.pcm "dmixer"; control { name "KI AUX2";      card Loopback }; min_dB -60.0; max_dB 0.0; resolution 101 }
# Direkte til DAC-en (brukes bare av CamillaDSP)
pcm.dac {
  type hw
  card sndrpihifiberry
}
ctl.!default {
  type hw
  card sndrpihifiberry
}
