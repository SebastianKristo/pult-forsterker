// KI Pultforsterker – /etc/shairport-sync.conf
general =
{
  name = "Pultforsterker";
  output_backend = "alsa";
  volume_range_db = 60;          // myk volumkurve på telefonen
  ignore_volume_control = "no";
  dbus_service_bus = "system";   // fjernkontroll (play/pause/neste) fra API, HA og Homey
};

alsa =
{
  output_device = "default";     // dmix (asound.conf) – deles med Bluetooth og USB
  output_format = "S32";
  output_rate = 44100;
};

metadata =
{
  enabled = "yes";
  include_cover_art = "no";
  pipe_name = "/run/shairport-sync/metadata";
  pipe_timeout = 5000;
};

sessioncontrol =
{
  session_timeout = 60;
  allow_session_interruption = "yes";
};
