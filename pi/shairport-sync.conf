// Pultforsterker – /etc/shairport-sync.conf
general =
{
  name = "Pultforsterker";
  output_backend = "alsa";
  ignore_volume_control = "yes";  // full nivå ut – telefonens volum følges av forsterkeren (pvol → /api/volume)
  dbus_service_bus = "system";   // fjernkontroll (play/pause/neste) fra API, HA og Homey
};

alsa =
{
  output_device = "airplay";     // softvol «KI AirPlay» -> dmix (asound.conf)
  output_format = "S32";
  output_rate = 48000;
};

metadata =
{
  enabled = "yes";
  include_cover_art = "yes";   // albumbilde til HA/Homey
  pipe_name = "/run/shairport-sync/metadata";
  pipe_timeout = 5000;
};

sessioncontrol =
{
  session_timeout = 60;
  allow_session_interruption = "yes";
};
