components:
  schemas:
    Status:
      type: object
      description: Hele tilstanden. Flere felt kan komme til; ukjente felt skal ignoreres.
      properties:
        power:
          type: boolean
        volume:
          type: integer
          minimum: 0
          maximum: 100
        mute:
          type: boolean
        input:
          type: string
          examples:
          - radio
        inputs:
          type: array
          items:
            type: string
        preset:
          type: integer
          description: Aktiv radiofavoritt (1-basert), 0 = ingen
        name:
          type: string
        version:
          type: string
        product:
          type: string
          enum:
          - s1
          - node
          - core
          - touch
        title:
          type: string
        artist:
          type: string
      additionalProperties: true
      required:
      - power
      - volume
      - mute
      - input
    Feil:
      type: object
      properties:
        error:
          type: string
      required:
      - error

