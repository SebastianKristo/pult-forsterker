# Generert av docs/api/gen_openapi.py – ikke rediger for hånd.
openapi: 3.1.0
info:
  title: Skjold lokalt API
  version: 1.0.0
  description: "Skjold har et åpent HTTP-API på port **8765** i hjemmenettet. Det trengs ingen nøkkel, siden API-et bare kan nås lokalt. Bruk\
    \ Skjold-hjem eller fjernstyring for tilgang utenfra.\n\n**Sanntid**\n- **SSE**: `GET /api/events` sender hele statusen (`data: {…}`) hver\
    \ gang noe endrer seg.\n- **WebSocket**: `GET /api/ws` bruker samme meldinger som Skjold Touch.\n- **MQTT** (pluginen «MQTT-bro»):\n  - status\
    \ publiseres retained på `skjold/<vertsnavn>/state`;\n  - kommandoer går til `skjold/<vertsnavn>/set` som JSON (`{\"volume\": 30}`, også `input`,\
    \ `power`, `preset`, `transport` og `mute`), eller som en ren verdi på `…/set/<felt>`;\n  - med Home Assistant-oppdagelse slått på dukker\
    \ Skjold opp av seg selv.\n\n**Eksempler**\n\n```bash\ncurl http://skjold.local:8765/api/status\ncurl -X POST http://skjold.local:8765/api/volume\
    \ -H 'content-type: application/json' -d '{\"volume\": 30}'\ncurl -N http://skjold.local:8765/api/events\n```\n\n```python\nfrom skjold import\
    \ Skjold          # sdk/python\ns = Skjold(\"skjold.local\")\ns.volume(30); s.preset(1)\nfor st in s.events(): print(st[\"title\"])\n```\n\
    \n```js\nimport { Skjold } from \"skjold\";   // sdk/js\nconst s = new Skjold(\"skjold.local\");\nawait s.power(true);\nfor await (const st\
    \ of s.events()) console.log(st.volume);\n```\n\n```yaml\n# Home Assistant – uten integrasjonen (configuration.yaml)\nrest_command:\n  skjold_volum:\n\
    \    url: http://skjold.local:8765/api/volume\n    method: POST\n    content_type: application/json\n    payload: '{\"volume\": {{ volume\
    \ }}}'\nsensor:\n  - platform: rest\n    name: Skjold volum\n    resource: http://skjold.local:8765/api/status\n    value_template: \"{{ value_json.volume\
    \ }}\"\n```\n\nPlugins kan utvide API-et. Se [PLUGINS.md](https://github.com/SebastianKristo/pult-forsterker/blob/main/docs/PLUGINS.md). Simulatoren\
    \ i `sdk/simulator` (`python -m skjold_sim`) svarer på det samme API-et uten maskinvare.\n"
  license:
    name: MIT
    identifier: MIT
