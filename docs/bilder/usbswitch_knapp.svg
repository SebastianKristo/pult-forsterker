<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" font-family="Helvetica, Arial, sans-serif">
<rect width="1500" height="930" fill="#f4f2ec"/>
<text x="30" y="46" font-size="26" font-weight="700" fill="#1b1c20">USB-switch: Pi-en trykker knappen via optokobler (PC817)</text>
<text x="30" y="74" font-size="15" fill="#555">Optokobleren holder Pi-en og switchen elektrisk adskilt. Pi-en gir en puls på 150 ms = ett trykk på knappen.</text>
<rect x="90" y="166" width="106" height="206" rx="8" fill="#1f6b3a"/>
<text x="143.0" y="154" font-size="15" font-weight="700" fill="#1b1c20" text-anchor="middle">Raspberry Pi 4 (utsnitt)</text>
<rect x="108" y="188" width="24" height="24" rx="3" fill="#e8e6df" stroke="#0b3d20"/>
<text x="120" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#555">17</text>
<text x="98" y="205" font-size="12" font-weight="400" fill="#333" text-anchor="end">3V3</text>
<rect x="154" y="188" width="24" height="24" rx="3" fill="#e8e6df" stroke="#0b3d20"/>
<text x="166" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#555">18</text>
<text x="188" y="205" font-size="12" font-weight="400" fill="#333" text-anchor="start">GPIO24</text>
<rect x="108" y="234" width="24" height="24" rx="3" fill="#e8e6df" stroke="#0b3d20"/>
<text x="120" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="#555">19</text>
<text x="98" y="251" font-size="12" font-weight="400" fill="#333" text-anchor="end">GPIO10</text>
<rect x="154" y="234" width="24" height="24" rx="3" fill="#222" stroke="#0b3d20"/>
<text x="166" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">20</text>
<text x="188" y="236" font-size="12" font-weight="700" fill="#000" text-anchor="start">GND</text>
<rect x="108" y="280" width="24" height="24" rx="3" fill="#e8e6df" stroke="#0b3d20"/>
<text x="120" y="296" font-size="11" font-weight="700" text-anchor="middle" fill="#555">21</text>
<text x="98" y="297" font-size="12" font-weight="400" fill="#333" text-anchor="end">GPIO9</text>
<rect x="154" y="280" width="24" height="24" rx="3" fill="#e0a800" stroke="#0b3d20"/>
<text x="166" y="296" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">22</text>
<text x="188" y="282" font-size="12" font-weight="700" fill="#000" text-anchor="start">GPIO25</text>
<rect x="108" y="326" width="24" height="24" rx="3" fill="#e8e6df" stroke="#0b3d20"/>
<text x="120" y="342" font-size="11" font-weight="700" text-anchor="middle" fill="#555">23</text>
<text x="98" y="343" font-size="12" font-weight="400" fill="#333" text-anchor="end">GPIO11</text>
<rect x="154" y="326" width="24" height="24" rx="3" fill="#e8e6df" stroke="#0b3d20"/>
<text x="166" y="342" font-size="11" font-weight="700" text-anchor="middle" fill="#555">24</text>
<text x="188" y="343" font-size="12" font-weight="400" fill="#333" text-anchor="start">GPIO8</text>
<polyline points="166,292 276,292 276,246 420,246" fill="none" stroke="#e0a800" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="420" y="236" width="70" height="20" rx="4" fill="#d9c7a1" stroke="#8a7a55" stroke-width="1.5"/>
<rect x="434" y="236" width="6" height="20" fill="#ff7f00"/>
<rect x="446" y="236" width="6" height="20" fill="#ff7f00"/>
<rect x="458" y="236" width="6" height="20" fill="#8b4513"/>
<text x="455" y="228" font-size="14" font-weight="700" fill="#1b1c20" text-anchor="middle">330 Ω</text>
<rect x="600" y="200" width="130" height="130" rx="8" fill="#2b2b2b"/>
<circle cx="622" cy="222" r="7" fill="#777"/>
<text x="665.0" y="261.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">PC817</text>
<text x="665.0" y="283.0" font-size="11" font-weight="400" fill="#bbb" text-anchor="middle">sett ovenfra</text>
<rect x="582" y="225" width="18" height="10" fill="#c9c9c9"/>
<rect x="582" y="295" width="18" height="10" fill="#c9c9c9"/>
<rect x="730" y="295" width="18" height="10" fill="#c9c9c9"/>
<rect x="730" y="225" width="18" height="10" fill="#c9c9c9"/>
<text x="574" y="218" font-size="13" font-weight="700" fill="#333" text-anchor="end">1 anode (+)</text>
<text x="574" y="288" font-size="13" font-weight="700" fill="#333" text-anchor="end">2 katode (−)</text>
<text x="756" y="288" font-size="13" font-weight="700" fill="#333" text-anchor="start">3 emitter → bein på 0 V</text>
<text x="756" y="218" font-size="13" font-weight="700" fill="#333" text-anchor="start">4 kollektor → bein med spenning</text>
<polyline points="490,246 562,246 562,230 582,230" fill="none" stroke="#e0a800" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="582,300 542,300 542,420 226,420 226,246 166,246" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="540" y="445" font-size="13" font-weight="700" fill="#222" text-anchor="end">Pi GND (pinne 20)</text>
<line x1="665.0" y1="140" x2="665.0" y2="192" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="665.0" y1="338" x2="665.0" y2="580" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<text x="653.0" y="578" font-size="13" font-weight="400" fill="#555" text-anchor="end">Pi-siden</text>
<text x="677.0" y="578" font-size="13" font-weight="400" fill="#555" text-anchor="start">switch-siden</text>
<rect x="990" y="115" width="300" height="330" rx="10" fill="#14365e"/>
<text x="1140.0" y="103" font-size="15" font-weight="700" fill="#1b1c20" text-anchor="middle">Ugreen-kortet, UNDERSIDEN under knappen</text>
<rect x="1080" y="205" width="120" height="120" rx="6" fill="none" stroke="#7fa6d6" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1140.0" y="270.0" font-size="12" font-weight="400" fill="#cfe0f5" text-anchor="middle">knappen (på oversiden)</text>
<circle cx="1050" cy="175" r="14" fill="#c0c0c0" stroke="#e8e8e8" stroke-width="3"/>
<circle cx="1050" cy="175" r="5" fill="#8a8a8a"/>
<circle cx="1230" cy="175" r="14" fill="#c0c0c0" stroke="#e8e8e8" stroke-width="3"/>
<circle cx="1230" cy="175" r="5" fill="#8a8a8a"/>
<circle cx="1050" cy="355" r="14" fill="#c0c0c0" stroke="#e8e8e8" stroke-width="3"/>
<circle cx="1050" cy="355" r="5" fill="#8a8a8a"/>
<circle cx="1230" cy="355" r="14" fill="#c0c0c0" stroke="#e8e8e8" stroke-width="3"/>
<circle cx="1230" cy="355" r="5" fill="#8a8a8a"/>
<line x1="1064" y1="175" x2="1216" y2="175" stroke="#ffb347" stroke-width="3" stroke-dasharray="5 4"/>
<line x1="1064" y1="355" x2="1216" y2="355" stroke="#7fd6a6" stroke-width="3" stroke-dasharray="5 4"/>
<text x="1140.0" y="161" font-size="12" font-weight="400" fill="#ffb347" text-anchor="middle">A1–A2 henger sammen</text>
<text x="1140.0" y="383" font-size="12" font-weight="400" fill="#7fd6a6" text-anchor="middle">B1–B2 henger sammen</text>
<text x="1140.0" y="415" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">trykk = A kobles til B</text>
<circle cx="1050" cy="175" r="7" fill="#c0392b"/>
<circle cx="1050" cy="355" r="7" fill="#1f4fa0"/>
<text x="1018" y="207" font-size="13" font-weight="700" fill="#ff8a7a" text-anchor="start">lodd her</text>
<text x="1018" y="333" font-size="13" font-weight="700" fill="#8ab4ff" text-anchor="start">lodd her</text>
<polyline points="748,230 976,230 976,175 1050,175" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="748,300 976,300 976,355 1050,355" fill="none" stroke="#1f4fa0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="554" width="1420" height="350" rx="12" fill="#fff" stroke="#d6d3cb"/>
<text x="60" y="590" font-size="18" font-weight="700" fill="#1b1c20" text-anchor="start">Slik gjør du det</text>
<text x="60" y="624" font-size="15" font-weight="400" fill="#333" text-anchor="start">1. Finn de to beina: koble switchen til en PC (lampen lyser). Sett multimeterets svarte probe på skjermen til en USB-port (= GND).</text>
<text x="60" y="654" font-size="15" font-weight="400" fill="#333" text-anchor="start">    Mål de fire beina under knappen med rød probe: to av dem viser 0 V (B-paret), to viser ca. 3,3–5 V (A-paret). Bein på samme side henger sammen.</text>
<text x="60" y="684" font-size="15" font-weight="400" fill="#333" text-anchor="start">2. Lodd en tynn ledning (26–30 AWG) på ett bein med spenning (rødt) og ett bein med 0 V (blått). Ikke kortslutt mot nabopunktene. Krymp eller tape.</text>
<text x="60" y="714" font-size="15" font-weight="400" fill="#333" text-anchor="start">3. PC817 pinne 4 (kollektor) → rødt bein.  PC817 pinne 3 (emitter) → blått bein.  Snus disse, virker det ikke (men ingenting blir ødelagt).</text>
<text x="60" y="744" font-size="15" font-weight="400" fill="#333" text-anchor="start">4. Pi pinne 22 (GPIO 25) → 330 Ω → PC817 pinne 1 (prikken).  PC817 pinne 2 → Pi pinne 20 (GND).</text>
<text x="60" y="774" font-size="15" font-weight="400" fill="#333" text-anchor="start">5. Test: sett KI_AMP_USBSW_PULSE=25 i /etc/ki-amp.env, sudo systemctl restart ki-amp, og</text>
<text x="60" y="804" font-size="15" font-weight="400" fill="#333" text-anchor="start">    curl -X POST localhost:8765/api/usbsw -d '{"toggle":true}'   → lampen på switchen skal hoppe til den andre PC-en.</text>
<text x="60" y="834" font-size="15" font-weight="400" fill="#555" text-anchor="start">Deler: 1 × PC817 (DIP-4), 1 × 330 Ω, tynn ledning, krympestrømpe. Knappen på switchen virker som før.</text>
</svg>