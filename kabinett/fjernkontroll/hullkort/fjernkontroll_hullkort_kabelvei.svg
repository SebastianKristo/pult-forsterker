<circle cx="116.4" cy="414.0" r="15" fill="#1d1d1f"/><text x="116.4" y="419.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<circle cx="390.3" cy="942.0" r="15" fill="#1d1d1f"/><text x="390.3" y="947.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<circle cx="182.39999999999998" cy="968.4" r="15" fill="#1d1d1f"/><text x="182.39999999999998" y="973.4" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
<circle cx="291.29999999999995" cy="1219.2" r="15" fill="#1d1d1f"/><text x="291.29999999999995" y="1224.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
<circle cx="311.1" cy="1074.0" r="15" fill="#1d1d1f"/><text x="311.1" y="1079.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text>
<circle cx="355.32" cy="1285.2" r="15" fill="#1d1d1f"/><text x="355.32" y="1290.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">6</text>
<circle cx="263.58" cy="796.8" r="15" fill="#1d1d1f"/><text x="263.58" y="801.8" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">7</text>
<text x="560" y="160" class="h">Buntene</text>
<circle cx="575" cy="200" r="15" fill="#1d1d1f"/><text x="575" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<line x1="600" y1="200" x2="650" y2="200" stroke="#2bb3a8" stroke-width="8" stroke-linecap="round"/>
<text x="665" y="206" class="l">IR-bunten (5 ledninger, 200 mm)</text>
<text x="665" y="230" class="s">TX, RX, BAT+, GND og IR-strøm. Fra IR-kortet i nesen rett ned langs VENSTRE sidevegg (kanalen på gulvet), forbi</text>
<text x="665" y="250" class="s">batteriet og MCP-en, og inn til XIAO-en i halen. Tvinn dem løst sammen.</text>
<circle cx="575" cy="292" r="15" fill="#1d1d1f"/><text x="575" y="297" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<line x1="600" y1="292" x2="650" y2="292" stroke="#d23a2c" stroke-width="8" stroke-linecap="round"/>
<text x="665" y="298" class="l">Batteriet (rød + sort, 150 mm)</text>
<text x="665" y="322" class="s">Ut fra bakkanten av batteriet, langs HØYRE sidevegg, forbi stolpen, og inn til BAT+ / BAT− på baksiden av</text>
<text x="665" y="342" class="s">XIAO-en. Lodd dem på XIAO-en før den tapes ned.</text>
<circle cx="575" cy="384" r="15" fill="#1d1d1f"/><text x="575" y="389" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
<line x1="600" y1="384" x2="650" y2="384" stroke="#e3b82b" stroke-width="8" stroke-linecap="round"/>
<text x="665" y="390" class="l">Tasteledningene (14 + GND, 30–120 mm)</text>
<text x="665" y="414" class="s">Fra hullene på kobbersiden av hullkortet rett ned til MCP-modulens pinner. Ingen bunt: hver ledning så kort som</text>
<text x="665" y="434" class="s">mulig, de henger fritt mellom kortet og MCP-en.</text>
<circle cx="575" cy="476" r="15" fill="#1d1d1f"/><text x="575" y="481" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
<line x1="600" y1="476" x2="650" y2="476" stroke="#2f6fd0" stroke-width="8" stroke-linecap="round"/>
<text x="665" y="482" class="l">MCP → XIAO (5 ledninger, 70 mm)</text>
<text x="665" y="506" class="s">SDA, SCL, INTA, 3V3 og GND fra MCP-modulens nedre kant til XIAO-en.</text>
<circle cx="575" cy="548" r="15" fill="#1d1d1f"/><text x="575" y="553" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text>
<line x1="600" y1="548" x2="650" y2="548" stroke="#2f9a52" stroke-width="8" stroke-linecap="round"/>
<text x="665" y="554" class="l">Skjermbunten (XIAO → 18p/6p, 90 mm)</text>
<text x="665" y="578" class="s">SCK, MOSI, D/C, RESET og baklys fra XIAO-en opp mellom MCP-en og pogo-kontakten til 18p-adapteren; videre 50 mm</text>
<text x="665" y="598" class="s">til 6p-adapteren. Den røde/svarte (3V3/GND) fra MCP til adapterne følger samme vei.</text>
<circle cx="575" cy="640" r="15" fill="#1d1d1f"/><text x="575" y="645" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">6</text>
<line x1="600" y1="640" x2="650" y2="640" stroke="#8a4fc0" stroke-width="8" stroke-linecap="round"/>
<text x="665" y="646" class="l">Dokken (pogo)</text>
<text x="665" y="670" class="s">+ via 1N5819 til XIAO 5V, og via 68 kΩ til MCP GPB7; − til MCP GND. Korte ledninger, rett mot XIAO-en og</text>
<text x="665" y="690" class="s">MCP-en.</text>
<circle cx="575" cy="732" r="15" fill="#1d1d1f"/><text x="575" y="737" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">7</text>
<line x1="600" y1="732" x2="650" y2="732" stroke="#c9a227" stroke-width="8" stroke-linecap="round"/>
<text x="665" y="738" class="l">Flatkablene fra skjermen</text>
<text x="665" y="762" class="s">Kommer ovenfra (skjermen ligger i toppen) ned bak glasset, inn i FPC-adapterne med kontaktene ned. Kobles helt</text>
<text x="665" y="782" class="s">til slutt, før hullkortet legges på.</text>
<text x="560" y="834" class="h">Regler</text>
<text x="560" y="869" class="s">• Alt under hullkortet må ligge flatt: det er bare ca. 0,5 mm luft mellom delene på gulvet og bryterbeina.</text>
<text x="560" y="897" class="s">• Legg ledningene langs sideveggene og i kanalene, aldri over XIAO-ens USB-C eller oppå MCP-brikken.</text>
<text x="560" y="925" class="s">• Hold ledningene unna de grå stolpene og pinnene: de klemmer hullkortet fast og må gå klar.</text>
<text x="560" y="953" class="s">• Klipp bryterbeina til 0,8 mm under kortet, og legg krympestrømpe på alle småkomponentene.</text>
<text x="560" y="981" class="s">• Fest buntene med en stripe kaptontape eller en dråpe lim, så de ikke flytter seg når toppen skrus på.</text>
<text x="560" y="1009" class="s">• Gjør gjennomgangstesten med multimeter før batteriet kobles til.</text>
</svg>