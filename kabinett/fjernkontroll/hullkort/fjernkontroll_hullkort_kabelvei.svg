<text x="271.5" y="394.20000000000005" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">LiPo 603450</text>
<text x="271.5" y="412.20000000000005" text-anchor="middle" font-size="12" fill="#1d1d1f">i lomma · 1 mm skumtape</text>
<rect x="213.75" y="1327.44" width="115.5" height="138.5999999999999" rx="4" fill="#4a4a4c" stroke="#111" stroke-width="2.5"/>
<text x="271.5" y="1396.74" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">XIAO</text>
<text x="271.5" y="1414.74" text-anchor="middle" font-size="12" fill="#fff">USB-C ut i halen</text>
<rect x="241.79999999999998" y="1426.44" width="59.400000000000006" height="46.19999999999982" rx="4" fill="#9a988f" stroke="#555" stroke-width="2.5"/>
<rect x="147.75" y="1014.5999999999999" width="138.60000000000002" height="171.60000000000014" rx="4" fill="#9c86c9" stroke="#4a3680" stroke-width="2.5"/>
