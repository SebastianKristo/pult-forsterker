<text x="217.05" y="1118.4" text-anchor="middle" font-size="12" fill="#fff">modul</text>
<rect x="190.98000000000002" y="849.5999999999999" width="145.19999999999993" height="118.80000000000007" rx="4" fill="#e3c79c" stroke="#9b6a2a" stroke-width="2.5"/>
