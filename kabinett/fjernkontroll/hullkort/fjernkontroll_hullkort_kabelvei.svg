<text x="263.58" y="927.0" text-anchor="middle" font-size="12" fill="#1d1d1f">skjerm</text>
<rect x="284.7" y="750.6" width="85.80000000000001" height="92.39999999999998" rx="4" fill="#e3c79c" stroke="#9b6a2a" stroke-width="2.5"/>
