<text x="40" y="1008" font-size="15" fill="#33332f"><tspan font-weight="700">Gult</tspan> = ledninger fra koblingskortet. <tspan font-weight="700">Lys grå</tspan> = brukt av noe annet i S1 (lydkort, relé, USB-switch, hodetelefon, strøm). GND: hvilken som helst GND-pinne.</text>
<text x="40" y="1034" font-size="15" fill="#33332f">GPIO-ene er de Pinne-verktøyet fant på din S1. Flytter du en ledning, endre pinnen i web-UI → Pinner, så følger Skjold etter.</text>
