<text x="40" y="84" class="s">Pinnene fra pi/config/s1f_pins.yaml (rev F). Sort = GND. Hver knapp: NO til GPIO, C til GND. Hvert lys: GPIO → 1 kΩ → transistor (S8050/AO3400), LED-ringens + til +24 V.</text>
