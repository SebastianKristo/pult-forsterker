<text x="40" y="1144" class="s">LED-ringene: + til +24 V (eller +5 V for 5 V-ringer), − til transistorens C (kollektor). Ikke koble lysene rett på Pi-en.</text>
<text x="40" y="1168" class="s">Reléet: IN til GPIO27, VCC til 5,1 V, GND til felles GND. COM til +24 V etter bryteren, NO til forsterkerens VCC (ikke NC).</text>
<text x="40" y="1192" class="s">Volumet snur feil vei: bytt A og B. GPIO 9/10/11 er SPI-pinnene, så SPI må være av.</text>
</svg>