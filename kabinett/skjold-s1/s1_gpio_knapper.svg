<text x="40" y="1100" class="m" font-weight="400">RADIO</text><text x="230" y="1100" class="m" font-weight="400">GPIO13 · pinne 33</text><text x="560" y="1100" class="m" font-weight="400">GPIO24 · pinne 18</text>
<text x="40" y="1130" class="m" font-weight="400">USB</text><text x="230" y="1130" class="m" font-weight="400">GPIO16 · pinne 36</text><text x="560" y="1130" class="m" font-weight="400">GPIO25 · pinne 22</text>
<text x="40" y="1160" class="m" font-weight="400">Volum (EC11)</text><text x="230" y="1160" class="m" font-weight="400">A GPIO9 · 21 · B GPIO10 · 19</text><text x="560" y="1160" class="m" font-weight="400">trykk D GPIO11 · 23 · C og E til GND</text>
<text x="40" y="1190" class="m" font-weight="400">Relé</text><text x="230" y="1190" class="m" font-weight="400">IN ← GPIO27 · pinne 13</text><text x="560" y="1190" class="m" font-weight="400">VCC ← 5V (pinne 2) · GND ← pinne 14</text>
<text x="40" y="1226" class="s">Den andre polen på alle knappene og C/E på volumknappen går til GND (pinne 6, 9, 14, 20, 25, 30, 34 eller 39).</text>
<rect x="1100" y="150" width="440" height="600" rx="16" fill="#fff" stroke="#1d1d1f" stroke-width="2"/>
<text x="1120" y="186" class="t">Én knapp med LED-ring</text>
<text x="1120" y="210" class="s">Gjelder alle fem (bytt GPIO-ene)</text>
<text x="1160" y="256" class="l">Bryter (NO og C)</text>
<circle cx="1180" cy="290" r="6" fill="#1d1d1f"/><circle cx="1270" cy="290" r="6" fill="#1d1d1f"/><line x1="1180" y1="290" x2="1260" y2="270" stroke="#1d1d1f" stroke-width="3"/>
<line x1="1180" y1="290" x2="1180" y2="340" stroke="#2f6fd6" stroke-width="4"/><text x="1188" y="336" class="m">→ knappe-GPIO</text>
<line x1="1270" y1="290" x2="1410" y2="290" stroke="#1d1d1f" stroke-width="4"/><text x="1418" y="295" class="m">GND</text>
<text x="1160" y="406" class="l">LED-ring (+ og −)</text>
<text x="1160" y="432" class="m">+ → +24 V (eller +5 V for 5 V-ringer)</text>
<polygon points="1310,450 1350,450 1330,480" fill="#e8862a"/><line x1="1310" y1="480" x2="1350" y2="480" stroke="#1d1d1f" stroke-width="3"/>
<line x1="1330" y1="480" x2="1330" y2="530" stroke="#1d1d1f" stroke-width="3"/><text x="1340" y="512" class="m">− (katode)</text>
<circle cx="1330" cy="570" r="30" fill="none" stroke="#1d1d1f" stroke-width="2.5"/>
<line x1="1330" y1="530" x2="1330" y2="556" stroke="#1d1d1f" stroke-width="3"/><text x="1368" y="556" class="m">C (kollektor)</text>
<line x1="1330" y1="584" x2="1330" y2="640" stroke="#1d1d1f" stroke-width="3"/><text x="1368" y="590" class="m">E (emitter) → GND</text>
<line x1="1300" y1="570" x2="1240" y2="570" stroke="#e8862a" stroke-width="3"/><rect x="1190" y="560" width="50" height="20" fill="#fff" stroke="#1d1d1f" stroke-width="2"/><text x="1215" y="600" text-anchor="middle" class="m">1 kΩ</text>
<line x1="1190" y1="570" x2="1160" y2="570" stroke="#e8862a" stroke-width="4"/><text x="1160" y="554" class="m">lys-GPIO</text>
<text x="1318" y="575" class="m" font-size="11">B</text>
<text x="1120" y="670" class="s">Transistor: S8050 (NPN) eller AO3400 (N-MOSFET:</text>
<text x="1120" y="690" class="s">gate = B, drain = C, source = E). Én per lys.</text>
<rect x="1100" y="780" width="440" height="330" rx="16" fill="#fff" stroke="#1d1d1f" stroke-width="2"/>
<text x="1120" y="816" class="t">Relémodul (5 V, 1 kanal)</text>
<text x="1120" y="840" class="s">Slår 24 V til forsterkeren av og på</text>
<rect x="1120" y="862" width="58" height="26" rx="6" fill="#b91c1c"/><text x="1149" y="880" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="700" fill="#fff">IN</text><text x="1192" y="880" class="m">GPIO27 · pinne 13 (høy = på)</text>
<rect x="1120" y="902" width="58" height="26" rx="6" fill="#d63b2f"/><text x="1149" y="920" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="700" fill="#fff">VCC</text><text x="1192" y="920" class="m">5,1 V (omformeren eller pinne 2)</text>
<rect x="1120" y="942" width="58" height="26" rx="6" fill="#1d1d1f"/><text x="1149" y="960" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="700" fill="#fff">GND</text><text x="1192" y="960" class="m">GND (pinne 14)</text>
<rect x="1120" y="982" width="58" height="26" rx="6" fill="#d63b2f"/><text x="1149" y="1000" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="700" fill="#fff">COM</text><text x="1192" y="1000" class="m">+24 V etter bryteren</text>
<rect x="1120" y="1022" width="58" height="26" rx="6" fill="#e8862a"/><text x="1149" y="1040" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="700" fill="#fff">NO</text><text x="1192" y="1040" class="m">forsterkerens VCC (TPA3116)</text>
<text x="1120" y="1090" class="s">Bruk NO (ikke NC), så forsterkeren er av til Skjold har startet.</text>
