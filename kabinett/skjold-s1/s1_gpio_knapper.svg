<text x="40" y="980" class="m" font-weight="700">Knapp</text><text x="230" y="980" class="m" font-weight="700">Knapp → pinne</text><text x="560" y="980" class="m" font-weight="700">Lys (via transistor) → pinne</text>
<text x="40" y="1010" class="m" font-weight="400">Av/på</text><text x="230" y="1010" class="m" font-weight="400">GPIO17 · pinne 11</text><text x="560" y="1010" class="m" font-weight="400">GPIO12 · pinne 32 (PWM)</text>
<text x="40" y="1040" class="m" font-weight="400">BT/AirPlay</text><text x="230" y="1040" class="m" font-weight="400">GPIO5 · pinne 29</text><text x="560" y="1040" class="m" font-weight="400">GPIO22 · pinne 15</text>
