<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  /* Lyst og mørkt tema: Homey setter .homey-dark-mode; prefers-color-scheme som reserve. Homey-variabler brukes der de finnes. */
  :root { --acc: #c8902b; --ink: #1d1d1b; --mut: rgba(29,29,27,.6); --card: var(--homey-background-color, #ffffff); --line: rgba(0,0,0,.08);
          --art: #ece9e2; --track: rgba(0,0,0,.14); --veil: linear-gradient(90deg, rgba(255,255,255,.82), rgba(255,255,255,.6)); --bgfx: blur(28px) saturate(1.2) brightness(1.15); --pp-ink: #fff; --pp: #1d1d1b; }
  @media (prefers-color-scheme: dark) { :root:not(.homey-light-mode) { --acc: #d9a441; --ink: #f4f1ea; --mut: rgba(244,241,234,.62); --card: var(--homey-background-color, #121214); --line: rgba(255,255,255,.06);
          --art: #232326; --track: rgba(255,255,255,.18); --veil: linear-gradient(90deg, rgba(10,10,12,.55), rgba(10,10,12,.25)); --bgfx: blur(28px) saturate(1.3) brightness(.45); --pp-ink: #111; --pp: #f4f1ea; } }
  .homey-dark-mode, .homey-dark-mode :root { --acc: #d9a441; --ink: #f4f1ea; --mut: rgba(244,241,234,.62); --card: var(--homey-background-color, #121214); --line: rgba(255,255,255,.06);
          --art: #232326; --track: rgba(255,255,255,.18); --veil: linear-gradient(90deg, rgba(10,10,12,.55), rgba(10,10,12,.25)); --bgfx: blur(28px) saturate(1.3) brightness(.45); --pp-ink: #111; --pp: #f4f1ea; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--homey-font-family, -apple-system, system-ui, sans-serif); color: var(--ink); }
  .card { position: relative; overflow: hidden; border-radius: var(--homey-border-radius-default, 16px); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); padding: 14px; }
  button { border: 0; background: none; color: var(--ink); cursor: pointer; padding: 0; font: inherit; -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(.95); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--acc) var(--p,40%), var(--track) var(--p,40%)); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--pp); box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .mut { color: var(--mut); }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd { display: flex; align-items: baseline; margin-bottom: 10px; } .hd b { font-size: 15px; } .hd span { margin-left: auto; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .rad { display: grid; grid-template-columns: 44px minmax(0,1fr) 36px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .rad:first-of-type { border-top: 0; }
  .art { width: 44px; height: 44px; border-radius: 10px; background: var(--art) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--mut); }
  .art svg { width: 18px; height: 18px; }
  .n { font-size: 14px; font-weight: 600; } .s { font-size: 12px; margin: 1px 0 6px; }
  .pp { width: 36px; height: 36px; border-radius: 50%; background: var(--pp); color: var(--pp-ink); display: flex; align-items: center; justify-content: center; }
  .off { opacity: .55; } .tom { font-size: 13px; padding: 10px 0; }
  input[type=range] { height: 4px; } input[type=range]::-webkit-slider-thumb { width: 16px; height: 16px; }
</style></head><body>
<div class="card"><div class="hd"><b>Skjold</b><span class="mut" id="ant"></span></div><div id="liste"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const LOGO = '<svg viewBox="0 0 42 46" fill="currentColor"><rect x="1" y="2" width="4.6" height="22" rx="2.3"/><rect x="9" y="2" width="4.6" height="33" rx="2.3"/><rect x="18.7" y="2" width="4.6" height="42" rx="2.3"/><rect x="28.4" y="2" width="4.6" height="33" rx="2.3"/><rect x="36.4" y="2" width="4.6" height="22" rx="2.3"/></svg>', PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>', PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
let rows = {}, dragging = null;
function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function rad(s) {
  const img = s.cover || s.image;
  return `<div class="rad ${s.power ? '' : 'off'}" data-id="${esc(s.id)}"><div class="art" style="${img ? `background-image:url('${img}')` : ''}">${img ? '' : LOGO}</div>
    <div style="min-width:0"><div class="n ell">${esc(s.name)}</div><div class="s ell mut">${esc(s.power ? (s.title ? s.title + (s.artist ? ' · ' + s.artist : '') : s.inputLabel) : 'Standby')}</div>
    <input type="range" min="0" max="100" value="${s.volume}" style="--p:${s.volume}%"></div>
    <button class="pp" aria-label="Spill/pause">${s.playing ? PAUSE : PLAY}</button></div>`;
}
function render(list) {
  $('ant').textContent = list.length + (list.length === 1 ? ' rom' : ' rom');
  if (!list.length) { $('liste').innerHTML = '<div class="tom mut">Ingen Skjold-enheter er lagt til i Homey ennå.</div>'; }
  else if (!dragging) {
    $('liste').innerHTML = list.map(rad).join('');
    $('liste').querySelectorAll('.rad').forEach((r) => {
      const id = r.dataset.id, v = r.querySelector('input');
      r.querySelector('.pp').addEventListener('click', () => act({ device: id, type: 'toggle' }));
      v.addEventListener('input', () => { dragging = id; v.style.setProperty('--p', v.value + '%'); });
      v.addEventListener('change', () => { dragging = null; act({ device: id, type: 'volume', value: Number(v.value) }); });
    });
  }
  Homey.ready({ height: document.querySelector('.card').offsetHeight });
}
async function load() { try { render(await Homey.api('GET', '/all')); } catch (e) { $('liste').innerHTML = '<div class="tom mut">' + esc(e.message || e) + '</div>'; } }
async function act(b) { try { await Homey.api('POST', '/action', b); load(); } catch (e) { Homey.alert && Homey.alert(e.message || String(e)); } }
function onHomeyReady(Homey) { window.Homey = Homey; load(); setInterval(load, 4000); }
</script></body></html>
